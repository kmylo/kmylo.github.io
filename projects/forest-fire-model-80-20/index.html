<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOC: Self-Organized Criticality — Forest Fire Model 80/20</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        margin: 0;
        display: flex;
        height: 100vh;
        background-color: #050505;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      #left-panel {
        flex: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #000;
        position: relative;
      }
      #right-panel {
        flex: 1.5;
        background-color: #111;
        border-left: 2px solid #333;
        display: flex;
        flex-direction: column;
      }
      #toolbar {
        position: absolute;
        top: 15px;
        left: 15px;
        background: rgba(0, 0, 0, 0.85);
        padding: 15px;
        border-radius: 8px;
        z-index: 10;
        font-size: 13px;
        border: 1px solid #333;
      }
      .stats-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-weight: bold;
        color: #00ffcc;
      }
      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      button {
        background: #222;
        color: white;
        border: 1px solid #555;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }
      button:hover {
        background: #444;
      }
      #chart-container {
        flex: 1.5;
        padding: 10px;
        border-bottom: 2px solid #333;
        min-height: 250px;
      }
      #log-container {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        background-color: #0a0a0a;
      }
      .log-entry {
        margin: 4px 0;
        font-size: 12px;
        font-family: monospace;
        border-left: 3px solid #444;
        padding-left: 8px;
        color: #888;
      }
      .log-entry.medium {
        border-left-color: #f1c40f;
        color: #f1c40f;
      }
      .log-entry.massive {
        border-left-color: #ff0055;
        color: #ff5588;
        font-weight: bold;
        background: rgba(255, 0, 85, 0.1);
      }
      h2 {
        font-size: 14px;
        color: #ff0055;
        text-align: center;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
        margin: 10px 0;
      }
      h3 {
        font-size: 13px;
        color: #bbb;
        text-align: center;
        margin: 0 0 10px 0;
      }
      canvas#forestCanvas {
        box-shadow: 0 0 30px rgba(255, 68, 0, 0.1);
        border: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <div id="left-panel">
      <div id="toolbar">
        <div class="stats-row">
          <span>Generation:</span> <span id="time-counter">0</span>
        </div>
        <div style="color: #bbb; margin-bottom: 5px">
          Current Density: <span id="density-counter">0</span>%
        </div>
        <div class="btn-group">
          <button id="btn-pause">Pause</button>
          <button id="btn-restart">Reset</button>
        </div>
      </div>
      <canvas id="forestCanvas"></canvas>
    </div>

    <div id="right-panel">
      <h2>MACRO HISTORY (5000 GENERATIONS)</h2>
      <div id="chart-container"><canvas id="timeChart"></canvas></div>
      <div id="log-container">
        <h3>FIRE EVENT LOG</h3>
        <div id="avalanche-log"></div>
      </div>
    </div>

    <script>
      const cols = 150;
      const rows = 150;
      const cellSize = 4;
      const totalCells = cols * rows;

      const pGrow = 0.002;
      const BURN_TIME = 8;

      let grid = Array.from({ length: rows }, () => new Array(cols).fill(0));
      let nextGrid = Array.from({ length: rows }, () =>
        new Array(cols).fill(0)
      );

      let isPaused = false;
      let timeSteps = 0;
      let treesInCurrentFire = 0;
      let fireActive = false;

      const timeCounterEl = document.getElementById('time-counter');
      const densityCounterEl = document.getElementById('density-counter');
      const logDiv = document.getElementById('avalanche-log');
      const canvas = document.getElementById('forestCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = cols * cellSize;
      canvas.height = rows * cellSize;

      const maxDataPoints = 500;
      const ctxChart = document.getElementById('timeChart').getContext('2d');
      const timeChart = new Chart(ctxChart, {
        type: 'line',
        data: {
          labels: Array(maxDataPoints).fill(''),
          datasets: [
            {
              label: 'Tree Density',
              data: Array(maxDataPoints).fill(0),
              borderColor: '#2ECC71',
              borderWidth: 1.5,
              pointRadius: 0,
              tension: 0.1,
              yAxisID: 'y',
            },
            {
              label: 'Active Fire',
              data: Array(maxDataPoints).fill(0),
              borderColor: '#E74C3C',
              borderWidth: 1.5,
              pointRadius: 0,
              tension: 0.1,
              yAxisID: 'y1',
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: { display: false },
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              max: totalCells,
              ticks: { color: '#2ECC71' },
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              suggestedMax: 100,
              grid: { drawOnChartArea: false },
              ticks: { color: '#E74C3C' },
            },
          },
        },
      });

      document.getElementById('btn-pause').addEventListener('click', (e) => {
        isPaused = !isPaused;
        e.target.innerText = isPaused ? 'Resume' : 'Pause';
        e.target.style.backgroundColor = isPaused ? '#ff0055' : '#222';
      });

      document.getElementById('btn-restart').addEventListener('click', () => {
        grid = Array.from({ length: rows }, () => new Array(cols).fill(0));
        timeSteps = 0;
        treesInCurrentFire = 0;
        fireActive = false;
        logDiv.innerHTML = '';
        timeChart.data.datasets.forEach((ds) => ds.data.fill(0));
      });

      function logFire(size) {
        if (size === 0) return;
        const entry = document.createElement('div');
        if (size > 2500) {
          entry.className = 'log-entry massive';
          entry.innerText = `[Gen ${timeSteps}] 🔥 MASSIVE: ${size} trees.`;
        } else if (size > 100) {
          entry.className = 'log-entry medium';
          entry.innerText = `[Gen ${timeSteps}] 🟧 Medium: ${size} trees.`;
        } else {
          entry.className = 'log-entry';
          entry.innerText = `[Gen ${timeSteps}] ▫️ Spark: ${size} trees.`;
        }
        logDiv.prepend(entry);
        if (logDiv.children.length > 50) logDiv.removeChild(logDiv.lastChild);
      }

      function updateForest() {
        let totalTrees = 0;
        let totalFire = 0;
        let fireInGrid = false;

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (grid[y][x] >= 2) fireInGrid = true;
          }
        }

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const state = grid[y][x];
            if (state === 0) {
              nextGrid[y][x] = Math.random() < pGrow ? 1 : 0;
            } else if (state === 1) {
              totalTrees++;
              const neighbors = [
                y > 0 ? grid[y - 1][x] : 0,
                y < rows - 1 ? grid[y + 1][x] : 0,
                x > 0 ? grid[y][x - 1] : 0,
                x < cols - 1 ? grid[y][x + 1] : 0,
              ];
              nextGrid[y][x] = neighbors.some((v) => v >= 2) ? 2 : 1;
            } else if (state >= 2) {
              totalFire++;
              nextGrid[y][x] = state >= BURN_TIME ? 0 : state + 1;
            }
          }
        }

        if (!fireInGrid && Math.random() < 0.15) {
          let rx = Math.floor(Math.random() * cols);
          let ry = Math.floor(Math.random() * rows);
          if (nextGrid[ry][rx] === 1) nextGrid[ry][rx] = 2;
        }

        if (totalFire > 0) {
          fireActive = true;
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              if (nextGrid[y][x] === 2) treesInCurrentFire++;
            }
          }
        } else if (fireActive && totalFire === 0) {
          logFire(treesInCurrentFire);
          fireActive = false;
          treesInCurrentFire = 0;
        }

        let temp = grid;
        grid = nextGrid;
        nextGrid = temp;

        timeCounterEl.innerText = timeSteps;
        densityCounterEl.innerText = ((totalTrees / totalCells) * 100).toFixed(
          1
        );

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (grid[y][x] === 0) {
              ctx.fillStyle = '#050505';
            } else if (grid[y][x] === 1) {
              ctx.fillStyle = '#2ECC71';
            } else if (grid[y][x] >= 2) {
              let intensity = 1 - (grid[y][x] - 2) / BURN_TIME;
              let green = Math.floor(200 * intensity);
              ctx.fillStyle = `rgb(255, ${green}, 0)`;
            }
            ctx.fillRect(
              x * cellSize,
              y * cellSize,
              cellSize - 1,
              cellSize - 1
            );
          }
        }

        if (timeSteps % 10 === 0) {
          timeChart.data.datasets[0].data.push(totalTrees);
          timeChart.data.datasets[0].data.shift();
          timeChart.data.datasets[1].data.push(totalFire);
          timeChart.data.datasets[1].data.shift();
          timeChart.update();
        }
      }

      function animate() {
        if (!isPaused) {
          timeSteps++;
          updateForest();
        }
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
