<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Vektor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07020d; --ink:#f4ecff; --quiet:#a596c7;
    --accent:#29e3ff; --accent2:#ff2bd6; --panel:rgba(12,4,24,.72);
    --line:color-mix(in srgb, var(--accent) 38%, transparent);
    --good:#5dff9a; --bad:#ff5470;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font:15px/1.35 "Chakra Petch",ui-sans-serif,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none!important}
  .disp{font-family:Orbitron,"Chakra Petch",sans-serif;letter-spacing:.06em}
  .cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
  button{font:inherit;color:inherit}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none}
  .box{position:absolute;background:var(--panel);border:1px solid var(--line);padding:8px 14px;backdrop-filter:blur(4px)}
  #hPos{left:16px;top:16px;min-width:120px}
  #hPos .big{font-size:34px;font-weight:900;line-height:1}
  #hPos .big small{font-size:16px;color:var(--quiet)}
  .lbl{font-size:11px;letter-spacing:.2em;color:var(--quiet);text-transform:uppercase}
  #hTime{left:50%;top:16px;transform:translateX(-50%);text-align:center;min-width:220px}
  #hTime .big{font-size:24px;font-weight:800}
  #hTime .sub{font-size:12px;color:var(--quiet)}
  #delta{font-size:15px;font-weight:800;margin-top:2px;min-height:19px}
  #delta.good{color:var(--good);text-shadow:0 0 10px rgba(93,255,154,.5)} #delta.bad{color:var(--bad);text-shadow:0 0 10px rgba(255,84,112,.5)}
  #hSpeed{right:16px;bottom:18px;text-align:right;min-width:210px}
  #hSpeed .big{font-size:52px;font-weight:900;line-height:1;color:var(--accent);text-shadow:0 0 18px color-mix(in srgb, var(--accent) 60%, transparent)}
  #hSpeed .big small{font-size:14px;color:var(--quiet);margin-left:4px}
  .bar{height:8px;background:rgba(255,255,255,.08);margin-top:8px;position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 12px var(--accent2)}
  #mini{position:absolute;right:16px;top:16px;width:170px;height:170px;background:var(--panel);border:1px solid var(--line)}
  #toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:clamp(26px,6vw,60px);font-weight:900;
    color:var(--ink);text-shadow:0 0 24px var(--accent2),0 0 4px #fff;opacity:0;transition:opacity .25s;white-space:nowrap}
  #toast.on{opacity:1;animation:gl .45s steps(2) 2}
  @keyframes gl{
    0%{transform:translate(-50%,-50%);text-shadow:3px 0 var(--accent2),-3px 0 var(--accent)}
    25%{transform:translate(-51%,-50%) skewX(-8deg);clip-path:inset(10% 0 40% 0)}
    50%{transform:translate(-49%,-50%) skewX(6deg);clip-path:inset(50% 0 5% 0);text-shadow:-4px 0 var(--accent2),4px 0 var(--accent)}
    75%{clip-path:inset(0 0 0 0)} 100%{transform:translate(-50%,-50%)}}
  .jp{font-family:sans-serif;font-size:9px;letter-spacing:.1em;opacity:.55;margin-left:8px;text-transform:none}
  #boot{position:absolute;left:16px;top:50%;transform:translateY(-50%);font:600 12.5px "Chakra Petch",monospace;color:var(--accent);
    line-height:1.75;text-shadow:0 0 8px var(--accent);white-space:pre;text-transform:uppercase;letter-spacing:.08em}
  body.t-d9 .disp{text-shadow:1.5px 0 rgba(255,43,214,.45),-1.5px 0 rgba(41,227,255,.35)}
  #count{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:clamp(90px,20vw,190px);font-weight:900;
    color:var(--accent);text-shadow:0 0 40px var(--accent)}
  #ghostTag{position:absolute;left:16px;top:118px;font-size:11px;letter-spacing:.16em;color:var(--quiet)}
  #vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)}
  #scan{position:fixed;inset:0;pointer-events:none;opacity:.07;background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}

  /* Menú */
  .screen{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;
    background:linear-gradient(180deg,rgba(7,2,13,.1),rgba(7,2,13,.7))}
  .card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);padding:24px;backdrop-filter:blur(8px)}
  .menu{width:min(1040px,100%);display:flex;flex-direction:column;gap:16px;padding:8px 0}
  h1{margin:0;font-size:clamp(36px,7vw,58px);font-weight:900;line-height:.95;
    background:linear-gradient(90deg,var(--accent2),#b35cff 45%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px color-mix(in srgb, var(--accent2) 45%, transparent))}
  .kicker{font-size:12px;letter-spacing:.32em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tcard{pointer-events:auto;cursor:pointer;text-align:left;background:var(--panel);border:1px solid rgba(255,255,255,.12);padding:12px;
    backdrop-filter:blur(8px);transition:border-color .2s, transform .2s}
  .tcard:hover{transform:translateY(-2px)}
  .tcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 24px color-mix(in srgb, var(--accent) 35%, transparent)}
  .tcard canvas{width:100%;height:96px;display:block;margin-bottom:10px}
  .tcard .nm{font:800 15px Orbitron,sans-serif;letter-spacing:.05em}
  .tcard .pl{font-size:12px;color:var(--quiet);margin:2px 0 8px}
  .chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid rgba(255,255,255,.18);color:var(--ink)}
  .times{font-size:12px;color:var(--quiet);display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
  .times b{color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .opts{display:flex;gap:12px;flex-wrap:wrap}
  .seg{display:flex;align-items:center;gap:0;background:var(--panel);border:1px solid var(--line);padding:4px;backdrop-filter:blur(6px)}
  .seg .lbl{padding:0 10px 0 8px}
  .seg button{pointer-events:auto;cursor:pointer;border:0;background:transparent;padding:8px 12px;font:700 12px Orbitron,sans-serif;letter-spacing:.08em;color:var(--quiet)}
  .seg button.on{background:var(--accent);color:#0b0614}
  .seg button:disabled{opacity:.35;cursor:not-allowed}
  .btn{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:0;
    padding:13px 24px;font:800 15px Orbitron,sans-serif;letter-spacing:.12em;color:#13021f;
    background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 24px color-mix(in srgb, var(--accent2) 45%, transparent)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .hint{font-size:12.5px;color:var(--quiet)}
  #res .place{font-size:72px;font-weight:900;line-height:1;color:var(--accent);text-shadow:0 0 30px var(--accent)}
  #res table{width:100%;border-collapse:collapse;margin:14px 0 18px;font-size:14px}
  #res td{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  #res td:last-child{text-align:right;font-variant-numeric:tabular-nums}

  #topbtns{position:fixed;right:200px;top:16px;display:flex;gap:8px}
  .mini-btn{pointer-events:auto;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font:700 12px Orbitron,sans-serif;letter-spacing:.1em;padding:8px 10px}

  /* Temas de HUD */
  body.t-erg{--quiet:#c98a7a;--ink:#ffe9e0}
  body.t-erg .disp{text-shadow:2px 0 rgba(255,40,30,.55),-2px 0 rgba(255,140,40,.35)}
  body.t-erg #scan{opacity:.14}
  body.t-erg .box,body.t-erg #mini{border-width:1px 0;background:linear-gradient(90deg,rgba(40,4,2,.7),rgba(20,2,0,.35))}
  body.t-kryo,body.t-bahia{--quiet:#b8c4d6}

  /* Táctil */
  #touch{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
  #touch .g{display:flex;gap:12px;pointer-events:auto}
  .tb{width:74px;height:74px;display:grid;place-items:center;font:800 14px Orbitron,sans-serif;color:var(--ink);
    background:rgba(20,6,38,.55);border:1px solid var(--line);touch-action:none}
  .tb.on{background:color-mix(in srgb, var(--accent2) 40%, transparent);border-color:var(--accent2)}
  @media (pointer:fine){#touch{display:none}}
  @media (max-width:900px){ .cards{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:720px){
    .screen{place-items:start center}
    .cards{grid-template-columns:1fr 1fr;gap:8px}
    .tcard canvas{height:70px}
    .tcard .times{display:none}
    #mini{width:120px;height:120px}
    #topbtns{right:16px;top:146px;flex-direction:column}
    #hSpeed{bottom:104px;min-width:170px}
    #hSpeed .big{font-size:40px}
    #hTime{top:auto;bottom:104px;left:16px;transform:none;text-align:left;min-width:0}
    #ghostTag{top:auto;bottom:196px}
  }
</style>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body class="t-d9">
<canvas id="c"></canvas>
<div id="vign"></div><div id="scan"></div>

<div id="hud" class="hidden">
  <div id="hPos" class="box cut disp"><div class="lbl"><span id="posLbl">Posición</span><span class="jp">ポジション</span></div><div class="big"><span id="pos">1</span><small id="posOf">/4</small></div>
    <div class="lbl" style="margin-top:6px">Vuelta <span id="lap" style="color:var(--ink)">1/3</span></div></div>
  <div id="ghostTag" class="disp"></div>
  <div id="hTime" class="box cut disp"><div class="big" id="time">00:00.000</div><div id="delta"></div><div class="sub" id="split">Mejor vuelta: --</div></div>
  <div id="hSpeed" class="box cut disp"><div class="big"><span id="spd">0</span><small>KM/H</small></div>
    <div class="lbl" style="margin-top:6px">Impulso<span class="jp">ブースト</span></div><div class="bar"><i id="boost"></i></div></div>
  <div id="boot"></div>
  <canvas id="mini" class="cut"></canvas>
  <div id="topbtns"><button class="mini-btn" id="bGhost">FANTASMA</button><button class="mini-btn" id="bMusic">MÚSICA</button><button class="mini-btn" id="bPause">II</button></div>
  <div id="toast" class="disp"></div>
  <div id="count" class="disp"></div>
</div>

<div id="menu" class="screen">
  <div class="menu">
    <div><div class="kicker disp">Liga antigravedad · temporada 2099</div><h1 class="disp">NEON VEKTOR</h1></div>
    <div class="cards" id="cards"></div>
    <div class="opts">
      <div class="seg" id="segMode"><span class="lbl">Modo</span><button data-v="race">Carrera</button><button data-v="tt">Contrarreloj</button></div>
      <div class="seg" id="segGhost"><span class="lbl">Fantasma</span><button data-v="off">Apagado</button><button data-v="ref">Liga</button><button data-v="pb">Tu mejor</button></div>
    </div>
    <div class="row"><button class="btn" id="bStart">CORRER</button>
      <span class="hint">W/↑ acelerar · A D girar · S frenar · Espacio impulso · G fantasma · P pausa · M música</span></div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="card cut" style="text-align:center">
    <div class="kicker disp">Pausa</div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="bResume">SEGUIR</button>
      <button class="btn ghost" id="bRestart">REINICIAR</button><button class="btn ghost" id="bQuit">MENÚ</button></div>
  </div>
</div>

<div id="res" class="screen hidden">
  <div class="card cut">
    <div class="kicker disp" id="rKick">Carrera terminada</div>
    <div class="place disp" id="rPlace">1º</div>
    <div class="disp" id="rTime" style="font-size:20px;margin-top:6px"></div>
    <table id="rTable"></table>
    <div class="row"><button class="btn" id="bAgain">OTRA VEZ</button><button class="btn ghost" id="bMenu">MENÚ</button></div>
  </div>
</div>

<div id="touch" class="hidden">
  <div class="g"><div class="tb" data-k="left">◀</div><div class="tb" data-k="right">▶</div></div>
  <div class="g"><div class="tb" data-k="brake">FRENO</div><div class="tb" data-k="boost">BOOST</div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// CORE-START: circuitos, pista como dato, física, pilotos y fantasmas (sin DOM ni render)
const DT = 1 / 60, LAPS = 3, W = 14, HOVER = 1.25, BANK = 40, STEER = 1.9, GHOST_EVERY = 3;
const PHYS = { assist: 0.45 };
let TRACK = null, PADS = [];

// Cada circuito: puntos de control [x, y, z] y tramos especiales en unidades de punto de control.
const CIRCUITS = [
  { id: 'd9', name: 'Distrito 9', place: 'Megaciudad · noche', tags: ['Noche', 'Lluvia', 'Neón'], theme: 'city', assist: 0.45,
    cp: [[0, 0, 0], [0, 4, -200], [40, 12, -380], [180, 24, -470], [340, 30, -430], [420, 22, -300], [380, 12, -160], [430, 8, -30], [560, 18, 20],
      [680, 40, -60], [760, 60, -220], [860, 64, -360], [980, 50, -300], [1020, 36, -120], [960, 24, 80], [820, 14, 200], [620, 10, 260],
      [420, 30, 240], [240, 20, 280], [80, 6, 220], [-20, 0, 120]],
    tunnel: [4.2, 6.1], tunnelName: 'TÚNEL DE DATOS', barrel: [11.9, 13.0], barrelName: 'TIRABUZÓN' },
  { id: 'kryo', name: 'Estación Kryo', place: 'Glaciar · mediodía', tags: ['Día', 'Nieve', 'Hielo'], theme: 'arctic', assist: 0.36,
    cp: [[0, 4, 0], [190, 14, -170], [420, 22, -250], [640, 30, -210], [760, 34, -40], [700, 38, 150], [480, 42, 230], [250, 44, 140],
      [0, 44, -10], [-250, 42, -150], [-480, 34, -230], [-700, 22, -150], [-760, 12, 40], [-640, 6, 210], [-420, 2, 250], [-190, 2, 160]],
    tunnel: [2.2, 3.9], tunnelName: 'TÚNEL DE HIELO', barrel: null, cross: 'PASO ELEVADO' },
  { id: 'erg', name: 'Erg Rojo', place: 'Desierto · anochecer', tags: ['Atardecer', 'Arena', 'Chatarra'], theme: 'desert', assist: 0.42,
    cp: [[0, 8, 0], [60, 14, -260], [260, 22, -420], [520, 10, -380], [700, 18, -520], [960, 26, -480], [1100, 14, -260], [1040, 6, -20],
      [880, 12, 120], [980, 20, 320], [860, 10, 520], [600, 6, 480], [420, 16, 300], [220, 10, 380], [40, 18, 300], [-80, 12, 140]],
    tunnel: [3.1, 5.0], tunnelName: 'CAÑÓN DE LOS ARCOS', barrel: null, storm: [8.6, 11.4] },
  { id: 'bahia', name: 'Bahía Solar', place: 'Costa · día despejado', tags: ['Día', 'Sol', 'Mar'], theme: 'coast', assist: 0.45,
    cp: [[0, 10, 0], [-40, 16, -240], [60, 30, -440], [300, 46, -520], [520, 40, -420], [600, 20, -220], [760, 12, -120], [980, 24, -180],
      [1160, 40, -60], [1180, 30, 180], [1000, 16, 320], [760, 8, 300], [540, 14, 420], [300, 28, 380], [120, 20, 240]],
    tunnel: [2.3, 3.7], tunnelName: 'TÚNEL DEL ACANTILADO', barrel: [9.5, 10.5], barrelName: 'GIRO SOBRE LA BAHÍA' },
];

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function buildTrack(def) {
  const NCP = def.cp.length;
  const BAR = def.barrel ? { from: def.barrel[0] / NCP, to: def.barrel[1] / NCP } : null;
  const TUN = def.tunnel ? { from: def.tunnel[0] / NCP, to: def.tunnel[1] / NCP } : null;
  const curve = new THREE.CatmullRomCurve3(def.cp.map(p => new THREE.Vector3(...p)), true, 'centripetal');
  const N = 2400, P = [], T = [], U = [], R = [];
  for (let i = 0; i < N; i++) P.push(curve.getPoint(i / N));
  for (let i = 0; i < N; i++) T.push(new THREE.Vector3().subVectors(P[(i + 1) % N], P[(i - 1 + N) % N]).normalize());
  const S = new Float64Array(N + 1);
  for (let i = 0; i < N; i++) S[i + 1] = S[i] + P[i].distanceTo(P[(i + 1) % N]);
  const L = S[N], seg = i => S[i + 1] - S[i];
  // "Arriba" por transporte paralelo; la holonomía del lazo cerrado se reparte a lo largo de la vuelta.
  U.push(new THREE.Vector3(0, 1, 0).addScaledVector(T[0], -T[0].y).normalize());
  for (let i = 1; i < N; i++) { const u = U[i - 1].clone(); u.addScaledVector(T[i], -u.dot(T[i])).normalize(); U.push(u); }
  const end = U[N - 1].clone().addScaledVector(T[0], -U[N - 1].dot(T[0])).normalize();
  const hol = Math.atan2(new THREE.Vector3().crossVectors(U[0], end).dot(T[0]), U[0].dot(end));
  for (let i = 0; i < N; i++) U[i].applyAxisAngle(T[i], -hol * i / N);
  const dTds = i => new THREE.Vector3().subVectors(T[(i + 1) % N], T[(i - 1 + N) % N]).divideScalar(seg((i - 1 + N) % N) + seg(i));
  let ks = new Float32Array(N);
  for (let i = 0; i < N; i++) ks[i] = dTds(i).dot(new THREE.Vector3().crossVectors(T[i], U[i]));
  for (let pass = 0; pass < 2; pass++) {
    const out = new Float32Array(N), H = 30; let sum = 0;
    for (let j = -H; j <= H; j++) sum += ks[(j + N) % N];
    for (let i = 0; i < N; i++) { out[i] = sum / (2 * H + 1); sum += ks[(i + H + 1) % N] - ks[(i - H + N) % N]; }
    ks = out;
  }
  for (let i = 0; i < N; i++) {
    const roll = Math.max(-0.6, Math.min(0.6, ks[i] * BANK)) + (BAR ? Math.PI * 2 * smooth(BAR.from, BAR.to, i / N) : 0);
    U[i].applyAxisAngle(T[i], roll);
    R.push(new THREE.Vector3().crossVectors(T[i], U[i]).normalize());
  }
  const K = new Float32Array(N);                       // curvatura geodésica de la línea central
  for (let i = 0; i < N; i++) K[i] = dTds(i).dot(R[i]);
  const t = { def, curve, N, P, T, U, R, S, L, K, seg, TUN, BAR };
  t.sAtU = u => S[Math.floor(((u % 1) + 1) % 1 * N)];
  t.sAtCP = c => t.sAtU(c / NCP);
  t.pads = [0.07, 0.17, 0.29, 0.38, 0.47, 0.6, 0.69, 0.78, 0.86, 0.94].map((u, i) => ({ s: t.sAtU(u), d: [-6, 0, 6][i % 3] }));
  return t;
}
function useTrack(t) { TRACK = t; PADS = t.pads; PHYS.assist = t.def.assist; }

const _f = { p: new THREE.Vector3(), t: new THREE.Vector3(), u: new THREE.Vector3(), r: new THREE.Vector3(), k: 0, i: 0 };
function frameAt(s, o = _f) {
  const { N, P, T, U, S, K, L, seg } = TRACK;
  s = ((s % L) + L) % L;
  let lo = 0, hi = N - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (S[m] <= s) lo = m; else hi = m - 1; }
  const i = lo, j = (i + 1) % N, f = (s - S[i]) / seg(i);
  o.p.lerpVectors(P[i], P[j], f); o.t.lerpVectors(T[i], T[j], f).normalize(); o.u.lerpVectors(U[i], U[j], f);
  o.r.crossVectors(o.t, o.u).normalize(); o.u.crossVectors(o.r, o.t).normalize();
  o.k = K[i] + (K[j] - K[i]) * f; o.i = i;
  return o;
}

function makeRacer(o) {
  return { s: 0, d: 0, yaw: 0, v: 0, lap: 0, energy: 0.6, boosting: false, steer: 0, hit: 0, boostT: 0,

  for (const a of tops) {
    if (Math.random() < 0.45) continue;
    let best = null, bd = 1e9;
    for (const b of tops) { if (b === a) continue; const d = Math.hypot(a.x - b.x, a.z - b.z); if (d > 40 && d < 160 && d < bd) { bd = d; best = b; } }
    if (!best) continue;

    const mid = nearTrack((a.x + best.x) / 2, (a.z + best.z) / 2, 12);
    if (mid.d < W + 40 && Math.min(ya, yb) - sag < mid.y + 24) continue;

// Material holográfico: separación RGB, scanlines que corren, banda de barrido y parpadeo.
function holoMaterial(tex, tint, seed) {
  const m = new THREE.ShaderMaterial({
    uniforms: { map: { value: tex }, time: { value: 0 }, tint: { value: new THREE.Color(tint) }, seed: { value: seed } },
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: `uniform sampler2D map; uniform float time, seed; uniform vec3 tint; varying vec2 vUv;
      float h(float x){ return fract(sin(x * 12.9898) * 43758.5453); }
      void main(){
        float t = time + seed * 10.; vec2 uv = vUv;
        float row = floor(uv.y * 48.);
        uv.x += step(0.975, h(row + floor(t * 9.))) * (h(row * 3.1 + t) - 0.5) * 0.06;
        float sh = 0.006;
        vec4 a = texture2D(map, uv + vec2(sh, 0.)), b = texture2D(map, uv), c = texture2D(map, uv - vec2(sh, 0.));
        vec3 col = vec3(a.r, b.g, c.b);
        float scan = 0.72 + 0.28 * sin(uv.y * 260. - t * 7.);
        float sweep = exp(-pow((fract(uv.y - t * 0.15) - 0.5) * 28., 2.));
        float flick = 0.8 + 0.2 * step(0.1, h(floor(t * 14.)));
        col = col * scan * flick + tint * sweep * 0.35;
        gl_FragColor = vec4(col * 1.5, max(b.a, max(a.a, c.a)) * 0.92);
      }`,
  });
  holoMats.push(m); return m;
}

const BOX = new THREE.Vector3(180, 120, 180);

let weather = 'none', stormK = 0;
function seedWeather() {
  const c = camera.position;
  for (let i = 0; i < RAIN; i++) rainP.set([c.x + rand(-90, 90), c.y + rand(-60, 60), c.z + rand(-90, 90)], i * 3);
  for (let i = 0; i < PART; i++) partP.set([c.x + rand(-90, 90), c.y + rand(-60, 60), c.z + rand(-90, 90)], i * 3);
}
function wrapAround(arr, i, c) {
  for (let a = 0; a < 3; a++) {
    const half = BOX.getComponent(a) / 2, cc = c.getComponent(a);
    let v = arr[i * 3 + a];
    if (v - cc > half) v -= half * 2; else if (v - cc < -half) v += half * 2;
    arr[i * 3 + a] = v;
  }
}
function updateWeather(dt) {
  rain.visible = weather === 'rain'; parts.visible = weather === 'snow' || weather === 'sand';
  const c = camera.position;
  if (weather === 'rain') {
    for (let i = 0; i < RAIN; i++) {
      rainP[i * 3 + 1] -= 95 * dt; wrapAround(rainP, i, c);
      const o = i * 6; rainPos[o] = rainP[i * 3]; rainPos[o + 1] = rainP[i * 3 + 1]; rainPos[o + 2] = rainP[i * 3 + 2];
      rainPos[o + 3] = rainP[i * 3] + 0.3; rainPos[o + 4] = rainP[i * 3 + 1] + 2.4; rainPos[o + 5] = rainP[i * 3 + 2];
    }

  } else if (parts.visible) {
    const snow = weather === 'snow';
    const wx = snow ? 3 : -55 - stormK * 50, wz = snow ? 0 : 18, wy = snow ? -7 : 0;
    for (let i = 0; i < PART; i++) {
      const s = partSeed[i];
      partP[i * 3] += (wx + Math.sin(clock * 0.9 + s) * (snow ? 2.2 : 6)) * dt;
      partP[i * 3 + 1] += (wy + (snow ? 0 : Math.sin(clock * 2 + s) * 3)) * dt;
      partP[i * 3 + 2] += (wz + Math.cos(clock * 0.7 + s) * (snow ? 2.2 : 4)) * dt;
      wrapAround(partP, i, c);
    }
    parts.geometry.attributes.position.needsUpdate = true;
    parts.material.size = snow ? 0.75 : 0.5 + stormK * 0.3;
    parts.material.opacity = snow ? 0.95 : 0.45 + stormK * 0.4;
  }
}

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('color', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    const idx = []; for (let j = 0; j < M - 1; j++) { const a = j * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    g.setIndex(idx);

  update(p, side, k) {

}

function drawPreview(cv, t) {
  const w = cv.clientWidth || 220, h = cv.clientHeight || 96, dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  let a = 1e9, b = -1e9, c = 1e9, d = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p of t.P) { a = Math.min(a, p.x); b = Math.max(b, p.x); c = Math.min(c, p.z); d = Math.max(d, p.z); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  const sc = Math.min((w - 16) / (b - a), (h - 16) / (d - c)), ox = (w - (b - a) * sc) / 2, oz = (h - (d - c) * sc) / 2;
  const th = THEMES[t.def.theme];
  for (let i = 0; i < t.N; i += 6) {
    const p = t.P[i], q = t.P[(i + 6) % t.N], k = (p.y - y0) / Math.max(1, y1 - y0);
    g.strokeStyle = '#' + new THREE.Color(th.css[0]).lerp(new THREE.Color(th.css[1]), k).getHexString();
    g.lineWidth = 2 + k * 2.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(ox + (p.x - a) * sc, oz + (p.z - c) * sc); g.lineTo(ox + (q.x - a) * sc, oz + (q.z - c) * sc); g.stroke();
  }
  const p0 = t.P[0]; g.fillStyle = '#fff'; g.fillRect(ox + (p0.x - a) * sc - 3, oz + (p0.z - c) * sc - 3, 6, 6);
}

const sfx = {

});
