<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Color Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1c;
            color: #d1d5db;
        }
        .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

        /* Inputs numéricos */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] {
            -moz-appearance: textfield;
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #e4e4e7;
        }
        input[type=number]:focus { outline: none; border-color: #6366f1; }
        .num {
            width: 44px; margin-left: 8px; text-align: right;
            font-size: 11px; padding: 1px 4px; border-radius: 3px;
        }

        /* Sliders */
        .slider-row { display: flex; align-items: center; margin-bottom: 6px; }
        .slider-label {
            width: 14px; font-size: 11px; font-weight: 700;
            text-align: right; margin-right: 8px; color: #9ca3af;
        }
        .slider-wrapper {
            position: relative; flex-grow: 1; height: 14px; border-radius: 3px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .slider-bg { position: absolute; inset: 0; border-radius: 3px; z-index: 1; }
        input[type=range] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 100%; background: transparent;
            position: absolute; top: 0; left: 0; z-index: 2; margin: 0; cursor: ew-resize;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 6px; background: transparent;
            border: 1.5px solid #ffffff; border-radius: 1px;
            box-shadow: 0 0 3px rgba(0,0,0,0.8), inset 0 0 1px rgba(0,0,0,0.5);
            margin-top: -2px;
        }
        input[type=range]::-moz-range-thumb {
            height: 16px; width: 4px; background: transparent;
            border: 1.5px solid #ffffff; border-radius: 1px;
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
        input[type=range]:focus { outline: none; }

        /* Pestañas */
        .mode-tab {
            padding: 4px 8px; font-size: 10px; font-weight: bold; cursor: pointer;
            border: 1px solid transparent; color: #6b7280; transition: all 0.2s; position: relative;
            user-select: none;
        }
        .mode-tab:hover { color: #d1d5db; }
        .mode-tab.active { color: #ffffff; border-color: #4b5563; background: #27272a; border-radius: 4px; }
        .mode-tab.pinned::after {
            content: ''; position: absolute; top: 2px; right: 2px; width: 4px; height: 4px;
            background-color: #3B82F6; border-radius: 50%;
        }
        .mode-panel { display: none; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px dashed #3f3f46; }
        .mode-panel.visible { display: block; }
        .mode-panel.last-visible { padding-bottom: 0; margin-bottom: 0; border-bottom: none; }
        .panel-title { font-size: 9px; font-weight: 700; color: #6b7280; margin-bottom: 4px; letter-spacing: .05em; }
        .panel-title .warn { color: #f59e0b; font-weight: 600; margin-left: 6px; }
        .panel-title .note { color: #52525b; font-weight: 500; margin-left: 6px; letter-spacing: 0; }
        .lang-btn {
            font-size: 9px; font-weight: 700; padding: 2px 5px; color: #6b7280; cursor: pointer; background: none; border: none;
        }
        .lang-btn.active { color: #fff; background: #2e2e48; border-radius: 3px; }

        /* Rueda */
        #wheel { touch-action: none; }
        .rh {
            position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
            border: 2px solid #fff; cursor: grab; z-index: 5;
            box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 2px 5px rgba(0,0,0,.5);
        }
        .rh.main { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-width: 2.5px; z-index: 6; }
        .rh:active { cursor: grabbing; }
        .sq-handle {
            position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
            border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.4);
            pointer-events: none; z-index: 4;
        }
        .corner-btn {
            font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
            color: #6b7280; border: 1px solid #3f3f46; background: #232326; cursor: pointer;
        }
        .corner-btn.active { color: #fff; border-color: #6366f1; background: #2e2e48; }
        .shape-btn {
            width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
            border-radius: 3px; border: 1px solid #3f3f46; background: #232326; color: #6b7280; cursor: pointer;
        }
        .shape-btn:hover { color: #d1d5db; }
        .shape-btn.active { color: #fff; border-color: #6366f1; background: #2e2e48; }
        .contrast-chip {
            font-size: 8px; font-weight: 600; padding: 1px 4px; border-radius: 3px; line-height: 1.4;
            box-shadow: 0 0 0 1px rgba(255,255,255,.12); white-space: nowrap;
        }

        /* Swatches de armonía */
        .sw { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .sw-color {
            height: 34px; border-radius: 3px; cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 1px 3px rgba(0,0,0,.4);
            transition: transform .1s;
        }
        .sw-color:hover { transform: translateY(-1px); }
        .sw.base .sw-color { box-shadow: inset 0 0 0 1px rgba(0,0,0,.3), 0 0 0 1.5px #e4e4e7; }
        .sw-hex {
            font-size: 9px; color: #9ca3af; background: none; border: none; cursor: copy; padding: 0;
            text-align: center;
        }
        .sw-hex:hover { color: #fff; }

        select {
            background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7;
            font-size: 11px; border-radius: 3px; padding: 3px 6px;
        }
        select:focus { outline: none; border-color: #6366f1; }

        /* Mixer */
        .mx-row { margin-bottom: 9px; }
        .mx-row:last-child { margin-bottom: 0; }
        .mx-head {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 9px; font-weight: 700; color: #6b7280; margin-bottom: 3px; letter-spacing: .05em;
        }
        .mx-head .aux { display: flex; align-items: center; gap: 5px; font-weight: 600; color: #52525b; letter-spacing: 0; }
        .mx-strip {
            display: flex; height: 24px; border-radius: 3px; overflow: hidden;
            box-shadow: inset 0 0 0 1px #3f3f46; background: #232326;
        }
        .mx-cell { flex: 1; min-width: 0; cursor: pointer; position: relative; }
        .mx-cell:hover { filter: brightness(1.08); }
        .mx-cell.sel { box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(0,0,0,.55); z-index: 1; }
        .mx-cell.empty {
            cursor: default; filter: none;
            background: repeating-linear-gradient(45deg, #26262a 0 4px, #2b2b2f 4px 8px);
        }
        .mx-cell.stop::after {
            content: ''; position: absolute; left: 50%; top: 3px; bottom: 3px; width: 1px;
            background: rgba(0,0,0,.4); box-shadow: 1px 0 0 rgba(255,255,255,.35);
        }
        .mx-add, .mx-chip {
            width: 24px; flex: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 10px; font-weight: 700;
        }
        .mx-add { background: #27272a; color: #9ca3af; font-size: 14px; border-left: 1px solid #3f3f46; }
        .mx-add:hover { color: #fff; }
        .mx-chip { box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
        .tgl {
            width: 22px; height: 12px; border-radius: 6px; background: #3f3f46; position: relative; cursor: pointer;
        }
        .tgl.on { background: #6366f1; }
        .tgl::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px;
            border-radius: 50%; background: #fff; transition: left .15s;
        }
        .tgl.on::after { left: 12px; }
        .mx-cell.clip::before {
            content: ''; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%;
            background: #fff; box-shadow: 0 0 0 1px #000; z-index: 2;
        }
        .mx-curve { display: block; width: 100%; height: 26px; margin-top: 2px; }
        .legend-bar { display: inline-block; width: 10px; height: 2px; }
        .legend-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #000; }
        .cmp-row { margin-bottom: 8px; }
        .cmp-row:last-child { margin-bottom: 0; }
        .cmp-row.active .mx-head span:first-child { color: #c7d2fe; }
        .mx-btn {
            font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 3px;
            border: 1px solid #3f3f46; color: #9ca3af; cursor: pointer; background: none;
        }
        .mx-btn:hover { color: #fff; border-color: #6b7280; }

        #toast {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(10px);
            background: #111113; border: 1px solid #3f3f46; color: #e4e4e7; font-size: 11px;
            padding: 6px 10px; border-radius: 4px; opacity: 0; transition: all .2s; pointer-events: none; z-index: 50;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ============================================================
           Tema: cards negras con pestaña, acentos como información
           verde = picker, amarillo = mixer, rosa = espacio 3D,
           naranja = advertencia de gama
           ============================================================ */
        :root {
            --card: #0a0a0b; --card-2: #141416; --card-3: #1c1c20; --line: #232328;
            --ink: #f4f4f5; --ink-2: #a1a1aa; --ink-3: #6b6b75;
            --green: #3dff6e; --yellow: #e4ff3a; --pink: #ff2e63; --orange: #ff5a1f;
            --r: 28px; --display: 'Barlow Condensed', 'Inter', sans-serif;
        }
        /* Gris medio neutro: evita el contraste simultáneo al juzgar colores */
        body { background: #77777b !important; color: var(--ink); }
        .app { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; align-items: center; }
        .top-row { display: flex; gap: 22px; justify-content: center; align-items: flex-start; flex-wrap: wrap; width: 100%; }
        .card { position: relative; --accent: var(--green); filter: drop-shadow(0 22px 28px rgba(0,0,0,.28)); }
        .card.picker { width: 340px; max-width: 100%; }
        .card.mixer { --accent: var(--yellow); width: 380px; max-width: 100%; }
        .card.space { --accent: var(--pink); width: 100%; }
        .card-head { display: flex; align-items: flex-end; justify-content: space-between; }
        .card-tab {
            position: relative; display: inline-flex; align-items: center; gap: 10px;
            background: var(--card); border-radius: var(--r) var(--r) 0 0; padding: 14px 22px 6px 18px;
        }
        .card-tab::after {
            content: ''; position: absolute; right: -28px; bottom: 0; width: 28px; height: 28px;
            background: radial-gradient(circle at 100% 0, transparent 27.5px, var(--card) 28px);
        }
        .card-tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); flex: none; }
        .card-tab h2 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.1; color: var(--ink); }
        .card-tab small { display: block; font-size: 11px; color: var(--ink-3); margin-top: 1px; }
        .card-menu {
            display: flex; gap: 4px; padding: 8px 10px 14px; background: none; border: none; cursor: pointer;
        }
        .card-menu i { width: 5px; height: 5px; border-radius: 50%; background: #111; display: block; transition: background .15s; }
        .card-menu:hover i { background: var(--accent); }
        .card-body { background: var(--card); border-radius: 0 var(--r) var(--r) var(--r); overflow: hidden; padding-bottom: 6px; }
        .card.collapsed .card-body { display: none; }
        .card.collapsed .card-tab { border-radius: var(--r); padding-bottom: 14px; }
        .card.collapsed .card-tab::after { display: none; }
        .card.collapsed .card-menu i { background: var(--accent); }

        /* Tipografía */
        .hex-big {
            font-family: var(--display); font-weight: 300; font-size: 38px; line-height: 1; letter-spacing: .01em;
            background: transparent; border: none; color: var(--ink); width: 178px; text-align: right; padding: 0;
        }
        .hex-big:focus { outline: none; color: var(--accent); }
        .big-num { font-family: var(--display); font-weight: 300; font-size: 42px; line-height: .95; color: var(--ink); }
        .big-num sup { font-size: .38em; vertical-align: top; margin-left: 2px; color: var(--ink-2); font-weight: 400; }
        .panel-title, .mx-head, .mx-head span:first-child { color: var(--ink-3); letter-spacing: .08em; }
        .mx-head { font-size: 10px; }
        input[type=number], .num {
            background: var(--card-2) !important; border: 1px solid var(--line) !important; border-radius: 8px;
            font-family: var(--display); font-size: 15px; color: var(--ink);
        }

        /* Controles */
        .round-btn {
            width: 34px; height: 34px; border-radius: 50%; border: none; color: #d4d4d8; cursor: pointer; flex: none;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 35% 28%, #3d3d43 0%, #19191c 58%, #0e0e10 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 10px rgba(0,0,0,.6);
        }
        .round-btn:hover { color: var(--accent); }
        .lang-group { display: flex; background: var(--card-2); border-radius: 999px; padding: 2px; }
        .lang-btn { border-radius: 999px; padding: 3px 8px; font-size: 10px; }
        .lang-btn.active, .corner-btn.active, .shape-btn.active, .mode-tab.active, .pill-btn.active {
            background: var(--accent) !important; color: #0a0a0b !important; border-color: transparent !important;
        }
        .corner-btn { border-radius: 999px; background: var(--card-2); border-color: var(--line); padding: 3px 8px; }
        .shape-btn { border-radius: 7px; background: var(--card-2); border-color: var(--line); width: 22px; height: 22px; }
        .mode-tab { border-radius: 999px; padding: 4px 10px; }
        .mode-tab.active { border-radius: 999px; }
        .mode-tab.pinned::after { background: var(--accent); }
        .mode-tab.active.pinned::after { background: #0a0a0b; }
        select {
            background: var(--card-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
            color: var(--ink); font-size: 11px;
        }
        select:focus { border-color: var(--accent); }
        .tgl { background: var(--card-3); }
        .tgl.on { background: var(--accent); }
        .tgl.on::after { background: #0a0a0b; }
        .mx-btn, #copy-palette {
            border-radius: 999px !important; border: 1px solid var(--line) !important; background: var(--card-2) !important;
            color: var(--ink-2) !important; padding: 4px 10px !important;
        }
        .mx-btn:hover, #copy-palette:hover { color: var(--accent) !important; }
        .slider-wrapper, .slider-bg { border-radius: 999px; }
        .slider-wrapper { height: 12px; }
        input[type=range]::-webkit-slider-thumb { height: 18px; width: 18px; border-radius: 50%; border: 2.5px solid #fff; margin-top: -3px; }
        input[type=range]::-moz-range-thumb { height: 14px; width: 14px; border-radius: 50%; border: 2.5px solid #fff; }
        .sw-color { border-radius: 14px; height: 40px; }
        .mx-strip { border-radius: 12px; box-shadow: none; background: var(--card-2); height: 28px; }
        .mx-add { background: var(--card-3); border-left: none; }
        .contrast-chip { border-radius: 999px; }
        #toast { border-radius: 999px; background: var(--card); border-color: var(--line); padding: 8px 14px; }
        #toast::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 8px; vertical-align: 1px; }
        .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 600; }
        .pill.ok { background: var(--green); color: #04240d; }
        .pill.warn { background: var(--orange); color: #2a0d00; }

        /* Panel 3D */
        .space-body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; padding: 18px; }
        @media (max-width: 880px) { .space-body { grid-template-columns: minmax(0, 1fr); } }
        .sp-toolbar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .pill-group { display: flex; gap: 4px; flex-wrap: wrap; background: var(--card-2); border-radius: 999px; padding: 3px; }
        .pill-btn {
            border: none; background: none; color: var(--ink-2); font-size: 11px; font-weight: 600; cursor: pointer;
            border-radius: 999px; padding: 5px 12px; white-space: nowrap;
        }
        .pill-btn:hover { color: var(--ink); }
        .sp-layers { margin-top: 12px; background: none; padding: 0; gap: 6px; }
        .sp-layers .pill-btn { background: var(--card-2); }
        .sp-layers .pill-btn .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
        .sp-view {
            position: relative; width: 100%; aspect-ratio: 4 / 3; min-height: 320px; border-radius: 22px; overflow: hidden;
            background: radial-gradient(circle at 50% 40%, #18181b 0%, #0d0d0f 70%); cursor: grab; touch-action: none;
        }
        .sp-view:active { cursor: grabbing; }
        .sp-view canvas { width: 100% !important; height: 100% !important; display: block; }
        #sp-labels { position: absolute; inset: 0; pointer-events: none; }
        .sp-label {
            position: absolute; transform: translate(-50%, -50%); font-size: 10px; font-weight: 600; color: var(--ink-2);
            background: rgba(10,10,11,.7); padding: 1px 6px; border-radius: 999px; white-space: nowrap;
        }
        .sp-hint { position: absolute; left: 14px; bottom: 12px; font-size: 10px; color: var(--ink-3); pointer-events: none; }
        .sp-error { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ink-2); font-size: 12px; padding: 20px; text-align: center; }
        .sp-right { display: flex; flex-direction: column; gap: 14px; }
        .sp-readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .sp-readout > div { background: var(--card-2); border-radius: 18px; padding: 10px 12px 8px; }
        .sp-readout .lbl { display: block; font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .08em; margin-bottom: 2px; }
        .sp-readout .big-num { font-size: 34px; }
        .sp-block { background: var(--card-2); border-radius: 18px; padding: 12px 14px; }
        #leaf { width: 100%; aspect-ratio: 4 / 3; display: block; border-radius: 12px; margin: 6px 0; cursor: crosshair; touch-action: none; }
        .sp-note { font-size: 12px; line-height: 1.5; color: var(--ink-2); }
        .sp-small { font-size: 10px; line-height: 1.45; color: var(--ink-3); }
        .lg-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-2); margin-top: 6px; }
        .lg-line { width: 18px; height: 3px; border-radius: 2px; flex: none; }

        /* Card Gamut */
        .card.gamut { --accent: #38e1ff; width: 100%; }
        .gm-view {
            position: relative; width: 100%; max-width: 700px; margin: 0 auto; aspect-ratio: 1 / 1; border-radius: 22px;
            overflow: hidden; background: #0d0d0f; cursor: crosshair; touch-action: none;
        }
        .gm-view canvas { width: 100%; height: 100%; display: block; }
        .gm-hint {
            position: absolute; top: 10px; right: 14px; max-width: 62%; text-align: right; pointer-events: none;
            font-size: 10px; color: var(--ink-3); background: rgba(13,13,15,.75); padding: 3px 8px; border-radius: 999px;
        }
        .sp-readout > div { min-width: 0; overflow: hidden; }
        @media (max-width: 600px) { .gm-hint { display: none; } }
        .gm-readout .big-num { font-size: 27px; }
        .gm-foot { margin-top: 10px; max-width: 700px; margin-left: auto; margin-right: auto; }
        .swatch-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
        .sw-big { height: 74px; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
        .sw-big.hatch { background: repeating-linear-gradient(45deg, #1c1c20 0 6px, #26262b 6px 12px) !important; }
        .sw-cap { font-size: 10px; color: var(--ink-3); margin-top: 4px; line-height: 1.35; }
        .sw-cap b { display: block; color: var(--ink-2); font-weight: 600; }
        .pill.mini { font-size: 10px; padding: 2px 8px; white-space: nowrap; }
        .pill.in { background: var(--green); color: #04240d; }
        .pill.lum { background: #ffd23d; color: #2a2000; }
        .pill.out { background: var(--card-3); color: var(--ink-3); }
        .pill.scr { background: var(--card-3); color: var(--ink-2); letter-spacing: 0; }
        .gm-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
        .gm-row:first-child { border-top: none; }
        .gm-vis {
            width: 16px; height: 16px; border-radius: 50%; flex: none; cursor: pointer;
            border: 2px solid var(--c); background: transparent;
        }
        .gm-vis.on { background: var(--c); box-shadow: 0 0 10px var(--c); }
        .gm-name { flex: 1; min-width: 0; }
        .gm-name b { display: block; font-size: 12px; font-weight: 600; color: var(--ink); }
        .gm-name small { display: block; font-size: 10px; color: var(--ink-3); line-height: 1.35; }
        .gm-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .gm-icon { font-size: 10px; color: var(--ink-3); background: none; border: none; cursor: pointer; padding: 0; }
        .gm-icon:hover { color: var(--accent); }
        .gm-form { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 8px; align-items: center; margin-top: 10px; }
        .gm-form .gm-full { grid-column: 1 / -1; }
        .gm-form label.gm-full { display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: var(--ink-3); }
        .gm-form input[type=text] {
            background: var(--card-3); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-size: 12px; padding: 5px 8px;
        }
        .gm-form input[type=number] { width: 100%; font-size: 13px !important; padding: 3px 6px; }
        .gm-form input:disabled { opacity: .35; }
        .gm-lbl { font-size: 10px; font-weight: 700; color: var(--ink-3); }
        .gm-primary { background: var(--accent) !important; color: #0a0a0b !important; border-color: transparent !important; }
        .gm-primary:hover { color: #0a0a0b !important; filter: brightness(1.1); }
    </style>
</head>
<body class="min-h-screen p-4 pt-8">
    <div class="app">
    <div class="top-row">

    <section class="card picker" id="card-picker">
        <header class="card-head">
            <div class="card-tab"><span class="dot"></span><div><h2 data-i18n="tPicker"></h2><small id="sub-picker"></small></div></div>
            <button class="card-menu" data-collapse="card-picker" data-i18n-title="collapse"><i></i><i></i><i></i></button>
        </header>
        <div class="card-body flex flex-col">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 pt-3 pb-1">
            <div class="flex items-center gap-2">
                <div class="lang-group">
                    <button class="lang-btn" data-lang="es">ES</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                </div>
            </div>
            <div class="flex items-center space-x-2">
