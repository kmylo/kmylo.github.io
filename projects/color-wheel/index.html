    };
    let lang = (() => {
        try { const l = localStorage.getItem('color-picker-wheel-lang'); if (l && I18N[l]) return l; } catch (e) {}
        return (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
    })();
    const t = (k, vars) => {
        let s = (I18N[lang] && I18N[lang][k]) || I18N.es[k] || k;
        if (vars) Object.entries(vars).forEach(([a, b]) => { s = s.replace(`{${a}}`, b); });
        return s;
    };
    function applyI18n() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
        document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
        lang = b.dataset.lang;
        try { localStorage.setItem('color-picker-wheel-lang', lang); } catch (e) {}
        applyI18n();
        renderModelSelect();
        if (window.__space) window.__space.refreshText();
        if (window.__gamut) window.__gamut.refreshText();
        render('lang');
    }));

    // ------------------------------------------------------------
    // Estado canónico en HSV: conserva el tono aunque S o V sean 0
    // ------------------------------------------------------------
    const state = { h: 0, s: 0, v: 0 };
    let prevHex = '#3B82F6';
    let wheelModel = 'rgb';
    let harmony = 'complementary';
    let shape = 'square';
    const clipped = { lch: false, lab: false };

    const mod360 = x => ((x % 360) + 360) % 360;
    const wrap180 = x => mod360(x + 180) - 180;
    const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
    const clamp01 = x => clamp(x, 0, 1);
    const hsv2hex = (h, s, v) => chroma.hsv(mod360(h), clamp(s, 0, 100) / 100, clamp(v, 0, 100) / 100).hex();
    const currentHex = () => hsv2hex(state.h, state.s, state.v);

    // Conversión rápida para el render por píxel (h en grados, s y v en 0..1)
    function hsvToRgb(h, s, v, out) {
        h = mod360(h) / 60;
        const i = Math.floor(h), f = h - i;
        const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
        let r, g, b;
        switch (i % 6) {
            case 0: r = v; g = t; b = p; break;
            case 1: r = q; g = v; b = p; break;
            case 2: r = p; g = v; b = t; break;
            case 3: r = p; g = q; b = v; break;
            case 4: r = t; g = p; b = v; break;
            default: r = v; g = p; b = q;
        }
        out[0] = r * 255; out[1] = g * 255; out[2] = b * 255;
    }

    // ------------------------------------------------------------
    // Modelo de rueda: RGB (tono directo) o RYB (rueda de artista)
    // ------------------------------------------------------------
    const RYB_W = [0, 60, 120, 180, 240, 300, 360];
    const RYB_H = [0, 30, 60, 120, 240, 275, 360];
    function interp(x, xs, ys) {
        x = mod360(x);
        for (let i = 0; i < xs.length - 1; i++) {
            if (x <= xs[i + 1]) {
                const t = (x - xs[i]) / (xs[i + 1] - xs[i]);
                return ys[i] + t * (ys[i + 1] - ys[i]);
            }
        }
        return ys[ys.length - 1];
    }
    const wheelToHue = w => wheelModel === 'rgb' ? mod360(w) : mod360(interp(w, RYB_W, RYB_H));
    const hueToWheel = h => wheelModel === 'rgb' ? mod360(h) : mod360(interp(h, RYB_H, RYB_W));

    // ------------------------------------------------------------
    // Armonías
    // ------------------------------------------------------------
    const spread = { analogous: 30, split: 30, tetrad: 60 };
    const HARM = {
        mono:          { offs: () => [0] },
        complementary: { offs: () => [0, 180] },
        analogous:     { offs: s => [0, -s, s],            fromDrag: d => clamp(Math.abs(d), 5, 120) },
        split:         { offs: s => [0, 180 - s, 180 + s], fromDrag: d => clamp(180 - Math.abs(d), 5, 90) },
        triad:         { offs: () => [0, 120, 240] },
        tetrad:        { offs: s => [0, s, 180, 180 + s],
                         fromDrag: (d, i) => {
                             const signed = x => Math.sign(x || 1) * clamp(Math.abs(x), 15, 165);
                             if (i === 1) return signed(d);
                             if (i === 3) return signed(wrap180(d - 180));
                             return null;
                         } },
        square:        { offs: () => [0, 90, 180, 270] }
    };
    const harmonyWheelAngles = () => {
        const bw = hueToWheel(state.h);
        return HARM[harmony].offs(spread[harmony]).map(o => mod360(bw + o));
    };

    function paletteHexes() {
        const { h, s, v } = state;
        if (harmony === 'mono') {
            return [
                hsv2hex(h, s, v),
                hsv2hex(h, s, clamp(v - 25, 5, 100)),
                hsv2hex(h, s, clamp(v - 50, 5, 100)),
                hsv2hex(h, clamp(s - 30, 0, 100), clamp(v + 10, 0, 100)),
                hsv2hex(h, clamp(s - 60, 0, 100), clamp(v + 20, 0, 100))
            ];
        }
        return harmonyWheelAngles().map((w, i) => i === 0 ? currentHex() : hsv2hex(wheelToHue(w), s, v));
    }

    // ------------------------------------------------------------
    // Geometría
    // ------------------------------------------------------------
    const S = 300, C = S / 2, RO = 146, RI = 120, RM = (RO + RI) / 2;
    const RQ = RI - 9;          // radio útil para la forma interior
    const DPR = window.devicePixelRatio || 1;
    const IDPR = Math.min(DPR, 2);
    const rad = d => d * Math.PI / 180;

    const wheelEl = document.getElementById('wheel');
    const ringCv = document.getElementById('ring');
    const innerCv = document.getElementById('inner');
    const sqHandle = document.getElementById('sq-handle');
    const handlesEl = document.getElementById('ring-handles');
    const linksEl = document.getElementById('links');

    function setupCanvas(cv, w, h, dpr) {
        cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        cv.style.width = w + 'px'; cv.style.height = h + 'px';
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return ctx;
    }
    setupCanvas(ringCv, S, S, DPR);
    setupCanvas(innerCv, S, S, IDPR);

    // ------------------------------------------------------------
    // Formas interiores. Cada una expone, para la geometría actual:
    //   sample(x,y)        -> {s,v[,h]} en 0..1 o null (render por píxel)
    //   faceAt(x,y)        -> id de cara bajo el puntero o null
    //   params(face,x,y)   -> {s,v[,h,d]} con el punto acotado a esa cara
    //   pos()              -> posición del handle para el estado actual
    //   outline()          -> polígonos para el contorno
    // Coordenadas relativas al centro de la rueda.
    // ------------------------------------------------------------
    let cubeRef = null;   // tono de referencia fijo mientras se arrastra en el cubo
    let cubeLast = null;  // última cara y parámetros usados en el cubo
    const CUBE_HUE_DEPTH = 60;

    const SHAPES = {
        square: { prep() {
            const a = Math.round(RQ * Math.SQRT2), h = a / 2;
            const raw = (x, y) => ({ s: (x + h) / a, v: 1 - (y + h) / a });
            return {
                sample(x, y) { return (x >= -h && x <= h && y >= -h && y <= h) ? raw(x, y) : null; },
                faceAt(x, y) { return (Math.abs(x) <= h + 4 && Math.abs(y) <= h + 4) ? 'f' : null; },
                params(f, x, y) { const r = raw(x, y); return { s: clamp01(r.s), v: clamp01(r.v) }; },
                pos() { return { x: -h + state.s / 100 * a, y: -h + (1 - state.v / 100) * a }; },
                outline() { return [[[-h, -h], [h, -h], [h, h], [-h, h]]]; }
            };
        } },

        diamond: { prep() {
            // Corte del doble cono HSL: L vertical, saturación HSL horizontal.
            const R = RQ;
            const fromHsl = (L, sl) => {
                const v = L + sl * Math.min(L, 1 - L);
                return { s: v <= 0 ? 0 : 2 * (1 - L / v), v };
            };
            const raw = (x, y, clampIt) => {
                let L = 1 - (y + R) / (2 * R);
                if (clampIt) L = clamp01(L);
                const w = R * (1 - Math.abs(2 * L - 1));
                let sl = w < 0.5 ? 0 : (x + w) / (2 * w);
                if (clampIt) sl = clamp01(sl);
                return fromHsl(L, sl);
            };
            return {
                sample(x, y) { return (Math.abs(x) + Math.abs(y) <= R) ? raw(x, y, false) : null; },
                faceAt(x, y) { return (Math.abs(x) + Math.abs(y) <= R + 5) ? 'f' : null; },
                params(f, x, y) { const r = raw(x, y, true); return { s: clamp01(r.s), v: clamp01(r.v) }; },
                pos() {
                    const v = state.v / 100, s = state.s / 100;
                    const L = v * (1 - s / 2);
                    const sl = (L <= 0 || L >= 1) ? 0 : (v - L) / Math.min(L, 1 - L);
                    const w = R * (1 - Math.abs(2 * L - 1));
                    return { x: -w + sl * 2 * w, y: (1 - L) * 2 * R - R };
                },
                outline() { return [[[0, -R], [R, 0], [0, R], [-R, 0]]]; }
            };
        } },

        triangle: { prep() {
            // Mezcla baricéntrica lineal: color = a·tono + b·blanco + c·negro.
            // En HSV eso da exactamente v = a + b, s = a / (a + b).
            const R = RQ, wa = hueToWheel(state.h);
            const P = ang => [R * Math.sin(rad(ang)), -R * Math.cos(rad(ang))];
            const H = P(wa), W = P(wa - 120), K = P(wa + 120);
            const det = (W[1] - K[1]) * (H[0] - K[0]) + (K[0] - W[0]) * (H[1] - K[1]);
            const bary = (x, y) => {
                const a = ((W[1] - K[1]) * (x - K[0]) + (K[0] - W[0]) * (y - K[1])) / det;
                const b = ((K[1] - H[1]) * (x - K[0]) + (H[0] - K[0]) * (y - K[1])) / det;
                return [a, b, 1 - a - b];
            };
            const toSV = (a, b) => { const v = a + b; return { s: v > 1e-4 ? a / v : state.s / 100, v }; };
            return {
                sample(x, y) {
                    const [a, b, c] = bary(x, y);
                    return (a >= 0 && b >= 0 && c >= 0) ? toSV(a, b) : null;
                },
                faceAt(x, y) {
                    const [a, b, c] = bary(x, y), e = -0.04;
                    return (a >= e && b >= e && c >= e) ? 'f' : null;
                },
                params(f, x, y) {
                    let [a, b, c] = bary(x, y);
                    a = Math.max(a, 0); b = Math.max(b, 0); c = Math.max(c, 0);
                    const sum = a + b + c || 1;
                    const r = toSV(a / sum, b / sum);
                    return { s: clamp01(r.s), v: clamp01(r.v) };
                },
                pos() {
                    const s = state.s / 100, v = state.v / 100;
                    const a = s * v, b = v - s * v, c = 1 - v;
                    return { x: a * H[0] + b * W[0] + c * K[0], y: a * H[1] + b * W[1] + c * K[1] };
                },
                outline() { return [[H, W, K]]; }
            };
        } },

        cube: { prep() {
            // Caja en el espacio HSB: frente = S × B al tono actual;
            // la profundidad recorre tono (CUBE_HUE_DEPTH grados).
            const f = Math.floor(RQ / (0.7 * Math.SQRT2)), dx = 0.4 * f, dy = 0.4 * f;
            const x0 = -(f + dx) / 2, yb = (f + dy) / 2, yt = yb - f;
            const ref = cubeRef === null ? state.h : cubeRef;
            const inR = (...vals) => vals.every(t => t >= 0 && t <= 1);
            const faces = {
                f(x, y, c) {
                    let s = (x - x0) / f, v = (yb - y) / f;
                    if (c) { s = clamp01(s); v = clamp01(v); }
                    return inR(s, v) ? { s, v, h: ref, d: 0 } : null;
                },
                t(x, y, c) {
                    let d = (yt - y) / dy; if (c) d = clamp01(d);
                    let u = (x - x0 - d * dx) / f; if (c) u = clamp01(u);
                    return inR(d, u) ? { s: u, v: 1, h: ref + d * CUBE_HUE_DEPTH, d } : null;
                },
                r(x, y, c) {
                    let d = (x - x0 - f) / dx; if (c) d = clamp01(d);
                    let t = (yb - y - d * dy) / f; if (c) t = clamp01(t);
                    return inR(d, t) ? { s: 1, v: t, h: ref + d * CUBE_HUE_DEPTH, d } : null;
                }
            };
            return {
                sample(x, y) { return faces.f(x, y) || faces.t(x, y) || faces.r(x, y); },
                faceAt(x, y) {
                    for (const k of ['f', 't', 'r']) if (faces[k](x, y)) return k;
                    return null;
                },
                params(face, x, y) { return faces[face](x, y, true); },
                pos() {
                    if (cubeLast) {
                        const { face, s, v, d } = cubeLast;
                        if (face === 't') return { x: x0 + s * f + d * dx, y: yt - d * dy };
                        if (face === 'r') return { x: x0 + f + d * dx, y: yb - v * f - d * dy };
                    }
                    return { x: x0 + state.s / 100 * f, y: yb - state.v / 100 * f };
                },
                outline() {
                    return [
                        [[x0, yt], [x0 + f, yt], [x0 + f, yb], [x0, yb]],
                        [[x0, yt], [x0 + dx, yt - dy], [x0 + f + dx, yt - dy], [x0 + f, yt]],
                        [[x0 + f, yt], [x0 + f + dx, yt - dy], [x0 + f + dx, yb - dy], [x0 + f, yb]]
                    ];
                }
            };
        } }
    };

    // ------------------------------------------------------------
    // Dibujo
    // ------------------------------------------------------------
    function drawRing() {
        const ctx = ringCv.getContext('2d');
        ctx.clearRect(0, 0, S, S);

        // Disco interior de fondo
        const bg = ctx.createRadialGradient(C, C - 30, 10, C, C, RI);
        bg.addColorStop(0, '#34343a'); bg.addColorStop(1, '#232326');
        ctx.beginPath(); ctx.arc(C, C, RI, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();

        if (ctx.createConicGradient) {
            const fill = ctx.createConicGradient(-Math.PI / 2, C, C);
            const N = 90;
            for (let i = 0; i <= N; i++) {
                const t = i / N;
                fill.addColorStop(t, hsv2hex(wheelToHue(t * 360), 100, 100));
            }
            ctx.beginPath();
            ctx.arc(C, C, RO, 0, Math.PI * 2);
            ctx.arc(C, C, RI, 0, Math.PI * 2, true);
            ctx.fillStyle = fill;
            ctx.fill();
        } else {
            for (let a = 0; a < 360; a++) {
                ctx.beginPath();
                ctx.arc(C, C, RO, rad(a - 90.6), rad(a - 88.4));
                ctx.arc(C, C, RI, rad(a - 88.4), rad(a - 90.6), true);
                ctx.fillStyle = hsv2hex(wheelToHue(a + 0.5), 100, 100);
                ctx.fill();
            }
        }
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,.5)';
        ctx.beginPath(); ctx.arc(C, C, RO + 0.5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(C, C, RI - 0.5, 0, Math.PI * 2); ctx.stroke();
    }

    let lastInnerKey = '';
    function drawInner() {
        const key = [shape, state.h.toFixed(2), cubeRef, wheelModel].join('|');
        if (key === lastInnerKey) return;
        lastInnerKey = key;

        const g = SHAPES[shape].prep();
        const ctx = innerCv.getContext('2d');
        const size = Math.round(2 * RI * IDPR);
        const img = ctx.createImageData(size, size);
        const data = img.data, rgb = [0, 0, 0], baseH = state.h;
        for (let py = 0; py < size; py++) {
            const y = (py + 0.5) / IDPR - RI;
            for (let px = 0; px < size; px++) {
                const x = (px + 0.5) / IDPR - RI;
                const p = g.sample(x, y);
                if (!p) continue;
                hsvToRgb(p.h !== undefined ? p.h : baseH, clamp01(p.s), clamp01(p.v), rgb);
                const i = (py * size + px) * 4;
                data[i] = rgb[0]; data[i + 1] = rgb[1]; data[i + 2] = rgb[2]; data[i + 3] = 255;
            }
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, innerCv.width, innerCv.height);
        const o = Math.round((C - RI) * IDPR);
        ctx.putImageData(img, o, o);

        // Contorno: limpia el borde y marca las aristas del cubo
        ctx.setTransform(IDPR, 0, 0, IDPR, C * IDPR, C * IDPR);
        ctx.lineJoin = 'round';
        g.outline().forEach(poly => {
            ctx.beginPath();
            poly.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
            ctx.closePath();
            ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.stroke();
            ctx.lineWidth = 0.6; ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.stroke();
        });
    }

    const ptOnRing = (w, r = RM) => ({ x: C + r * Math.sin(rad(w)), y: C - r * Math.cos(rad(w)) });

    const handlePool = [];
    function placeHandles() {
        // Handle interior
        const pp = SHAPES[shape].prep().pos();
        sqHandle.style.left = (C + pp.x) + 'px';
        sqHandle.style.top = (C + pp.y) + 'px';
        sqHandle.style.borderColor = chroma(currentHex()).luminance() > 0.45 ? '#111' : '#fff';

        // Anillo
        const angles = harmonyWheelAngles();
        const cols = harmony === 'mono' ? [currentHex()] : paletteHexes();
        while (handlePool.length < angles.length) {
            const el = document.createElement('div');
            el.className = 'rh';
            el.dataset.idx = handlePool.length;
            handlesEl.appendChild(el);
            handlePool.push(el);
        }
        handlePool.forEach((el, i) => {
            if (i >= angles.length) { el.style.display = 'none'; return; }
            const p = ptOnRing(angles[i]);
            el.style.display = 'block';
            el.style.left = p.x + 'px';
            el.style.top = p.y + 'px';
            el.style.background = cols[i];
            el.classList.toggle('main', i === 0);
            el.title = i === 0 ? t('hBase') : (HARM[harmony].fromDrag ? t('hSpread') : t('hRotate'));
        });

        if (angles.length < 2) { linksEl.innerHTML = ''; return; }
        const pts = angles.map(a => ptOnRing(a, RI - 2));
        const attr = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        linksEl.innerHTML = angles.length === 2
            ? `<polyline points="${attr}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`
            : `<polygon points="${attr}" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`;
    }

    // ------------------------------------------------------------
    // Interacción con la rueda
    // ------------------------------------------------------------
    let drag = null;
    function localPt(e) {
        const r = wheelEl.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    const angleOf = p => mod360(Math.atan2(p.x - C, -(p.y - C)) * 180 / Math.PI);

    wheelEl.addEventListener('pointerdown', e => {
        const p = localPt(e);
        const d = Math.hypot(p.x - C, p.y - C);
        const idx = e.target.dataset ? e.target.dataset.idx : undefined;
        if (idx !== undefined) {
            drag = { type: 'ring', idx: +idx };
        } else if (d < RI - 4) {
            const face = SHAPES[shape].prep().faceAt(p.x - C, p.y - C) || 'f';
            drag = { type: 'inner', face };
            if (shape === 'cube') cubeRef = state.h;
        } else if (d <= RO + 6) {
            drag = { type: 'ring', idx: 0 };
        } else return;
        commitPrev();
        wheelEl.setPointerCapture(e.pointerId);
        e.preventDefault();
        onDrag(e);
    });
    wheelEl.addEventListener('pointermove', e => { if (drag) onDrag(e); });
    const endDrag = () => {
        if (!drag) return;
        const wasCube = drag.type === 'inner' && shape === 'cube';
        drag = null;
        if (wasCube) { cubeRef = null; cubeLast = null; render('wheel'); }
        pushHistory();
    };
    wheelEl.addEventListener('pointerup', endDrag);
    wheelEl.addEventListener('pointercancel', endDrag);

    function onDrag(e) {
        target = null;
        const p = localPt(e);
        if (drag.type === 'inner') {
            const r = SHAPES[shape].prep().params(drag.face, p.x - C, p.y - C);
            state.s = r.s * 100;
            state.v = r.v * 100;
            if (r.h !== undefined) state.h = mod360(r.h);
            if (shape === 'cube') cubeLast = { face: drag.face, s: r.s, v: r.v, d: r.d };
        } else {
            const w = angleOf(p);
            const H = HARM[harmony];
            if (drag.idx === 0) {
                state.h = wheelToHue(w);
            } else {
                const bw = hueToWheel(state.h);
                const ns = H.fromDrag ? H.fromDrag(wrap180(w - bw), drag.idx) : null;
                if (ns !== null && ns !== undefined) {
                    spread[harmony] = ns;
                } else {
                    const off = H.offs(spread[harmony])[drag.idx];
                    state.h = wheelToHue(w - off);
                }
            }
        }
        render('wheel');
    }

    document.querySelectorAll('[data-wheel]').forEach(btn => {
        btn.addEventListener('click', () => {
            wheelModel = btn.dataset.wheel;
            document.querySelectorAll('[data-wheel]').forEach(b => b.classList.toggle('active', b === btn));
            drawRing();
            render('wheel');
        });
    });
    document.querySelectorAll('[data-shape]').forEach(btn => {
        btn.addEventListener('click', () => {
            shape = btn.dataset.shape;
            document.querySelectorAll('[data-shape]').forEach(b => b.classList.toggle('active', b === btn));
            render('wheel');
        });
    });

    // ------------------------------------------------------------
    // Paneles de sliders
    // ------------------------------------------------------------
    const MODES = {
        rgb: { label: 'RGB', ch: [['r', 'R', 0, 255], ['g', 'G', 0, 255], ['b', 'B', 0, 255]] },
        hsb: { label: 'HSB', ch: [['h', 'H', 0, 360], ['s', 'S', 0, 100], ['v', 'B', 0, 100]] },
        hsl: { label: 'HSL', ch: [['h', 'H', 0, 360], ['s', 'S', 0, 100], ['l', 'L', 0, 100]] },
        lch: { label: 'LCH', ch: [['l', 'L', 0, 100], ['c', 'C', 0, 150], ['h', 'H', 0, 360]] },
        lab: { label: 'LAB', ch: [['l', 'L', 0, 100], ['a', 'a', -128, 127], ['b', 'b', -128, 127]] },
        cmyk: { label: 'CMYK', ch: [['c', 'C', 0, 100], ['m', 'M', 0, 100], ['y', 'Y', 0, 100], ['k', 'K', 0, 100]] }
    };
    const els = {};
    const panelsEl = document.getElementById('panels');
    const tabsEl = document.getElementById('tabs');

    Object.entries(MODES).forEach(([mode, cfg]) => {
        const panel = document.createElement('div');
        panel.className = 'mode-panel';
        panel.id = 'panel-' + mode;
        panel.innerHTML = `<div class="panel-title">${cfg.label}<span class="note"></span><span class="warn"></span></div>`;
        els[mode] = {};
        cfg.ch.forEach(([key, lab, min, max]) => {
            const row = document.createElement('div');
            row.className = 'slider-row';
            row.innerHTML = `
                <div class="slider-label">${lab}</div>
                <div class="slider-wrapper"><div class="slider-bg"></div><input type="range" min="${min}" max="${max}" step="1"></div>
                <input type="number" class="num" min="${min}" max="${max}">`;
            panel.appendChild(row);
            const ch = {
                range: row.querySelector('input[type=range]'),
                num: row.querySelector('input[type=number]'),
                bg: row.querySelector('.slider-bg')
            };
            els[mode][key] = ch;
            const handler = e => {
                if (e.target.value === '') return;
                let v = parseFloat(e.target.value);
                if (isNaN(v)) return;
                v = clamp(v, min, max);
                if (e.target === ch.range) ch.num.value = v; else ch.range.value = v;
                onModeInput(mode);
            };
            ch.range.addEventListener('input', handler);
            ch.num.addEventListener('input', handler);
            ch.range.addEventListener('pointerdown', commitPrev);
            ch.num.addEventListener('focus', commitPrev);
            ch.range.addEventListener('change', () => pushHistory());
            ch.num.addEventListener('change', () => pushHistory());
        });
        panelsEl.appendChild(panel);

        const tab = document.createElement('div');
        tab.className = 'mode-tab';
        tab.id = 'tab-' + mode;
        tab.textContent = cfg.label;
        tab.addEventListener('click', e => handleTabClick(e, mode));
        tabsEl.appendChild(tab);
    });

    const read = mode => Object.fromEntries(
        Object.entries(els[mode]).map(([k, ch]) => [k, parseFloat(ch.num.value) || 0])
    );
    function write(mode, vals) {
        Object.entries(vals).forEach(([k, v]) => {
            const r = Math.round(v);
            els[mode][k].range.value = r;
            els[mode][k].num.value = r;
        });
    }

    // Fuentes que pueden traer un color pedido fuera de sRGB (lo gestiona applyXYZ)
    const TARGET_SOURCES = new Set(['lch', 'lab', 'gamut', 'leaf']);
    function setFromColor(c, source, hueOverride) {
        if (!TARGET_SOURCES.has(source)) target = null;
        let [h, s, v] = c.hsv();
        if (hueOverride !== undefined) h = hueOverride;
        else if (isNaN(h) || s === 0) h = state.h;
        state.h = mod360(h);
        state.s = (isNaN(s) ? 0 : s) * 100;
        state.v = v * 100;
        render(source);
    }

    function onModeInput(mode) {
        const v = read(mode);
        if (mode === 'rgb') setFromColor(chroma(v.r, v.g, v.b), 'rgb');
        if (mode === 'hsb') { target = null; state.h = mod360(v.h); state.s = v.s; state.v = v.v; render('hsb'); }
        if (mode === 'hsl') setFromColor(chroma.hsl(v.h, v.s / 100, v.l / 100), 'hsl', mod360(v.h));
        if (mode === 'lch' || mode === 'lab') {
            const lab = mode === 'lch' ? [v.l, v.c * Math.cos(rad(v.h)), v.c * Math.sin(rad(v.h))] : [v.l, v.a, v.b];
            applyXYZ(labToXyz(...lab), mode);
        }
        if (mode === 'cmyk') setFromColor(chroma.cmyk(v.c / 100, v.m / 100, v.y / 100, v.k / 100), 'cmyk');
    }

    const grad = stops => `linear-gradient(to right, ${stops.join(', ')})`;
    const sample = (fn, n) => Array.from({ length: n }, (_, i) => fn(i / (n - 1)));
    const setBg = (mode, key, stops) => { els[mode][key].bg.style.background = grad(stops); };

    function updateGradients() {
        const { r, g, b } = read('rgb');
        setBg('rgb', 'r', [chroma(0, g, b).hex(), chroma(255, g, b).hex()]);
        setBg('rgb', 'g', [chroma(r, 0, b).hex(), chroma(r, 255, b).hex()]);
        setBg('rgb', 'b', [chroma(r, g, 0).hex(), chroma(r, g, 255).hex()]);

        const { h, s, v } = state;
        setBg('hsb', 'h', sample(t => hsv2hex(t * 360, s, v), 13));
        setBg('hsb', 's', [hsv2hex(h, 0, v), hsv2hex(h, 100, v)]);
        setBg('hsb', 'v', ['#000000', hsv2hex(h, s, 100)]);

        const hsl = read('hsl');
        setBg('hsl', 'h', sample(t => chroma.hsl(t * 360, hsl.s / 100, hsl.l / 100).hex(), 13));
        setBg('hsl', 's', [chroma.hsl(hsl.h, 0, hsl.l / 100).hex(), chroma.hsl(hsl.h, 1, hsl.l / 100).hex()]);
        setBg('hsl', 'l', ['#000000', chroma.hsl(hsl.h, hsl.s / 100, 0.5).hex(), '#ffffff']);

        const L = read('lch');
        setBg('lch', 'l', sample(t => chroma.lch(t * 100, L.c, L.h).hex(), 9));
        setBg('lch', 'c', sample(t => chroma.lch(L.l, t * 150, L.h).hex(), 9));
        setBg('lch', 'h', sample(t => chroma.lch(L.l, L.c, t * 360).hex(), 13));

        const A = read('lab');
        setBg('lab', 'l', sample(t => chroma.lab(t * 100, A.a, A.b).hex(), 9));
        setBg('lab', 'a', sample(t => chroma.lab(A.l, -128 + t * 255, A.b).hex(), 9));
        setBg('lab', 'b', sample(t => chroma.lab(A.l, A.a, -128 + t * 255).hex(), 9));

        const K = read('cmyk'), q = x => x / 100;
        setBg('cmyk', 'c', [chroma.cmyk(0, q(K.m), q(K.y), q(K.k)).hex(), chroma.cmyk(1, q(K.m), q(K.y), q(K.k)).hex()]);
        setBg('cmyk', 'm', [chroma.cmyk(q(K.c), 0, q(K.y), q(K.k)).hex(), chroma.cmyk(q(K.c), 1, q(K.y), q(K.k)).hex()]);
        setBg('cmyk', 'y', [chroma.cmyk(q(K.c), q(K.m), 0, q(K.k)).hex(), chroma.cmyk(q(K.c), q(K.m), 1, q(K.k)).hex()]);
        setBg('cmyk', 'k', [chroma.cmyk(q(K.c), q(K.m), q(K.y), 0).hex(), chroma.cmyk(q(K.c), q(K.m), q(K.y), 1).hex()]);
    }

    // ------------------------------------------------------------
    // Swatches de armonía, contraste, color anterior
    // ------------------------------------------------------------
    const swatchesEl = document.getElementById('swatches');
    const spreadInfo = document.getElementById('spread-info');

    function renderSwatches() {
        const cols = paletteHexes();
        swatchesEl.innerHTML = cols.map((hx, i) => `
            <div class="sw ${i === 0 ? 'base' : ''}">
                <div class="sw-color" style="background:${hx}" data-hex="${hx}" title="${t('useAsBase')}"></div>
                <button class="sw-hex mono" data-copy="${hx}" title="${t('copy')}">${hx.slice(1).toUpperCase()}</button>
            </div>`).join('');
        spreadInfo.textContent = HARM[harmony].fromDrag
            ? t('spreadInfo', { n: Math.round(Math.abs(spread[harmony])) })
            : t(harmony === 'mono' ? 'monoInfo' : 'rotateInfo');
    }

    swatchesEl.addEventListener('click', e => {
        const copy = e.target.closest('[data-copy]');
        if (copy) { copyText(copy.dataset.copy.toUpperCase()); return; }
        const sw = e.target.closest('[data-hex]');
        if (sw) { commitPrev(); setFromColor(chroma(sw.dataset.hex), 'swatch'); pushHistory(); }
    });

    const curEl = document.getElementById('cur-color');
    const prevEl = document.getElementById('prev-color');
    function commitPrev() { prevHex = currentHex(); prevEl.style.background = prevHex; }
    prevEl.addEventListener('click', () => {
        const back = prevHex;
        prevHex = currentHex();
        setFromColor(chroma(back), 'prev');
        pushHistory();
    });

    function renderContrast(hex) {
        const cw = chroma.contrast(hex, '#ffffff'), cb = chroma.contrast(hex, '#000000');
        const tag = r => r >= 7 ? 'AAA' : r >= 4.5 ? 'AA' : r >= 3 ? 'AA+' : '';
        const w = document.getElementById('ct-white'), b = document.getElementById('ct-black');
        w.style.background = hex; w.style.color = '#fff';
        b.style.background = hex; b.style.color = '#000';
        w.textContent = `Aa ${cw.toFixed(1)} ${tag(cw)}`.trim();
        b.textContent = `Aa ${cb.toFixed(1)} ${tag(cb)}`.trim();
    }

    // ------------------------------------------------------------
    // Color mixer
    // ------------------------------------------------------------
    const LS_KEY = 'color-picker-wheel-v2';
    const loadLS = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } };
    const saveLS = () => {
        try { localStorage.setItem(LS_KEY, JSON.stringify({ history, userSwatches, mixModel })); } catch (e) {}
    };
    const stored = loadLS();
    const HIST_MAX = 14;
    let history = Array.isArray(stored.history) ? stored.history.filter(c => chroma.valid(c)) : [];
    let userSwatches = Array.isArray(stored.userSwatches) ? stored.userSwatches.filter(c => chroma.valid(c))
        : ['#ef4444', '#f59e0b', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#ffffff', '#a1a1aa', '#18181b'];

    const mixer = {
        shades: { auto: true, base: null },
        blend:  { auto: false, a: '#f2c94c', b: '#1f4fd1' },
        scheme: { auto: true, frozen: null }
    };

    // ------------------------------------------------------------
    // Motor de mezcla: seis modelos, cada uno responde otra pregunta
    // ------------------------------------------------------------
    const MODELS = ['srgb', 'linear', 'oklab', 'oklchShort', 'oklchLong', 'pigment'];
    let mixModel = MODELS.includes(stored.mixModel) ? stored.mixModel : 'oklab';

    const toLin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    const toGam = c => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
    const hex01 = h => chroma(h).rgb().map(v => v / 255);
    const linToHex = lin => '#' + lin.map(v => Math.round(clamp01(toGam(clamp01(v))) * 255).toString(16).padStart(2, '0')).join('');
    function lin2ok([r, g, b]) {
        const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
        const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
        const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
        return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
                1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
                0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
    }
    function ok2lin([L, a, b]) {
        const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
        const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
        const s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
        return [ 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                -0.0041960863 * l - 0.7034186147 * m + 1.7076127010 * s];
    }
    const inGamut = c => c.every(v => v >= -1e-4 && v <= 1 + 1e-4);
    // Gamut mapping estilo CSS Color 4 simplificado: baja el croma manteniendo L y H
    function okLchToLin(L, C, H) {
        const at = c => ok2lin([L, c * Math.cos(H), c * Math.sin(H)]);
        const first = at(C);
        if (inGamut(first)) return { lin: first, clip: false };
        let lo = 0, hi = C;
        for (let i = 0; i < 18; i++) { const m = (lo + hi) / 2; inGamut(at(m)) ? lo = m : hi = m; }
        return { lin: at(lo), clip: true };
    }
    // Kubelka-Munk espectral simplificado.
    // 1. Cada color se convierte en una curva de reflectancia suave (36 bandas, 380 a 730 nm)
    //    con tres curvas base: azul, verde y rojo (el rojo con un leve reflejo violeta).
    // 2. Piso de reflectancia: ningún pigmento real absorbe el 100%, si no, tendría
    //    fuerza tintórea infinita y todo mezclaría a negro.
    // 3. K-M por banda: se mezclan los K/S, no los colores.
    // 4. Proyección de vuelta a RGB por mínimos cuadrados sobre la misma base, más una
    //    corrección residual interpolada (truco de Mixbox) para que los extremos sean exactos.
    const ks = R => { R = clamp(R, 0.001, 0.999); return (1 - R) * (1 - R) / (2 * R); };
    const unks = k => 1 + k - Math.sqrt(k * k + 2 * k);
    const KM_FLOOR = 0.04;
    const KM = (() => {
        const sig = x => 1 / (1 + Math.exp(-x)), gs = (l, c, w) => Math.exp(-(((l - c) / w) ** 2));
        const B = [];
        for (let l = 380; l <= 730; l += 10) {
            const r = Math.min(1, sig((l - 585) / 20) + 0.12 * gs(l, 400, 30));
            const b = 1 - sig((l - 490) / 20);
            B.push([r, Math.max(0, 1 - r - b), b]);
        }
        const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
        B.forEach(v => { for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) M[i][j] += v[i] * v[j]; });
        const a = M.map((row, i) => [...row, ...[0, 1, 2].map(j => +(i === j))]);
        for (let i = 0; i < 3; i++) {
            const p = a[i][i];
            for (let j = 0; j < 6; j++) a[i][j] /= p;
            for (let k = 0; k < 3; k++) if (k !== i) { const f = a[k][i]; for (let j = 0; j < 6; j++) a[k][j] -= f * a[i][j]; }
        }
        return { B, Mi: a.map(row => row.slice(3)) };
    })();
    const kmSpec = lin => KM.B.map(v => KM_FLOOR + (1 - 2 * KM_FLOOR) * (v[0] * lin[0] + v[1] * lin[1] + v[2] * lin[2]));
    const kmProj = sp => {
        const y = [0, 1, 2].map(i => KM.B.reduce((acc, v, k) => acc + v[i] * sp[k], 0));
        return [0, 1, 2].map(i => KM.Mi[i][0] * y[0] + KM.Mi[i][1] * y[1] + KM.Mi[i][2] * y[2]);
    };
    function pigmentMix(l1, l2, t) {
        if (t <= 0) return l1;
        if (t >= 1) return l2;
        const s1 = kmSpec(l1), s2 = kmSpec(l2);
        const p1 = kmProj(s1), p2 = kmProj(s2);
        const mixed = kmProj(s1.map((r, i) => unks(ks(r) * (1 - t) + ks(s2[i]) * t)));
        return mixed.map((v, i) => v + (l1[i] - p1[i]) * (1 - t) + (l2[i] - p2[i]) * t);
    }

    function mixPair(h1, h2, t, model) {
        const g1 = hex01(h1), g2 = hex01(h2);
        const l1 = g1.map(toLin), l2 = g2.map(toLin);
        const lerp = (a, b) => a.map((v, i) => v + (b[i] - v) * t);
        if (model === 'srgb') return { hex: linToHex(lerp(g1, g2).map(toLin)), clip: false };
        if (model === 'linear') return { hex: linToHex(lerp(l1, l2)), clip: false };
        if (model === 'pigment') return { hex: linToHex(pigmentMix(l1, l2, t)), clip: false };
        const o1 = lin2ok(l1), o2 = lin2ok(l2);
        if (model === 'oklab') return { hex: linToHex(ok2lin(lerp(o1, o2))), clip: false };
        const c1 = Math.hypot(o1[1], o1[2]), c2 = Math.hypot(o2[1], o2[2]);
        let a1 = Math.atan2(o1[2], o1[1]), a2 = Math.atan2(o2[2], o2[1]);
        // Tono "sin poder": un gris toma el tono del otro extremo
        if (c1 < 0.02) a1 = a2;
        if (c2 < 0.02) a2 = a1;
        let d = a2 - a1;
        while (d > Math.PI) d -= 2 * Math.PI;
        while (d < -Math.PI) d += 2 * Math.PI;
        if (model === 'oklchLong' && Math.abs(d) > 1e-6) d = d > 0 ? d - 2 * Math.PI : d + 2 * Math.PI;
        const r = okLchToLin(o1[0] + (o2[0] - o1[0]) * t, c1 + (c2 - c1) * t, a1 + d * t);
        return { hex: linToHex(r.lin), clip: r.clip };
    }
    function mixScale(stops, n, model = mixModel) {
        if (stops.length < 2) return stops.map(hex => ({ hex, clip: false }));
        return Array.from({ length: n }, (_, i) => {
            const u = i / (n - 1) * (stops.length - 1);
            const k = Math.min(Math.floor(u), stops.length - 2);
            return mixPair(stops[k], stops[k + 1], u - k, model);
        });
    }

    const modelSel = document.getElementById('mix-model');
    const modelDesc = document.getElementById('model-desc');
    function renderModelSelect() {
        modelSel.innerHTML = MODELS.map(m => `<option value="${m}" ${m === mixModel ? 'selected' : ''}>${t('m_' + m)}</option>`).join('');
        modelDesc.textContent = t('d_' + mixModel);
    }
    modelSel.addEventListener('change', e => { mixModel = e.target.value; saveLS(); renderModelSelect(); if (window.__space) window.__space.refreshText(); renderMixer(); });

    function pushHistory() {
        const hx = currentHex();
        if (history[0] === hx) return;
        history = [hx, ...history.filter(c => c !== hx)].slice(0, HIST_MAX);
        saveLS();
        renderMixer();
    }

    // ------------------------------------------------------------
    // Filas del mixer
    // ------------------------------------------------------------
    const mixerEl = document.getElementById('mixer');
    const compareEl = document.getElementById('compare');
    const mixerPanel = document.getElementById('mixer-panel');
    const toggleHtml = (row, on) => `<span class="aux">${t('auto')} <span class="tgl ${on ? 'on' : ''}" data-toggle="${row}" title="${t('autoTitle')}"></span></span>`;
    const cellHtml = (c, row, extra = '') => {
        const hx = typeof c === 'string' ? c : c.hex;
        const clipCls = typeof c === 'object' && c.clip ? 'clip' : '';
        const sel = hx.toLowerCase() === currentHex() ? 'sel' : '';
        return `<div class="mx-cell ${sel} ${clipCls} ${extra}" style="background:${hx}" data-hex="${hx}" data-row="${row}" title="${hx.toUpperCase()}"></div>`;
    };
    let showRoute = false;
    const routeEl = document.getElementById('route');
    // Proyección polar sobre la rueda: ángulo = tono (según el modelo de rueda), radio = saturación HSB
    function drawRoute() {
        if (!showRoute) { routeEl.innerHTML = ''; return; }
        const { a, b } = blendEnds();
        const pt = hex => {
            let [h, s] = chroma(hex).hsv();
            if (isNaN(h)) { h = 0; s = 0; }
            const w = rad(hueToWheel(h)), r = (s || 0) * (RI - 3);
            return [C + r * Math.sin(w), C - r * Math.cos(w)];
        };
        const path = mixScale([a, b], 61).map(c => pt(c.hex));
        const dots = mixScale([a, b], 11);
        const poly = path.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
        const end = (hex, label) => {
            const [x, y] = pt(hex);
            const fg = chroma(hex).luminance() > .45 ? '#000' : '#fff';
            return `<circle cx="${x}" cy="${y}" r="8" fill="${hex}" stroke="#fff" stroke-width="2"/>
                <text x="${x}" y="${y + 3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="${fg}" font-family="Inter, sans-serif">${label}</text>`;
        };
        routeEl.innerHTML = `
            <polyline points="${poly}" fill="none" stroke="rgba(0,0,0,.7)" stroke-width="4" stroke-linejoin="round"/>
            <polyline points="${poly}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="${mixModel === 'pigment' ? '4 3' : 'none'}"/>
            ${dots.slice(1, -1).map(c => { const [x, y] = pt(c.hex); return `<circle cx="${x}" cy="${y}" r="3.5" fill="${c.hex}" stroke="#fff" stroke-width="1"/>`; }).join('')}
            ${end(a, 'A')}${end(b, 'B')}`;
    }
    const chipHtml = (hex, act, label, title) =>
        `<div class="mx-chip" data-act="${act}" style="background:${hex};color:${chroma(hex).luminance() > .45 ? '#000' : '#fff'}" title="${title}">${label}</div>`;

    const shadesList = () => mixScale(['#000000', mixer.shades.auto ? currentHex() : mixer.shades.base, '#ffffff'], 9);
    const blendEnds = () => ({ a: mixer.blend.auto ? currentHex() : mixer.blend.a, b: mixer.blend.b });
    function schemeList() {
        const pal = mixer.scheme.auto ? paletteHexes() : mixer.scheme.frozen;
        if (pal.length < 2) return { list: mixScale(pal, 1), stops: new Set([0]) };
        if (harmony === 'mono' && mixer.scheme.auto) return { list: mixScale(pal, 11), stops: new Set([0, 10]) };
        const steps = 3;
        const list = mixScale([...pal, pal[0]], pal.length * steps + 1).slice(0, -1);
        return { list, stops: new Set(pal.map((_, k) => k * steps)) };
    }

    // Curvas de L y C (OKLab) bajo una tira
    function drawCurve(cv, hexes) {
        const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
        if (!w) return;
        cv.width = w * dpr; cv.height = h * dpr;
        const ctx = cv.getContext('2d');
        ctx.scale(dpr, dpr);
        const ok = hexes.map(hx => lin2ok(hex01(hx).map(toLin)));
        const n = hexes.length, x = i => (i + 0.5) * w / n;
        const line = (vals, col) => {
            ctx.beginPath();
            vals.forEach((v, i) => { const y = h - 3 - clamp01(v) * (h - 6); i ? ctx.lineTo(x(i), y) : ctx.moveTo(x(i), y); });
            ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
        };
        line(ok.map(o => o[0]), '#a1a1aa');
        line(ok.map(o => Math.hypot(o[1], o[2]) / 0.32), '#f97316');
    }

    function renderMixer() {
        const hist = [...history];
        while (hist.length < HIST_MAX) hist.push(null);
        const { a, b } = blendEnds();
        const blend = mixScale([a, b], 11);
        const sc = schemeList();

        mixerEl.innerHTML = `
            <div class="mx-row">
                <div class="mx-head"><span>${t('history')}</span></div>
                <div class="mx-strip">${hist.map(c => c ? cellHtml(c, 'history') : '<div class="mx-cell empty"></div>').join('')}</div>
            </div>
            <div class="mx-row">
                <div class="mx-head"><span>${t('swatches')}</span><span class="aux">${t('saved', { n: userSwatches.length })}</span></div>
                <div class="mx-strip">
                    ${userSwatches.map((c, i) => cellHtml(c, 'swatches').replace('data-row', `data-sw="${i}" data-row`)).join('')}
                    <div class="mx-add" data-act="add-swatch" title="${t('addSwatch')}">+</div>
                </div>
            </div>
            <div class="mx-row">
                <div class="mx-head"><span>${t('shades')}</span>${toggleHtml('shades', mixer.shades.auto)}</div>
                <div class="mx-strip">${shadesList().map(c => cellHtml(c, 'shades')).join('')}</div>
            </div>
            <div class="mx-row">
                <div class="mx-head"><span>${t('blender')}</span>
                    <span class="aux"><span title="${t('routeTitle')}">${t('route')}</span><span class="tgl ${showRoute ? 'on' : ''}" data-toggle="route" title="${t('routeTitle')}"></span><button class="mx-btn" data-act="swap" title="${t('swapAB')}">A ⇄ B</button>${toggleHtml('blend', mixer.blend.auto).replace('<span class="aux">', '').replace(/<\/span>$/, '')}</span>
                </div>
                <div class="mx-strip">
                    ${chipHtml(a, 'set-a', 'A', t('setA'))}
                    ${blend.map(c => cellHtml(c, 'blend')).join('')}
                    ${chipHtml(b, 'set-b', 'B', t('setB'))}
                </div>
                <div style="padding:0 24px"><canvas class="mx-curve" data-curve="blend"></canvas></div>
            </div>
            <div class="mx-row">
                <div class="mx-head"><span>${t('scheme')}</span>${toggleHtml('scheme', mixer.scheme.auto)}</div>
                <div class="mx-strip">${sc.list.map((c, i) => cellHtml(c, 'scheme', sc.stops.has(i) ? 'stop' : '')).join('')}</div>
            </div>`;

        const compareData = MODELS.map(m => ({ m, list: mixScale([a, b], 11, m) }));
        compareEl.innerHTML = compareData.map(({ m, list }) => `
            <div class="cmp-row ${m === mixModel ? 'active' : ''}">
                <div class="mx-head"><span>${t('m_' + m)}</span>
                    ${m === mixModel ? `<span class="aux">${t('inUse')}</span>` : `<button class="mx-btn" data-act="use-model" data-model="${m}">${t('useModel')}</button>`}
                </div>
                <div class="mx-strip">${list.map(c => cellHtml(c, 'compare')).join('')}</div>
                <canvas class="mx-curve" data-curve="${m}"></canvas>
            </div>`).join('');

        drawCurve(mixerEl.querySelector('[data-curve="blend"]'), blend.map(c => c.hex));
        drawRoute();
        if (window.__space) { window.__space.update(); updateSubtitles(); }
        if (window.__gamut) window.__gamut.update();
        compareData.forEach(({ m, list }) => drawCurve(compareEl.querySelector(`[data-curve="${m}"]`), list.map(c => c.hex)));
    }

    // Al elegir un color desde una fila automática, la fila se congela
    // para que no se reacomode bajo el puntero.
    function freezeRow(row) {
        if (row === 'shades' && mixer.shades.auto) { mixer.shades.base = currentHex(); mixer.shades.auto = false; }
        if ((row === 'blend' || row === 'compare') && mixer.blend.auto) { mixer.blend.a = currentHex(); mixer.blend.auto = false; }
        if (row === 'scheme' && mixer.scheme.auto) { mixer.scheme.frozen = paletteHexes(); mixer.scheme.auto = false; }
    }

    // pointerdown en vez de click: corre antes del blur de otros inputs,
    // así un redibujo del mixer no se come el clic
    mixerPanel.addEventListener('pointerdown', e => {
        if (e.button !== 0 || e.target.closest('select')) return;
        const tgl = e.target.closest('[data-toggle]');
        if (tgl) {
            const row = tgl.dataset.toggle;
            if (row === 'route') { showRoute = !showRoute; renderMixer(); return; }
            if (mixer[row].auto) freezeRow(row); else mixer[row].auto = true;
            renderMixer();
            return;
        }
        const act = e.target.closest('[data-act]');
        if (act) {
            const a = act.dataset.act;
            if (a === 'add-swatch') {
                const hx = currentHex();
                if (!userSwatches.includes(hx)) userSwatches.push(hx);
                saveLS(); showToast(t('swatchSaved'));
            }
            if (a === 'set-a') { mixer.blend.a = currentHex(); mixer.blend.auto = false; }
            if (a === 'set-b') { mixer.blend.b = currentHex(); }
            if (a === 'swap') {
                const { a: A, b: B } = blendEnds();
                mixer.blend.a = B; mixer.blend.b = A; mixer.blend.auto = false;
            }
            if (a === 'use-model') { mixModel = act.dataset.model; saveLS(); renderModelSelect(); if (window.__space) window.__space.refreshText(); }
            renderMixer();
            return;
        }
        const cell = e.target.closest('[data-hex]');
        if (!cell) return;
        if (cell.dataset.sw !== undefined && e.shiftKey) { removeSwatch(+cell.dataset.sw); return; }
        freezeRow(cell.dataset.row);
        commitPrev();
        setFromColor(chroma(cell.dataset.hex), 'mixer');
        pushHistory();
    });
    mixerPanel.addEventListener('contextmenu', e => {
        const cell = e.target.closest('[data-sw]');
        if (!cell) return;
        e.preventDefault();
        removeSwatch(+cell.dataset.sw);
    });
    function removeSwatch(i) {
        userSwatches.splice(i, 1);
        saveLS(); renderMixer();
    }
    document.getElementById('clear-history').addEventListener('click', () => {
        history = [currentHex()]; saveLS(); renderMixer();
    });
    document.getElementById('export-swatches').addEventListener('click', () => {
        const css = userSwatches.map((c, i) => `--swatch-${i + 1}: ${c.toUpperCase()};`).join('\n');
        copyText(css, t('swatchesCopied'));
    });
    window.addEventListener('resize', () => renderMixer());

    // ------------------------------------------------------------
    // Colorimetría base: todo se compara en XYZ relativo a D65
    // ------------------------------------------------------------
    // Color "pedido" cuando no entra en sRGB (desde LCH, Lab, la hoja de tono o el diagrama).
    // null = lo pedido coincide con lo mostrado.
    let target = null;

    const m3 = (A, v) => [0, 1, 2].map(i => A[i][0] * v[0] + A[i][1] * v[1] + A[i][2] * v[2]);
    const mm = (A, B) => A.map(r => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
    function inv3(m) {
        const [a, b, c] = m[0], [d, e, f] = m[1], [g, h, i] = m[2];
        const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g, det = a * A + b * B + c * C;
        return [[A, -(b * i - c * h), b * f - c * e], [B, a * i - c * g, -(a * f - c * d)], [C, -(a * h - b * g), a * e - b * d]]
            .map(r => r.map(x => x / det));
    }
    const xyToXYZ = ([x, y], Y = 1) => [x * Y / y, Y, (1 - x - y) * Y / y];
    const xyOf = ([X, Y, Z]) => { const s = X + Y + Z; return s > 1e-12 ? [X / s, Y / s] : null; };
    const D65 = [0.3127, 0.3290], D50 = [0.3457, 0.3585];
    const D50_ICC = [0.9642, 1.0, 0.8249];
    const BRADFORD = [[0.8951, 0.2664, -0.1614], [-0.7502, 1.7135, 0.0367], [0.0389, -0.0685, 1.0296]];
    function adaptXYZ(srcW, dstW) {
        const s = m3(BRADFORD, srcW), d = m3(BRADFORD, dstW);
        return mm(inv3(BRADFORD), mm([[d[0] / s[0], 0, 0], [0, d[1] / s[1], 0], [0, 0, d[2] / s[2]]], BRADFORD));
    }
    function rgbToXyzMatrix(r, g, b, w) {
        const P = [r, g, b].map(p => xyToXYZ(p));
        const Pm = [0, 1, 2].map(i => [P[0][i], P[1][i], P[2][i]]);
        const S = m3(inv3(Pm), xyToXYZ(w));
        let M = Pm.map(row => row.map((v, j) => v * S[j]));
        if (Math.hypot(w[0] - D65[0], w[1] - D65[1]) > 1e-4) M = mm(adaptXYZ(xyToXYZ(w), xyToXYZ(D65)), M);
        return M;
    }
    const SRGB_M = rgbToXyzMatrix([0.64, 0.33], [0.30, 0.60], [0.15, 0.06], D65);
    const SRGB_MI = inv3(SRGB_M);
    const WN = xyToXYZ(D65);
    function labToXyz(L, a, b) {
        const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200, e = 6 / 29;
        const fi = t => t > e ? t * t * t : 3 * e * e * (t - 4 / 29);
        return [WN[0] * fi(fx), WN[1] * fi(fy), WN[2] * fi(fz)];
    }
    function xyzToLab([X, Y, Z]) {
        const e = 6 / 29, f = t => t > e * e * e ? Math.cbrt(t) : t / (3 * e * e) + 4 / 29;
        const fx = f(X / WN[0]), fy = f(Y / WN[1]), fz = f(Z / WN[2]);
        return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
    }
    const xyzOfHex = hex => m3(SRGB_M, hex01(hex).map(toLin));
    const okToXyz = (L, C, H) => m3(SRGB_M, ok2lin([L, C * Math.cos(H), C * Math.sin(H)]));
    function okOfXYZ(xyz) {
        const [L, a, b] = lin2ok(m3(SRGB_MI, xyz));
        return { L, C: Math.hypot(a, b), H: mod360(Math.atan2(b, a) * 180 / Math.PI), a, b };
    }
    // Gamut mapping a sRGB: baja el croma en OKLCH conservando L y H (estilo CSS Color 4)
    function gamutMapXYZ(xyz) {
        const lin = m3(SRGB_MI, xyz);
        if (inGamut(lin)) return linToHex(lin);
        const o = okOfXYZ(xyz);
        return linToHex(okLchToLin(clamp01(o.L), o.C, rad(o.H)).lin);
    }
    // Punto de entrada para cualquier color pedido en XYZ
    function applyXYZ(xyz, source) {
        const lin = m3(SRGB_MI, xyz);
        if (inGamut(lin)) { target = null; setFromColor(chroma(linToHex(lin)), source); }
        else { target = xyz; setFromColor(chroma(gamutMapXYZ(xyz)), source); }
    }

    // ------------------------------------------------------------
    // Espacios RGB: primarios + blanco + curva de transferencia
    // ------------------------------------------------------------
    function paraEval(fn, p, x) {
        const [g, a = 1, b = 0, c = 0, d = 0, e = 0, f = 0] = p;
        if (fn === 0) return Math.pow(x, g);
        if (fn === 1) return x >= -b / a ? Math.pow(Math.max(0, a * x + b), g) : 0;
        if (fn === 2) return x >= -b / a ? Math.pow(Math.max(0, a * x + b), g) + c : c;
        if (fn === 3) return x >= d ? Math.pow(Math.max(0, a * x + b), g) : c * x;
        return x >= d ? Math.pow(Math.max(0, a * x + b), g) + e : c * x + f;
    }
    function tfDecode(tf, v) {
        const s = Math.sign(v), a = Math.abs(v);
        let r;
        switch (tf.type) {
            case 'srgb': r = a <= 0.04045 ? a / 12.92 : Math.pow((a + 0.055) / 1.055, 2.4); break;
            case 'gamma': r = Math.pow(a, tf.g); break;
            case 'prophoto': r = a < 16 / 512 ? a / 16 : Math.pow(a, 1.8); break;
            case 'rec2020': {
                const al = 1.09929682680944, be = 0.018053968510807;
                r = a < be * 4.5 ? a / 4.5 : Math.pow((a + al - 1) / al, 1 / 0.45); break;
            }
            case 'para': r = paraEval(tf.fn, tf.p, Math.min(a, 1)); break;
            case 'table': {
                const d = tf.data, n = d.length - 1, u = Math.min(1, a) * n, i = Math.min(n - 1, Math.floor(u));
                r = d[i] + (d[i + 1] - d[i]) * (u - i); break;
            }
            default: r = a;
        }
        return s * r;
    }
    function tfEncode(tf, v) {
        const s = Math.sign(v), a = Math.abs(v);
        switch (tf.type) {
            case 'srgb': return s * (a <= 0.0031308 ? 12.92 * a : 1.055 * Math.pow(a, 1 / 2.4) - 0.055);
            case 'gamma': return s * Math.pow(a, 1 / tf.g);
            case 'linear': return v;
            case 'prophoto': return s * (a < 1 / 512 ? a * 16 : Math.pow(a, 1 / 1.8));
            case 'rec2020': {
                const al = 1.09929682680944, be = 0.018053968510807;
                return s * (a < be ? 4.5 * a : al * Math.pow(a, 0.45) - (al - 1));
            }
        }
        // Curvas ICC: inversa numérica (son monótonas)
        if (a >= 1) return s * a;
        let lo = 0, hi = 1;
        for (let i = 0; i < 28; i++) { const m = (lo + hi) / 2; tfDecode(tf, m) < a ? lo = m : hi = m; }
        return s * (lo + hi) / 2;
    }

    const Gamut = (() => {
        const BUILTIN = [
            { id: 'srgb', name: 'sRGB', r: [0.64, 0.33], g: [0.30, 0.60], b: [0.15, 0.06], w: D65, tf: { type: 'srgb' }, css: 'srgb', color: '#f4f4f5' },
            { id: 'p3', name: 'Display P3', r: [0.68, 0.32], g: [0.265, 0.69], b: [0.15, 0.06], w: D65, tf: { type: 'srgb' }, css: 'display-p3', color: '#ff2e63' },
            { id: 'a98', name: 'Adobe RGB (1998)', r: [0.64, 0.33], g: [0.21, 0.71], b: [0.15, 0.06], w: D65, tf: { type: 'gamma', g: 563 / 256 }, css: 'a98-rgb', color: '#e4ff3a' },
            { id: 'rec2020', name: 'Rec.2020', r: [0.708, 0.292], g: [0.170, 0.797], b: [0.131, 0.046], w: D65, tf: { type: 'rec2020' }, css: 'rec2020', color: '#38e1ff' },
            { id: 'prophoto', name: 'ProPhoto RGB', r: [0.7347, 0.2653], g: [0.1596, 0.8404], b: [0.0366, 0.0001], w: D50, tf: { type: 'prophoto' }, css: 'prophoto-rgb', color: '#b28cff' },
            { id: 'dcip3', name: 'DCI-P3', r: [0.68, 0.32], g: [0.265, 0.69], b: [0.15, 0.06], w: [0.314, 0.351], tf: { type: 'gamma', g: 2.6 }, color: '#ff8a3d' },
            { id: 'acescg', name: 'ACEScg (AP1)', r: [0.713, 0.293], g: [0.165, 0.830], b: [0.128, 0.044], w: [0.32168, 0.33767], tf: { type: 'linear' }, color: '#3dff6e' }
        ];
        const EXTRA_COLORS = ['#ff5ad1', '#ffd23d', '#5effc8', '#ff9e5e', '#9ec5ff', '#ff6b6b'];
        const LS = 'color-picker-wheel-spaces';
        let custom = [], visible = { srgb: true, p3: true, a98: true, rec2020: true, prophoto: true, dcip3: false, acescg: false };
        try {
            const st = JSON.parse(localStorage.getItem(LS)) || {};
            if (Array.isArray(st.custom)) custom = st.custom.filter(validSpace);
            if (st.visible) visible = { ...visible, ...st.visible };
        } catch (e) {}
        const save = () => { try { localStorage.setItem(LS, JSON.stringify({ custom: custom.map(strip), visible })); } catch (e) {} };
        const strip = sp => { const { _M, _Mi, ...rest } = sp; return rest; };
        function validSpace(sp) {
            const ok = p => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite) && p[1] > 0;
            if (!sp || !ok(sp.r) || !ok(sp.g) || !ok(sp.b) || !ok(sp.w)) return false;
            const det = (sp.g[0] - sp.r[0]) * (sp.b[1] - sp.r[1]) - (sp.g[1] - sp.r[1]) * (sp.b[0] - sp.r[0]);
            return Math.abs(det) > 1e-5;
        }

            const l = linIn(sp, xyz), e = 2e-4;

        const fitsList = xyz => all().filter(sp => sp.id !== 'srgb' && status(sp, xyz) === 'in').map(sp => sp.name);

        // ---------- Locus espectral CIE 1931 2°, cada 5 nm ----------
        const LOCUS_RAW = [
            [380,.1741,.0050],[385,.1740,.0050],[390,.1738,.0049],[395,.1736,.0049],[400,.1733,.0048],[405,.1730,.0048],
            [410,.1726,.0048],[415,.1721,.0048],[420,.1714,.0051],[425,.1703,.0058],[430,.1689,.0069],[435,.1669,.0086],
            [440,.1644,.0109],[445,.1611,.0138],[450,.1566,.0177],[455,.1510,.0227],[460,.1440,.0297],[465,.1355,.0399],
            [470,.1241,.0578],[475,.1096,.0868],[480,.0913,.1327],[485,.0687,.2007],[490,.0454,.2950],[495,.0235,.4127],
            [500,.0082,.5384],[505,.0039,.6548],[510,.0139,.7502],[515,.0389,.8120],[520,.0743,.8338],[525,.1142,.8262],
            [530,.1547,.8059],[535,.1929,.7816],[540,.2296,.7543],[545,.2658,.7243],[550,.3016,.6923],[555,.3373,.6589],
            [560,.3731,.6245],[565,.4087,.5896],[570,.4441,.5547],[575,.4788,.5202],[580,.5125,.4866],[585,.5448,.4544],
            [590,.5752,.4242],[595,.6029,.3965],[600,.6270,.3725],[605,.6482,.3514],[610,.6658,.3340],[615,.6801,.3197],
            [620,.6915,.3083],[625,.7006,.2993],[630,.7079,.2920],[635,.7140,.2859],[640,.7190,.2809],[645,.7230,.2770],
            [650,.7260,.2740],[655,.7283,.2717],[660,.7300,.2700],[665,.7311,.2689],[670,.7320,.2680],[675,.7327,.2673],
            [680,.7334,.2666],[685,.7340,.2660],[690,.7344,.2656],[695,.7346,.2654],[700,.7347,.2653]
        ];
        const LOCUS = LOCUS_RAW.map(([, x, y]) => [x, y]);
        const LOCUS_NM = LOCUS_RAW.map(([nm]) => nm);
        function insidePoly(p, poly) {
            let c = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const [xi, yi] = poly[i], [xj, yj] = poly[j];
                if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) c = !c;
            }
            return c;
        }
        const insideLocus = xy => insidePoly(xy, LOCUS);

        // Locus de Planck (aproximación de Kim et al., 1667 K a 25000 K)
        function planck(T) {
            const T2 = T * T, T3 = T2 * T;
            const x = T <= 4000 ? -0.2661239e9 / T3 - 0.2343589e6 / T2 + 0.8776956e3 / T + 0.179910
                                : -3.0258469e9 / T3 + 2.1070379e6 / T2 + 0.2226347e3 / T + 0.240390;
            const x2 = x * x, x3 = x2 * x;
            const y = T <= 2222 ? -1.1063814 * x3 - 1.34811020 * x2 + 2.18555832 * x - 0.20219683
                    : T <= 4000 ? -0.9549476 * x3 - 1.37418593 * x2 + 2.09137015 * x - 0.16748867
                                :  3.0817580 * x3 - 5.87338670 * x2 + 3.75112997 * x - 0.37001483;

        }

        // Longitud de onda dominante y pureza de excitación (respecto de D65)
        function dominant(xy) {
            const d = [xy[0] - D65[0], xy[1] - D65[1]];
            if (Math.hypot(d[0], d[1]) < 2e-3) return null;
            const hit = dir => {
                const n = LOCUS.length;
                for (let i = 0; i < n; i++) {
                    const P = LOCUS[i], Q = LOCUS[(i + 1) % n], e = [Q[0] - P[0], Q[1] - P[1]];
                    const den = dir[0] * e[1] - dir[1] * e[0];
                    if (Math.abs(den) < 1e-12) continue;
                    const w = [P[0] - D65[0], P[1] - D65[1]];
                    const t = (w[0] * e[1] - w[1] * e[0]) / den, u = (w[0] * dir[1] - w[1] * dir[0]) / den;
                    if (t > 1e-9 && u >= 0 && u <= 1) {
                        const purple = i === n - 1;

                    }
                }
                return null;
            };
            const h = hit(d);
            if (!h) return null;
            const purity = Math.min(1, 1 / h.t);
            if (!h.purple) return { nm: h.nm, purity, pt: h.pt, purple: false };

        // ---------- Áreas y coberturas (Sutherland-Hodgman, recorte convexo) ----------
        const sArea = p => p.reduce((s, a, i) => { const b = p[(i + 1) % p.length]; return s + a[0] * b[1] - b[0] * a[1]; }, 0) / 2;
        function clipPoly(subject, clip) {
            const sg = Math.sign(sArea(clip)) || 1;
            const ins = (p, a, b) => sg * ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0])) >= 0;
            const X = (s, e, a, b) => {
                const A1 = e[1] - s[1], B1 = s[0] - e[0], C1 = A1 * s[0] + B1 * s[1];
                const A2 = b[1] - a[1], B2 = a[0] - b[0], C2 = A2 * a[0] + B2 * a[1], det = A1 * B2 - A2 * B1;
                return [(B2 * C1 - B1 * C2) / det, (A1 * C2 - A2 * C1) / det];
            };
            let out = subject;
            for (let i = 0; i < clip.length && out.length; i++) {
                const a = clip[i], b = clip[(i + 1) % clip.length], inp = out;
                out = [];
                for (let j = 0; j < inp.length; j++) {
                    const cur = inp[j], prev = inp[(j + inp.length - 1) % inp.length];
                    if (ins(cur, a, b)) { if (!ins(prev, a, b)) out.push(X(prev, cur, a, b)); out.push(cur); }
                    else if (ins(prev, a, b)) out.push(X(prev, cur, a, b));
                }
            }
            return out;
        }

        // ---------- Diagrama ----------
        let mode = 'xy';
        const gl = { planck: true, dominant: true, points: true, labels: true };
        const toUV = ([x, y]) => { const d = -2 * x + 12 * y + 3; return [4 * x / d, 9 * y / d]; };
        const fromUV = ([u, v]) => { const d = 6 * u - 16 * v + 12; return [9 * u / d, 4 * v / d]; };
        const disp = p => mode === 'xy' ? p : toUV(p);
        const undisp = p => mode === 'xy' ? p : fromUV(p);
        const DOM = { xy: { x: [0, 0.8], y: [0, 0.9] }, uv: { x: [0, 0.65], y: [0, 0.62] } };
        function coverage(sp) {
            const tri = [sp.r, sp.g, sp.b].map(disp);
            const s = [BUILTIN[0].r, BUILTIN[0].g, BUILTIN[0].b].map(disp), loc = LOCUS.map(disp);
            return {
                s: Math.abs(sArea(clipPoly(s, tri))) / Math.abs(sArea(s)),
                v: Math.abs(sArea(clipPoly(loc, tri))) / Math.abs(sArea(loc))
            };
        }

        const view = document.getElementById('gm-view');
        const cv = document.getElementById('gm-canvas');
        const hoverEl = document.getElementById('gm-hover');
        let frame = null, bgKey = '', bg = null;
        function makeFrame(W, H) {
            const d = DOM[mode], pl = 34, pr = 14, pt = 14, pb = 30;
            const s = Math.min((W - pl - pr) / (d.x[1] - d.x[0]), (H - pt - pb) / (d.y[1] - d.y[0]));
            const ox = pl + ((W - pl - pr) - s * (d.x[1] - d.x[0])) / 2;
            const oy = H - pb - ((H - pt - pb) - s * (d.y[1] - d.y[0])) / 2;
            return { W, H, s, ox, oy, d };
        }
        const toPx = p => [frame.ox + (p[0] - frame.d.x[0]) * frame.s, frame.oy - (p[1] - frame.d.y[0]) * frame.s];
        const fromPx = ([px, py]) => [frame.d.x[0] + (px - frame.ox) / frame.s, frame.d.y[0] + (frame.oy - py) / frame.s];

        // Relleno ilustrativo: cada cromaticidad con Y = 1, desaturada hacia blanco hasta entrar en sRGB

            const key = [mode, W, H].join('|');

            bgKey = key;
            bg = document.createElement('canvas');
            bg.width = W; bg.height = H;
            const ctx = bg.getContext('2d'), img = ctx.createImageData(W, H), d = img.data;
            for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
                const xy = undisp(fromPx([px + 0.5, py + 0.5]));
                if (!(xy[1] > 0) || !insideLocus(xy)) continue;
                let lin = m3(SRGB_MI, xyToXYZ(xy));
                const mn = Math.min(...lin);
                if (mn < 0) lin = lin.map(v => v - mn);
                const mx = Math.max(...lin);
                lin = lin.map(v => v / mx);
                const i = (py * W + px) * 4;
                for (let k = 0; k < 3; k++) d[i + k] = clamp01(toGam(lin[k])) * 230;
                d[i + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
        }

        function draw() {
            const W = cv.clientWidth, H = cv.clientHeight;
            if (!W || !H) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
            frame = makeFrame(W, H);

            ctx.font = '10px Inter, sans-serif'; ctx.fillStyle = '#6b6b75'; ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
            const d = frame.d;
            for (let v = 0; v <= d.x[1] + 1e-9; v += 0.1) {

                ctx.textAlign = 'center'; ctx.fillText(v.toFixed(1), x, frame.oy + 16);

            }
            ctx.textAlign = 'left'; ctx.fillStyle = '#a1a1aa';
            ctx.fillText(mode === 'xy' ? 'x' : 'u′', toPx([d.x[1], 0])[0] - 8, frame.oy - 6);
            ctx.fillText(mode === 'xy' ? 'y' : 'v′', frame.ox + 6, toPx([0, d.y[1]])[1] + 10);

            // Triángulos de los espacios visibles
            all().forEach(sp => {
                if (!visible[sp.id]) return;
                const pts = [sp.r, sp.g, sp.b].map(pxOfXY);
                ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
                ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.stroke();
                ctx.lineWidth = 1.6; ctx.strokeStyle = sp.color; ctx.stroke();
                ctx.fillStyle = sp.color;
                pts.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill(); });
                if (gl.labels) {

            }

            if (gl.dominant && ref) {

                    ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]);
                }

                ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
                const [x, y] = b;
                ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.lineWidth = 2.5; ctx.strokeStyle = '#ff5a1f'; ctx.stroke();
            }

        }

        // ---------- Interacción ----------
        let drag = false;
        function xyAt(e) {
            const r = cv.getBoundingClientRect();
            return undisp(fromPx([e.clientX - r.left, e.clientY - r.top]));
        }
        function pickAt(e) {
            const xy = xyAt(e);
            if (!(xy[1] > 0) || !insideLocus(xy)) return;
            let Y = (target || xyzOfHex(currentHex()))[1];
            if (Y < 0.02) Y = 0.2;
            applyXYZ(xyToXYZ(xy, Y), 'gamut');
        }
        view.addEventListener('pointerdown', e => { drag = true; view.setPointerCapture(e.pointerId); commitPrev(); pickAt(e); });
        view.addEventListener('pointermove', e => {
            if (drag) { pickAt(e); return; }
            if (!frame) return;
            const xy = xyAt(e), p = fromPx((r => [e.clientX - r.left, e.clientY - r.top])(cv.getBoundingClientRect()));
            hoverEl.textContent = (mode === 'xy' ? `x ${p[0].toFixed(4)}  y ${p[1].toFixed(4)}` : `u′ ${p[0].toFixed(4)}  v′ ${p[1].toFixed(4)}`)
                + (xy[1] > 0 && insideLocus(xy) ? '' : `  ·  ${t('outsideVisible')}`);
        });
        view.addEventListener('pointerleave', () => { if (!drag) hoverEl.textContent = t('gmHint'); });
        view.addEventListener('pointerup', () => { if (drag) { drag = false; pushHistory(); } });
        new ResizeObserver(() => { bgKey = ''; draw(); }).observe(view);

        // ---------- Columna derecha ----------
        const $ = id => document.getElementById(id);
        const fmt = (v, n = 4) => (Math.abs(v) < 5e-5 ? 0 : v).toFixed(n);
        const tfLabel = tf => ({ srgb: 'sRGB', gamma: 'γ ' + (tf.g ? +tf.g.toFixed(2) : ''), linear: t('tf_linear'), prophoto: 'γ 1.8', rec2020: 'BT.2020', para: t('iccTrc'), table: t('iccTrc') })[tf.type] || tf.type;
        const wpLabel = w => [['D65', D65], ['D50', D50], ['DCI', [0.314, 0.351]], ['ACES', [0.32168, 0.33767]]]
            .find(([, p]) => Math.hypot(p[0] - w[0], p[1] - w[1]) < 1e-3)?.[0] || `${w[0].toFixed(4)}, ${w[1].toFixed(4)}`;
        const screenGamut = () => matchMedia('(color-gamut: rec2020)').matches ? 'Rec.2020' : matchMedia('(color-gamut: p3)').matches ? 'P3' : 'sRGB';
        function cssFor(sp, xyz) {
            const v = encoded(sp, xyz).map(x => fmt(x));
            return sp.css ? `color(${sp.css} ${v.join(' ')})` : v.join(' ');
        }

        function renderSide() {
            const cur = currentHex(), xyzD = xyzOfHex(cur), xyzT = target || xyzD;
            $('sub-gamut').textContent = mode === 'xy' ? 'CIE 1931 xy' : 'CIE 1976 u′v′';
            $('gm-screen').textContent = t('screenGamut', { g: screenGamut() });
            $('gm-disp').style.background = cur;
            $('gm-disp-hex').textContent = cur.toUpperCase();
            const reqEl = $('gm-req'), reqTxt = $('gm-req-txt');
            if (!target) {
                reqEl.className = 'sw-big'; reqEl.style.background = cur; reqTxt.textContent = cur.toUpperCase();
            } else {
                const wide = BUILTIN.filter(sp => sp.css && sp.id !== 'srgb' && status(sp, target) === 'in')
                    .map(sp => cssFor(sp, target)).find(c => CSS.supports('color', c));
                reqEl.className = 'sw-big' + (wide ? '' : ' hatch');
                reqEl.style.background = wide || '';
                const oD = okOfXYZ(xyzD), oT = okOfXYZ(target);
                reqTxt.textContent = (wide ? '' : t('notShowable') + ' · ') + t('deltaE', { d: Math.hypot(oD.L - oT.L, oD.a - oT.a, oD.b - oT.b).toFixed(3) });
            }
            const xy = xyOf(xyzT) || D65;
            $('gm-x').textContent = xy[0].toFixed(4);
            $('gm-y').textContent = xy[1].toFixed(4);
            $('gm-Y').innerHTML = `${(xyzT[1] * 100).toFixed(1)}<sup>%</sup>`;
            const dm = dominant(xy);
            $('gm-dom').textContent = !dm ? t('domNone')
                : dm.purple ? t('compVal', { nm: dm.nm ? Math.round(dm.nm) : '?', p: Math.round(dm.purity * 100) })
                : t('domVal', { nm: Math.round(dm.nm), p: Math.round(dm.purity * 100) });

            $('gm-list').innerHTML = all().map(sp => {
                const st = status(sp, xyzT), cov = coverage(sp);
                const note = sp.custom ? (sp.source || '') : t('gn_' + sp.id);
                return `<div class="gm-row">
                    <button class="gm-vis ${visible[sp.id] ? 'on' : ''}" data-vis="${sp.id}" style="--c:${sp.color}" title="${t('toggleVis')}"></button>
                    <div class="gm-name"><b>${escapeHtml(sp.name)}</b><small>${wpLabel(sp.w)} · ${tfLabel(sp.tf)}${note ? ' · ' + escapeHtml(note) : ''}</small>
                        <small>${t('covS', { s: Math.round(cov.s * 100) })} · ${t('covV', { v: Math.round(cov.v * 100) })}</small></div>
                    <div class="gm-actions">
                        <span class="pill mini ${st}" title="${st === 'lum' ? t('stTitle_lum') : ''}">${t('st_' + st)}</span>
                        <button class="gm-icon" data-copy-sp="${sp.id}" title="${escapeHtml(cssFor(sp, xyzT))}">${t('copyVals')}</button>

        function parseICC(buf) {

        function renderToolbar() {

    // ------------------------------------------------------------

    const Space3D = (() => {

        const ROUTE_COLORS = { srgb: '#8b8b94', linear: '#5ee7ff', oklab: '#ffffff', oklchShort: '#ff2e63', oklchLong: '#e4ff3a', pigment: '#3dff6e' };
        let space = 'oklab', fromSpace = 'oklab', morph = 1, morphStart = 0;
        let renderMode = 'translucent';
        const layers = { harmony: true, route: true, allRoutes: false, gamuts: true, history: true, swatches: false, axes: true };

        const view = document.getElementById('sp-view');
        const canvas = document.getElementById('sp-canvas');
        const labelsEl = document.getElementById('sp-labels');
        const leaf = document.getElementById('leaf');
        const $ = id => document.getElementById(id);

        // ---------- Mapeos de color a coordenadas (y = claridad) ----------
        const SQ3 = Math.sqrt(3), SQ6 = Math.sqrt(6), SQ2 = Math.sqrt(2);
        const ex = [2 / SQ6, -1 / SQ6, -1 / SQ6], ey = [1 / SQ3, 1 / SQ3, 1 / SQ3], ez = [0, 1 / SQ2, -1 / SQ2];
        const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        function rgbToHsvLocal([r, g, b]) {
            const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
            let h = 0;
            if (d > 1e-9) {
                if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
                h *= 60;
            }
            return [mod360(h), max ? d / max : 0, max];
        }
        function mapColor(sp, rgb) {
            if (sp === 'rgb') {
                // Cubo rotado: el eje negro-blanco queda vertical, el rojo apunta a +x
                const v = rgb.map(c => c - 0.5), k = 0.6 / 0.866;
                return [dot(v, ex) * k, dot(v, ey) * k, dot(v, ez) * k];
            }
            if (sp === 'hsv' || sp === 'hsl') {
                const [h, s, v] = rgbToHsvLocal(rgb);
                let rad_, y;
                if (sp === 'hsv') { rad_ = s * v * 0.6; y = v; }
                else {
                    const L = v * (1 - s / 2);
                    const sl = (L <= 0 || L >= 1) ? 0 : (v - L) / Math.min(L, 1 - L);
                    rad_ = sl * (1 - Math.abs(2 * L - 1)) * 0.6; y = L;
                }

            }
            if (sp === 'lab') {
                const [L, a, b] = xyzToLab(m3(SRGB_M, rgb.map(toLin)));

            }

        // ---------- Toolbar ----------
        function pills(el, items, cur, key, onPick, multi) {

                const active = multi ? cur[v] : cur === v;
                const sw = key === 'layer' ? `<span class="sw" style="background:${layerColor(v)}"></span>` : '';
                return `<button class="pill-btn ${active ? 'active' : ''}" data-v="${v}">${sw}${t(key + '_' + v)}</button>`;
            }).join('');
            el.onclick = e => { const b = e.target.closest('[data-v]'); if (b) onPick(b.dataset.v); };
        }
        const layerColor = v => ({ harmony: '#ffffff', route: ROUTE_COLORS[mixModel] || '#fff', allRoutes: '#ff2e63', gamuts: '#38e1ff', history: '#a1a1aa', swatches: '#e4ff3a', axes: '#6b6b75' })[v];
        function renderToolbar() {
            pills($('sp-spaces'), SPACES, space, 'sp', v => setSpace(v));
            pills($('sp-render'), RENDERS, renderMode, 'rm', v => { renderMode = v; applyRenderMode(); renderToolbar(); dirty = true; });
            pills($('sp-layers'), LAYERS, layers, 'layer', v => { layers[v] = !layers[v]; renderToolbar(); update(); }, true);
            $('sub-space').textContent = t('sp_' + space);
            $('space-note').textContent = t('note_' + space);
            $('sp-legend').innerHTML = `<div class="mx-head"><span>${t('routesLegend')}</span></div>` +
                MODELS.map(m => `<div class="lg-row"><span class="lg-line" style="background:${ROUTE_COLORS[m]}"></span>${t('m_' + m)}${m === mixModel ? ` <span style="color:var(--accent)">· ${t('inUse')}</span>` : ''}</div>`).join('') +
                (layers.gamuts ? `<div class="mx-head" style="margin-top:12px"><span>${t('layer_gamuts').toUpperCase()}</span></div>` +
                    (ABS.has(space) ? Gamut.visibleSpaces().filter(g => g.id !== 'srgb').map(g => `<div class="lg-row"><span class="lg-line" style="background:${g.color}"></span>${g.name.length > 32 ? g.name.slice(0, 31) + '…' : g.name}</div>`).join('')
                        : `<div class="sp-small" style="margin-top:6px">${t('gamutsOnlyAbs')}</div>`) : '');
        }

        // ---------- Sin WebGL ----------
        if (typeof THREE === 'undefined') {
            view.innerHTML = `<div class="sp-error">${t('noThree')}</div>`;
            renderToolbar();
            return { update() { updateSide(); }, refreshText() { renderToolbar(); } };
        }

        // ---------- Escena ----------
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 4 / 3, 0.01, 50);
        let theta = -0.6, phi = 1.15, dist = 2.55, dirty = true;
        function placeCamera() {
            camera.position.set(dist * Math.sin(phi) * Math.cos(theta), dist * Math.cos(phi), dist * Math.sin(phi) * Math.sin(theta));
            camera.lookAt(0, 0, 0);
        }

        // Sólido del gamut sRGB: las 6 caras del cubo, subdivididas
