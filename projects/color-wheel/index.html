        ];
        const index = [];
        faces.forEach(f => {
            const base = faceRgb.length;
            for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) faceRgb.push(f(i / N, j / N));
            for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {

        solidGeo.setIndex(index);

        }

        function rebuild() {
            clearDyn();
            labelDefs = [];
            const cur = currentHex();

                addLine([posOf([0, 0, 0]), posOf([1, 1, 1])], '#6b6b75', 0.8);
                labelDefs.push({ p: posOf([1, 1, 1]), txt: t('white'), dy: -14 }, { p: posOf([0, 0, 0]), txt: t('black'), dy: 14 });
                [['R', [1, 0, 0]], ['Y', [1, 1, 0]], ['G', [0, 1, 0]], ['C', [0, 1, 1]], ['B', [0, 0, 1]], ['M', [1, 0, 1]]]
                    .forEach(([l, c]) => { const p = posOf(c); labelDefs.push({ p: [p[0] * 1.14, p[1], p[2] * 1.14], txt: l }); });

                labelDefs.push({ p, txt: t('requested'), dy: -24, kind: 'warn' });
            }
            if (layers.history) history.slice(1).forEach(h => addSphere(h, 0.016, { outline: '#000000' }));
            if (layers.swatches) userSwatches.forEach(h => addSphere(h, 0.018, { outline: '#e4ff3a' }));
            if (layers.harmony && harmony !== 'mono') paletteHexes().slice(1).forEach(h => addSphere(h, 0.026, { outline: '#ffffff' }));
            addSphere(cur, 0.042, { outline: '#ffffff' });
            labelDefs.push({ p: posOf(hex01(cur)), txt: cur.toUpperCase(), dy: -24, strong: true });
            dirty = true;
        }

        // ---------- Etiquetas HTML proyectadas ----------
        function drawLabels() {
            const w = view.clientWidth, h = view.clientHeight;
            labelsEl.innerHTML = labelDefs.map(d => {
                const v = new THREE.Vector3(...d.p).project(camera);
                if (v.z > 1) return '';
                const x = (v.x + 1) / 2 * w, y = (1 - v.y) / 2 * h + (d.dy || 0);
                return `<span class="sp-label" style="left:${x}px;top:${y}px;${d.strong ? 'color:#fff;background:rgba(255,46,99,.9)' : d.kind === 'route' ? 'color:#0a0a0b;background:#e4ff3a' : d.kind === 'warn' ? 'color:#2a0d00;background:#ff5a1f' : d.color ? `color:${d.color}` : ''}">${d.txt}</span>`;
            }).join('');
        }

        // ---------- Órbita, zoom y selección ----------
        let down = null;
        view.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, th: theta, ph: phi, moved: false }; view.setPointerCapture(e.pointerId); });
        view.addEventListener('pointermove', e => {
            if (!down) return;
            const dx = e.clientX - down.x, dy = e.clientY - down.y;
            if (Math.abs(dx) + Math.abs(dy) > 3) down.moved = true;
            theta = down.th + dx * 0.008;
            phi = clamp(down.ph - dy * 0.008, 0.15, Math.PI - 0.15);
            placeCamera(); dirty = true;
        });
        view.addEventListener('pointerup', e => {
            if (down && !down.moved) pick(e);
            down = null;
        });
        view.addEventListener('wheel', e => { e.preventDefault(); dist = clamp(dist * (1 + e.deltaY * 0.001), 1.6, 7); placeCamera(); dirty = true; }, { passive: false });
        view.addEventListener('dblclick', () => { theta = -0.6; phi = 1.15; dist = 2.55; placeCamera(); dirty = true; });
        const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
        function pick(e) {
            const r = canvas.getBoundingClientRect();
            ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
            ray.setFromCamera(ndc, camera);
            const hitP = ray.intersectObjects(pickables)[0];
            let hex = hitP && hitP.object.userData.hex;
            if (!hex) {
                const hit = ray.intersectObject(solid)[0];
                if (hit) {
                    const ids = [hit.face.a, hit.face.b, hit.face.c];
                    let best = ids[0], bd = Infinity;
                    ids.forEach(i => { const d = hit.point.distanceToSquared(new THREE.Vector3(posArr[i * 3], posArr[i * 3 + 1], posArr[i * 3 + 2])); if (d < bd) { bd = d; best = i; } });
                    hex = chroma.gl(...faceRgb[best]).hex();
                }
            }
            if (hex) { commitPrev(); setFromColor(chroma(hex), 'space'); pushHistory(); }
        }

        function setSpace(sp) {
            if (sp === space) return;
            fromSpace = space; space = sp; morph = 0; morphStart = performance.now();
            renderToolbar();
        }

        // ---------- Loop ----------
        function resize() {
            const w = view.clientWidth, h = view.clientHeight;
            if (!w || !h) return;
            renderer.setSize(w, h, false);
            camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
        }
        new ResizeObserver(resize).observe(view);
        function loop(now) {
            if (morph < 1) {
                morph = Math.min(1, (now - morphStart) / 700);
                updateSolid(); rebuild();
            }
            if (dirty) { renderer.render(scene, camera); drawLabels(); dirty = false; }
            requestAnimationFrame(loop);
        }
        updateSolid(); applyRenderMode(); resize();
        requestAnimationFrame(loop);

        function update() { rebuild(); updateSide(); }
        renderToolbar();
        return { update, refreshText() { renderToolbar(); rebuild(); } };
    })();

    // ---------- Columna derecha: lecturas OKLCH y hoja de tono ----------
    let lastLeafKey = '';
    function okOfHex(hex) {
        const [L, a, b] = lin2ok(hex01(hex).map(toLin));
        return { L, C: Math.hypot(a, b), H: mod360(Math.atan2(b, a) * 180 / Math.PI) };
    }
    function maxChroma(L, Hdeg) {
        const H = rad(Hdeg);
        let lo = 0, hi = 0.4;
        for (let i = 0; i < 22; i++) { const m = (lo + hi) / 2; inGamut(ok2lin([L, m * Math.cos(H), m * Math.sin(H)])) ? lo = m : hi = m; }
        return lo;
    }
    let leafHue = 0;
    function updateSide() {
        const hex = currentHex(), o = okOfXYZ(target || xyzOfHex(hex));
        const achrom = o.C < 0.002;
        if (!achrom) leafHue = o.H;
        document.getElementById('ro-l').innerHTML = `${(o.L * 100).toFixed(1)}<sup>%</sup>`;
        document.getElementById('ro-c').innerHTML = `${o.C.toFixed(3)}`;
        document.getElementById('ro-h').innerHTML = achrom ? `<span style="color:var(--ink-3)">n/a</span>` : `${Math.round(o.H)}<sup>°</sup>`;
        const mc = maxChroma(o.L, leafHue);
        const gam = document.getElementById('sp-gamut');
        gam.className = target ? 'pill warn' : 'pill ok'; gam.textContent = target ? t('outSrgb') : t('inSrgb');
        document.getElementById('sp-maxc').textContent = t('maxC', { c: mc.toFixed(3), p: mc > 0 ? Math.round(o.C / mc * 100) : 0 });
        document.getElementById('leaf-h').textContent = `H ${Math.round(leafHue)}°`;
        drawLeaf(o);
    }
    // Corte a tono constante en OKLCH: eje x = croma, eje y = L.
    // Lo oscuro es la región que existe en OKLCH pero no entra en sRGB.
    const LEAF_CMAX = 0.40;
    // Croma máximo en OKLCH que entra en un espacio dado (para los contornos de la hoja)
    function maxChromaIn(sp, L, Hdeg) {
        const H = rad(Hdeg);
        let lo = 0, hi = 0.5;
        for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; Gamut.status(sp, okToXyz(L, m, H)) === 'in' ? lo = m : hi = m; }
        return lo;
    }
    function drawLeaf(o) {
        const cv = document.getElementById('leaf');
        const w = cv.clientWidth, h = cv.clientHeight;
        if (!w) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const W = Math.round(w * dpr), Hh = Math.round(h * dpr);
        const key = [W, Hh, leafHue.toFixed(1), Gamut.visibleSpaces().map(sp => sp.id).join()].join('|');
        const ctx = cv.getContext('2d');
        if (key !== lastLeafKey) {
            lastLeafKey = key;
            cv.width = W; cv.height = Hh;
            const img = ctx.createImageData(W, Hh), d = img.data, Hr = rad(leafHue);
            const ca = Math.cos(Hr), sa = Math.sin(Hr);
            for (let py = 0; py < Hh; py++) {
                const L = 1 - py / (Hh - 1);
                for (let px = 0; px < W; px++) {
                    const C = px / (W - 1) * LEAF_CMAX, i = (py * W + px) * 4;
                    const lin = ok2lin([L, C * ca, C * sa]);
                    if (inGamut(lin)) {
                        d[i] = clamp01(toGam(clamp01(lin[0]))) * 255; d[i + 1] = clamp01(toGam(clamp01(lin[1]))) * 255; d[i + 2] = clamp01(toGam(clamp01(lin[2]))) * 255;
                    } else {
                        const stripe = ((px + py) >> 3) & 1;
                        d[i] = d[i + 1] = d[i + 2] = stripe ? 22 : 17;
                    }
                    d[i + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            // Contornos de espacios amplios visibles (P3, Rec.2020, etc.)
            Gamut.visibleSpaces().filter(sp => sp.id !== 'srgb').forEach(sp => {
                ctx.beginPath();
                for (let k = 0; k <= 48; k++) {
                    const L = k / 48, c = maxChromaIn(sp, L, leafHue);
                    const x = Math.min(c, LEAF_CMAX) / LEAF_CMAX * W, y = (1 - L) * Hh;
                    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                }
                ctx.setLineDash([4 * dpr, 3 * dpr]); ctx.lineWidth = 1.4 * dpr; ctx.strokeStyle = sp.color; ctx.stroke(); ctx.setLineDash([]);
            });
            cv._base = ctx.getImageData(0, 0, W, Hh);
        } else if (cv._base) ctx.putImageData(cv._base, 0, 0);
        if (target) {
            const od = okOfXYZ(xyzOfHex(currentHex()));
            const xd = od.C / LEAF_CMAX * W, yd = (1 - od.L) * Hh;
            ctx.beginPath(); ctx.moveTo(xd, yd); ctx.lineTo(Math.min(o.C / LEAF_CMAX, 1) * W, (1 - o.L) * Hh);
            ctx.lineWidth = 1.5 * dpr; ctx.strokeStyle = '#ff5a1f'; ctx.stroke();
            ctx.beginPath(); ctx.arc(xd, yd, 4 * dpr, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
        }
        const x = Math.min(o.C / LEAF_CMAX, 1) * W, y = (1 - o.L) * Hh;
        ctx.beginPath(); ctx.arc(x, y, 7 * dpr, 0, Math.PI * 2);
        ctx.lineWidth = 2.5 * dpr; ctx.strokeStyle = target ? '#ff5a1f' : '#fff'; ctx.stroke();
        ctx.lineWidth = 1 * dpr; ctx.strokeStyle = '#000'; ctx.stroke();
    }
    (() => {
        const cv = document.getElementById('leaf');
        let dragging = false;
        const pickAt = e => {
            const r = cv.getBoundingClientRect();
            const C = clamp01((e.clientX - r.left) / r.width) * LEAF_CMAX, L = clamp01(1 - (e.clientY - r.top) / r.height);
            // Permite pedir colores fuera de sRGB hasta el límite de Rec.2020
            const r2020 = Gamut.all().find(sp => sp.id === 'rec2020');
            const c = Math.min(C, maxChromaIn(r2020, L, leafHue));
            applyXYZ(okToXyz(L, c, rad(leafHue)), 'leaf');
        };
        cv.addEventListener('pointerdown', e => { dragging = true; cv.setPointerCapture(e.pointerId); commitPrev(); pickAt(e); });
        cv.addEventListener('pointermove', e => { if (dragging) pickAt(e); });
        cv.addEventListener('pointerup', () => { if (dragging) { dragging = false; pushHistory(); } });
    })();

    // ---------- Cards colapsables ----------
    document.querySelectorAll('[data-collapse]').forEach(btn => btn.addEventListener('click', () => {
        const card = document.getElementById(btn.dataset.collapse);
        card.classList.toggle('collapsed');
        if (!card.classList.contains('collapsed')) render('wheel');
    }));
    function updateSubtitles() {
        document.getElementById('sub-picker').textContent = t('h_' + harmony) + ' · ' + (wheelModel === 'rgb' ? 'RGB' : 'RYB');
        document.getElementById('sub-mixer').textContent = t('m_' + mixModel);
    }

    window.__space = Space3D;

    // ------------------------------------------------------------
    // Render central
    // ------------------------------------------------------------
    const hexInput = document.getElementById('hex-input');

    function render(source) {
        const hex = currentHex();
        const c = chroma(hex);

        curEl.style.background = hex;
        prevEl.style.background = prevHex;
        if (source !== 'hex') hexInput.value = hex.toUpperCase();

        const [r, g, b] = c.rgb();
        if (source !== 'rgb') write('rgb', { r, g, b });
        if (source !== 'hsb') write('hsb', { h: state.h, s: state.s, v: state.v });
        if (source !== 'hsl') {
            const hsl = c.hsl();
            write('hsl', { h: state.h, s: (isNaN(hsl[1]) ? 0 : hsl[1]) * 100, l: hsl[2] * 100 });
        }
        const labT = target ? xyzToLab(target) : null;
        if (source !== 'lch') {
            if (labT) write('lch', { l: labT[0], c: Math.hypot(labT[1], labT[2]), h: mod360(Math.atan2(labT[2], labT[1]) * 180 / Math.PI) });
            else {
                const [L, Cc, H] = c.lch();
                write('lch', { l: L, c: isNaN(Cc) ? 0 : Cc, h: isNaN(H) ? read('lch').h : H });
            }
        }
        if (source !== 'lab') {
            if (labT) write('lab', { l: labT[0], a: labT[1], b: labT[2] });
            else { const [L, A, B] = c.lab(); write('lab', { l: L, a: A, b: B }); }
        }
        clipped.lch = clipped.lab = !!target;
        if (source !== 'cmyk') {
            const [cc, m, y, k] = c.cmyk().map(x => (isNaN(x) ? 0 : x) * 100);
            write('cmyk', { c: cc, m, y, k });
        }
        ['lch', 'lab'].forEach(m => {
            let txt = '';
            if (clipped[m]) {
                const fits = Gamut.fitsList(target);
                txt = t('outMapped') + ' · ' + (fits.length ? t('fitsIn', { list: fits.join(', ') }) : t('fitsNone'));
            }
            document.querySelector(`#panel-${m} .warn`).textContent = txt;
        });
        document.querySelector('#panel-cmyk .note').textContent = t('cmykNote');

        updateGradients();
        drawInner();
        placeHandles();
        renderSwatches();
        renderContrast(hex);
        renderMixer();
    }

    // ------------------------------------------------------------
    // HEX, copiar, armonía
    // ------------------------------------------------------------
    const HEX_RE = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
    hexInput.addEventListener('focus', commitPrev);
    hexInput.addEventListener('input', e => {
        let val = e.target.value.trim();
        if (!val.startsWith('#')) val = '#' + val;
        if (HEX_RE.test(val)) setFromColor(chroma(val), 'hex');
    });
    hexInput.addEventListener('blur', () => { hexInput.value = currentHex().toUpperCase(); pushHistory(); });

    document.getElementById('harmony-select').addEventListener('change', e => {
        harmony = e.target.value;
        render('wheel');
    });

    const toast = document.getElementById('toast');
    let toastT;
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastT);
        toastT = setTimeout(() => toast.classList.remove('show'), 1400);
    }
    function copyText(text, msg) {
        const done = () => showToast(msg || t('copied', { x: text }));
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else fallbackCopy(text, done);
    }
    function fallbackCopy(text, done) {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        ta.remove(); done();
    }
    document.getElementById('copy-hex').addEventListener('click', () => copyText(currentHex().toUpperCase()));
    document.getElementById('copy-palette').addEventListener('click', () => {
        const css = paletteHexes().map((hx, i) => `--${harmony}-${i + 1}: ${hx.toUpperCase()};`).join('\n');
        copyText(css, t('paletteCopied'));
    });

    // ------------------------------------------------------------
    // Pestañas y pineado
    // ------------------------------------------------------------
    let activeMode = 'hsb';
    const pinnedModes = new Set();
    function handleTabClick(event, mode) {
        if (event.ctrlKey || event.shiftKey || event.metaKey) {
            pinnedModes.has(mode) ? pinnedModes.delete(mode) : pinnedModes.add(mode);
        } else {
            activeMode = mode;
        }
        renderTabs();
    }
    function renderTabs() {
        let lastVisible = null;
        Object.keys(MODES).forEach(m => {
            const tab = document.getElementById('tab-' + m);
            const panel = document.getElementById('panel-' + m);
            const visible = m === activeMode || pinnedModes.has(m);
            tab.classList.toggle('active', m === activeMode);
            tab.classList.toggle('pinned', pinnedModes.has(m));
            panel.classList.toggle('visible', visible);
            panel.classList.remove('last-visible');
            if (visible) lastVisible = panel;
        });
        if (lastVisible) lastVisible.classList.add('last-visible');
    }

    // ------------------------------------------------------------
    // Init
    // ------------------------------------------------------------
    applyI18n();
    renderModelSelect();
    drawRing();
    setFromColor(chroma('#3B82F6'), 'init');
    if (!history.length) pushHistory();
    renderTabs();
    </script>
</body>
</html>
