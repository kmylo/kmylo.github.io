<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChromaBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Theme inherited from color-picker-wheel: black folder-tab cards on neutral mid grey, pills,
   accents as information: green = light and tone, yellow = color, blue = masks, pink = presets, orange = warning.
   Layout: photo + icon bar + side dock on top, bottom dock below, floating panels above everything. */
:root{
  color-scheme:dark;
  --bg:#000; --card:#121214; --card-2:#1b1b1e; --card-3:#252529; --line:#2e2e33;
  --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#6b6b75;
  --green:#3dff6e; --yellow:#e4ff3a; --pink:#ff2e63; --orange:#ff5a1f; --blue:#4cc9ff;
  --r:28px; --display:'Barlow Condensed','Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:#000;
  --dot-gap:30px; --dot-color:rgba(255,255,255,.14); --dot-size:1px;
  background-image:radial-gradient(var(--dot-color) var(--dot-size),transparent var(--dot-size));
  background-size:var(--dot-gap) var(--dot-gap);
  color:var(--ink); font:13px/1.55 var(--mono); padding:0 16px 48px; min-height:100vh
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent,var(--green));outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* layout */
.app{position:relative;height:100%;display:flex;flex-direction:column;--f:.667;--bh:260px;
  padding:20px 0 0}
.work{flex:1;min-height:0;display:flex}
.app[data-side=left] .work{flex-direction:row-reverse}
.dock{scrollbar-width:thin;scrollbar-color:#2a2a2e transparent;border-radius:18px}
.dock.side{flex:calc(1 - var(--f)) 1 0;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:0 4px 20px 0}
.dock.bottom{flex:none;max-height:var(--bh);display:flex;gap:22px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.dock.bottom .card{width:340px}
.dock.bottom .card.wide{flex:1 1 380px;min-width:300px;width:auto}
.dock.bottom .card-body{max-height:calc(var(--bh) - 84px);overflow-y:auto;scrollbar-width:thin}
.dock.bottom .plist{flex-direction:row;flex-wrap:wrap}
.dock.bottom .prow{width:204px}
.split{flex:none;position:relative;touch-action:none}
.split::after{content:'';position:absolute;border-radius:4px;background:var(--ink-2);opacity:.35;transition:opacity .15s}
.split:hover::after,.split:active::after{opacity:.95}
.split.v{width:18px;cursor:col-resize}
.split.v::after{left:7px;top:calc(50% - 22px);width:4px;height:44px}
.split.h{height:22px;cursor:row-resize}
.split.h::after{top:9px;left:calc(50% - 22px);height:4px;width:44px}
.app.noside .dock.side,.app.noside .split.v,.app.nobottom .dock.bottom,.app.nobottom .split.h{display:none}
/* the side column and the bottom strip can be collapsed from the button on their divider */
.split-tog{position:absolute;border:0;border-radius:999px;background:var(--card);color:var(--ink-2);cursor:pointer;padding:0;font:600 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;z-index:2}
.split-tog:hover,.split-tog:focus-visible{color:#0a0a0b;background:var(--green);outline:none}
.split.v .split-tog{left:0;top:calc(50% - 66px);width:18px;height:34px}
.split.h .split-tog{top:2px;left:calc(50% - 66px);width:34px;height:18px}
@media (min-width:921px){
  .app.cside:not(.dragging) .dock.side,.app.cbottom:not(.dragging) .dock.bottom{display:none}
  .app.cside:not(.dragging) .card.photo{flex:1 1 0}
  .app.cside .split.v,.app.cbottom .split.h{cursor:default}
  .app.cside .split.v::after,.app.cbottom .split.h::after{display:none}
  .app.cside .split.v .split-tog{top:calc(50% - 17px)}
  .app.cbottom .split.h .split-tog{left:calc(50% - 17px)}
}
/* drop targets while a panel is being dragged */
.app.dragging .dock,.app.dragging .bar{outline:2px dashed rgba(255,255,255,.3);outline-offset:-2px}
.app.dragging.noside .dock.side{display:flex;flex:0 0 150px}
.app.dragging.nobottom .dock.bottom{display:flex;min-height:84px}
.app[data-drop=side] .dock.side,.app[data-drop=bottom] .dock.bottom,.app[data-drop=bar] .bar{outline-color:var(--green);background:rgba(61,255,110,.1)}

/* icon bar: every panel has a button; panels sent to the bar open as a flyout */
.bar{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 10px;margin-right:12px;border-radius:18px;overflow-y:auto;scrollbar-width:none}
.app[data-side=left] .bar{margin:0 0 0 12px}
.round-btn{--accent:var(--green);width:36px;height:36px;border-radius:50%;border:none;background:var(--card);color:var(--ink-2);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.round-btn.color{--accent:var(--yellow)}.round-btn.pre{--accent:var(--pink)}.round-btn.mask{--accent:var(--blue)}
.round-btn:hover{color:var(--accent)}
.round-btn.inbar::after{content:'';position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.round-btn.open{background:var(--accent);color:#0a0a0b}
.round-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.floats{position:absolute;inset:0;pointer-events:none;z-index:15}
.floats .card{position:absolute;width:340px;pointer-events:none}
.floats .card-tab,.floats .card-menu,.floats .card-body{pointer-events:auto}
.flyout{position:absolute;z-index:20;width:340px}
.floats .card-body,.flyout .card-body{max-height:min(66vh,580px);overflow-y:auto;scrollbar-width:thin;box-shadow:0 22px 44px rgba(0,0,0,.5)}
.floats .card-menu,.flyout .card-menu{background:var(--card);border-radius:999px;padding:9px 10px;margin:0 0 8px 6px}
.floats .card-menu i,.flyout .card-menu i{background:var(--ink-2)}
.card.drag{opacity:.9}
.card.flash .card-tab .dot{animation:fl .9s ease}
@keyframes fl{50%{transform:scale(2.2)}}

.card{position:relative;--accent:var(--green);min-width:0;flex:none}
.card.color{--accent:var(--yellow)}
.card.pre{--accent:var(--pink)}
.card.mask{--accent:var(--blue)}
.card-head{display:flex;align-items:flex-end;justify-content:space-between}
.card-tab{position:relative;display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:14px 22px 6px 18px;min-width:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.photo .card-tab{cursor:default}
.card-tab::after{content:'';position:absolute;right:-28px;bottom:0;width:28px;height:28px;background:radial-gradient(circle at 100% 0,transparent 27.5px,var(--card) 28px);pointer-events:none}
.card-tab .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex:none}
.card-tab h2{font-family:'Inter',system-ui,sans-serif;font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.1;white-space:nowrap}
.card-tab small{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phSub{max-width:min(46vw,420px)}
.card-menu{display:flex;gap:4px;padding:8px 10px 14px 6px;background:none;border:none;cursor:pointer}
.card-menu i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);display:block;transition:background .15s}
.card-menu:hover i{background:var(--accent)}
.card-body{background:var(--card);border-radius:0 var(--r) var(--r) var(--r);padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px}
.card.collapsed .card-body{display:none}
.card.collapsed .card-tab{border-radius:var(--r);padding-bottom:14px}
.card.collapsed .card-tab::after{display:none}
.menu{position:fixed;z-index:60;min-width:190px;background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 16px 34px rgba(0,0,0,.55)}
.menu button,.menu label{text-align:left;background:none;border:0;color:var(--ink-2);padding:8px 11px;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer}
.menu button:hover,.menu button:focus-visible,.menu label:hover,.menu label:focus-visible{background:var(--card-3);color:var(--ink)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* photo: the toolbar lives inside the canvas area, above the image */
.card.photo{flex:var(--f) 1 0;display:flex;flex-direction:column;min-height:0}
.app.noside .card.photo{flex:1 1 0}
.card.photo .card-body{flex:1;min-height:0;padding:10px}
.view{position:relative;flex:1;min-height:200px;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#18181b 0%,#0d0d0f 70%)}
.toolbar{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .pill-group{flex:none;flex-wrap:nowrap;background:rgba(28,28,32,.9)}
.fit{position:absolute;inset:58px 10px 10px}
#gl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#ovc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ovc.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.empty{position:absolute;inset:58px 10px 10px;display:grid;place-content:center;justify-items:center;text-align:center;gap:8px;padding:16px;cursor:pointer;border:1.5px dashed #34343c;border-radius:14px;color:var(--ink-3)}
.empty:hover{border-color:var(--green);color:var(--ink-2)}
.empty b{font-family:var(--display);font-weight:300;font-size:40px;line-height:1;color:var(--ink)}
.view.over::after{content:attr(data-drop);position:absolute;inset:10px;border:2px dashed var(--green);border-radius:16px;display:grid;place-items:center;background:rgba(10,10,11,.86);font-size:14px;z-index:4}
.view.busy::before{content:'';position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;border:3px solid #2a2a30;border-top-color:var(--green);animation:sp .7s linear infinite;z-index:5}
@keyframes sp{to{transform:rotate(360deg)}}
#badge{position:absolute;top:66px;left:18px;z-index:2}
.pop{position:absolute;top:56px;right:10px;z-index:8;width:min(310px,calc(100% - 20px));background:var(--card-2);border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 30px rgba(0,0,0,.5)}

/* pills */
.pill-group{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--card-2);border-radius:999px;padding:3px}
.pop .pill-group{background:var(--card-3);align-self:flex-start}
.pill-btn{border:none;background:none;color:var(--ink-2);font-size:11px;font-weight:600;cursor:pointer;border-radius:999px;padding:5px 12px;white-space:nowrap;display:inline-block}
.pill-btn:hover{color:var(--ink)}
.pill-btn:disabled{opacity:.35;cursor:default}
.pill-btn.active{background:var(--accent);color:#0a0a0b}
.mx-btn{border-radius:999px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-block}
.mx-btn:hover{color:var(--accent)}
.mx-btn:disabled{opacity:.35;cursor:default;color:var(--ink-2)}
.mx-btn.warn:not(:disabled):hover{color:var(--orange)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600}
.pill.warn{background:var(--orange);color:#2a0d00}
.mx-head{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.mx-head:first-child{margin-top:0}
.sp-small{font-size:10.5px;color:var(--ink-3);margin:0;line-height:1.45}
.rowx{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rowx.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.stack:empty{display:none}

/* sliders */
.slider-row{display:grid;grid-template-columns:92px minmax(0,1fr) 46px;align-items:center;gap:8px}
.slider-row label{color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider-wrapper{position:relative;height:12px;border-radius:999px;background:var(--track,var(--card-3));box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.slider-wrapper.bi:not(.tr){background:linear-gradient(90deg,var(--card-3) calc(50% - 1px),var(--ink-3) 0,var(--ink-3) calc(50% + 1px),var(--card-3) 0)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:100%;background:transparent;position:absolute;top:0;left:0;margin:0;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:transparent}
input[type=range]::-moz-range-track{height:12px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:18px;width:18px;border-radius:50%;border:2.5px solid #fff;background:rgba(10,10,11,.45);margin-top:-3px;box-shadow:0 1px 4px rgba(0,0,0,.7)}
input[type=range]::-moz-range-thumb{height:14px;width:14px;border-radius:50%;border:2.5px solid #fff;background:rgba(10,10,11,.45)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number],.num{-moz-appearance:textfield;appearance:textfield;background:var(--card-2);border:1px solid var(--line);border-radius:8px;font-family:var(--display);font-size:15px;color:var(--ink);width:100%;text-align:right;padding:1px 6px}
input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}

/* histogram and curve */
#hist{width:100%;height:92px;display:block;background:var(--card-2);border-radius:18px}
#curve{width:100%;aspect-ratio:1/1;display:block;background:var(--card-2);border-radius:18px;touch-action:none;cursor:crosshair}
.big-num{font-family:var(--display);font-weight:300;font-size:34px;line-height:.95}
.big-num sup{font-size:.38em;vertical-align:top;margin-right:4px;color:var(--ink-2);font-weight:400;letter-spacing:.06em}
.node{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;background:var(--card-2);border-radius:18px;padding:10px 12px 8px}
.node .vals{display:flex;gap:14px}
.sw{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);flex:none}

/* small shared pieces */
.mx-btn.on{color:#0a0a0b;background:var(--accent);border-color:var(--accent)}
.pillin{background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;width:100%}
.pgroup{display:flex;flex-direction:column;gap:4px}
.ghead{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gname{background:none;border:0;color:var(--ink);font-weight:600;font-size:11px;cursor:pointer;padding:3px 4px}
.tag{border:0;border-radius:999px;background:var(--card-3);color:var(--ink-2);font-size:10px;padding:2px 8px;cursor:pointer}
.tag:hover{color:var(--accent)}
.tagin{width:84px;background:var(--card-2);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;font-size:10px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0}
.chain .nd{border:1px solid var(--accent);background:var(--card-2);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer}
.chain .nd.off{border-color:var(--line);color:var(--ink-3);text-decoration:line-through}
.chain .io{color:var(--ink-3);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.chain .wire{width:14px;height:2px;background:var(--ink-3);flex:none}
.gwrap{position:relative;margin:0 9px;padding-bottom:24px;touch-action:none;cursor:copy}
.gbar{height:22px;border-radius:8px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.gstops{position:absolute;left:0;right:0;top:24px;height:20px}
.gstop{position:absolute;top:1px;width:18px;height:18px;margin-left:-9px;padding:0;border-radius:6px;border:2px solid var(--ink-3);cursor:grab}
.gstop::before{content:'';position:absolute;left:50%;top:-7px;margin-left:-4px;border:4px solid transparent;border-bottom-color:var(--ink-3)}
.gstop.sel{border-color:#fff}
.gstop.sel::before{border-bottom-color:#fff}
#nIn,#nOut{width:62px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;text-align:left;font-family:var(--display);font-weight:300;font-size:32px;line-height:1;color:var(--ink)}
#nIn:disabled,#nOut:disabled{color:var(--ink-3);border-bottom-color:transparent}
#nIn:focus,#nOut:focus{border-bottom-color:var(--accent)}
#curveBox.ov #nIn,#curveBox.ov #nOut{font-size:22px;width:48px}
.cstop{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2)}
input[type=color]{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer}
.gq{width:44px;height:18px;border-radius:999px;border:1px solid var(--line);cursor:pointer;padding:0}
/* curve drawn over the photo */
#curveHost{position:absolute;inset:58px 10px 10px;z-index:4;display:flex}
#curveBox.ov{position:relative;flex:1;min-height:0;min-width:0;background:none;border-radius:14px}
#curveBox.ov #curve{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;background:transparent}
#curveBox.ov>.rowx{position:absolute;top:6px;left:6px;right:6px;z-index:2;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#curveBox.ov .pill-group{flex:none;flex-wrap:nowrap;background:rgba(27,27,30,.9)}
#curveBox.ov .node{position:absolute;left:6px;right:6px;bottom:6px;z-index:2;padding:4px 10px;background:rgba(27,27,30,.85)}
#curveBox.ov .big-num{font-size:22px}
#popCmp{right:auto;left:10px}

/* presets and mask rows */
.save{display:flex;gap:6px}
.save input{flex:1;min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px}
/* iOS zooms the page when a focused field has text under 16px */
@media (pointer:coarse){input[type=text],input[type=number]:not(#nIn):not(#nOut),input[type=search],select,textarea{font-size:16px!important}.save input,.pillin{padding:8px 14px}}
.plist{display:flex;flex-direction:column;gap:4px}
.plist:empty{display:none}
.prow{display:flex;align-items:center;gap:2px;border-radius:16px}
.prow.act{background:var(--card-2)}
.mgroup{border:1px solid var(--line);border-radius:18px;padding:2px;margin:3px 0}
.mgroup .ghead .go span{font-weight:600;color:var(--ink)}
.mgroup .prow:not(.ghead){margin-left:10px}
.prow .go{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px;cursor:pointer;text-align:left;border-radius:16px;color:var(--ink-2);font-weight:500}
.prow .go:hover,.prow.act .go{color:var(--ink)}
.prow .go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .go small{color:var(--ink-3);font-weight:400;margin-left:auto;padding-right:4px;flex:none}
.prow.act .go::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none;margin-left:auto;margin-right:4px}
.prow.act .go small~*,.prow.act .go small+*{margin-left:0}
.prow.act .go:has(small)::after{margin-left:0}
.prow canvas{width:48px;height:34px;object-fit:cover;border-radius:10px;flex:none;background:var(--card-3)}
.prow .ic{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:4px 5px;border-radius:999px;font-size:12px;flex:none}
.prow .ic:hover{color:var(--accent)}
.prow .ic.warn{color:var(--orange);font-weight:600;font-size:11px}
.prow input{flex:1;min-width:0;background:var(--card-2);border:1px solid var(--accent);border-radius:999px;padding:5px 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);border-radius:999px;background:var(--card);border:1px solid var(--line);padding:8px 14px;font-size:12px;z-index:70;max-width:90vw}
#toast::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:1px}

/* narrow screens: one column; photo and icon bar stay pinned, the photo box takes the image's proportion */
@media (max-width:920px){
  html,body{height:auto}
  .app{height:auto;display:block;padding-top:0;padding-bottom:28px;--ph:0px}
  .work{display:contents}
  .split{display:none}
  .card.photo{position:sticky;top:0;z-index:12;background:var(--bg);padding-top:max(10px,env(safe-area-inset-top,0px))}
  .view{flex:none;min-height:0;height:min(52vh,calc((100vw - 72px) / var(--ar,1.6) + 68px))}
  .view.tall{height:60vh}
  .bar{position:sticky;top:var(--ph);z-index:11;width:auto;flex-direction:row;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;margin:0;padding:8px 2px;background:var(--bg);border-radius:0}
  .app[data-side] .bar{margin:0}
  .dock.side,.dock.bottom,.floats,.flyout{position:static;width:auto;display:flex;flex-direction:column;align-items:stretch;gap:20px;overflow:visible;max-height:none;padding:0;margin-top:20px;pointer-events:auto}
  .dock.side{margin-top:6px}
  .floats:empty,.flyout:empty{display:none}
  .card{scroll-margin-top:calc(var(--ph) + 64px)}
  .floats .card{position:static;width:auto;pointer-events:auto}
  .dock.bottom .card,.dock.bottom .card.wide{width:auto;min-width:0;flex:none}
  .card-body,.dock.bottom .card-body,.floats .card-body,.flyout .card-body{max-height:none;overflow:visible;box-shadow:none}
  .dock.bottom .plist{flex-direction:column}
  .dock.bottom .prow{width:auto}
  .floats .card-menu,.flyout .card-menu{background:none;padding:8px 10px 14px 6px;margin:0}
  .floats .card-menu i,.flyout .card-menu i{background:var(--ink-3)}
  .pop .desk{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<input type="file" id="fImg" class="vh" accept=".jpg,.jpeg,.png,.webp,.avif,.heic,.heif,.gif,.bmp,.tif,.tiff" tabindex="-1">
<input type="file" id="fJson" class="vh" accept=".json,application/json" tabindex="-1">
<input type="file" id="fCurve" class="vh" accept=".json,.csv,.txt,.xmp,application/json,text/csv" tabindex="-1">
<main class="app" id="app">
  <div class="work" id="work">
    <section class="card photo">
      <header class="card-head"><div class="card-tab"><span class="dot"></span><div><h2>ChromaBox</h2><small id="phSub"></small></div></div></header>
      <div class="card-body">
        <div class="view" id="view">
          <div class="toolbar">
            <div class="pill-group"><label class="pill-btn active" for="fImg" id="bOpen" tabindex="0" role="button" data-i18n="open"></label></div>
            <div class="pill-group">
              <button class="pill-btn" id="bCmp" data-i18n="before" data-i18n-title="beforeTip"></button>
              <button class="pill-btn" id="bCmpOpt" aria-expanded="false" data-i18n-title="compare">◐</button>
              <button class="pill-btn" id="bUndo" data-i18n="undo" title="Ctrl+Z"></button>
              <button class="pill-btn" id="bRedo" data-i18n="redo" title="Ctrl+Shift+Z"></button>
              <button class="pill-btn" id="bReset" data-i18n="reset" data-i18n-title="resetTip"></button>
            </div>
            <div class="pill-group" id="fmtSeg">
              <button class="pill-btn active" data-fmt="image/jpeg" aria-pressed="true">JPG</button>
              <button class="pill-btn" data-fmt="image/png" aria-pressed="false">PNG</button>
              <button class="pill-btn" id="bExport" style="color:var(--ink)" data-i18n="export"></button>
            </div>
            <div class="pill-group" style="margin-left:auto" id="langSeg">
              <button class="pill-btn" data-lang="en" aria-pressed="false" title="English">EN</button>
              <button class="pill-btn" data-lang="es" aria-pressed="false" title="Español">ES</button>
            </div>
            <div class="pill-group"><button class="pill-btn" id="bLayout" aria-expanded="false" data-i18n="layout"></button></div>
          </div>
          <div class="fit"><canvas id="gl" hidden></canvas><canvas id="ovc"></canvas></div>
          <label class="empty" id="empty" for="fImg"><b data-i18n="emptyTitle"></b><span data-i18n="emptySub"></span></label>
          <span class="pill warn" id="badge" hidden>ORIGINAL</span>
          <div id="curveHost" hidden></div>
          <div class="pop" id="popCmp" hidden>
            <div class="mx-head"><span data-i18n="compare"></span></div>
            <div class="pill-group" id="cmpSeg">
              <button class="pill-btn" data-c="hold" aria-pressed="false" data-i18n="hold"></button>
              <button class="pill-btn" data-c="toggle" aria-pressed="false" data-i18n="toggle"></button>
              <button class="pill-btn" data-c="split" aria-pressed="false" data-i18n="split"></button>
            </div>
            <div class="mx-head"><span data-i18n="splitDir"></span></div>
            <div class="pill-group" id="dirSeg">
              <button class="pill-btn" data-d="v" aria-pressed="false" data-i18n="dirV"></button>
              <button class="pill-btn" data-d="h" aria-pressed="false" data-i18n="dirH"></button>
              <button class="pill-btn" data-d="d" aria-pressed="false" data-i18n="dirD"></button>
            </div>
            <div class="slider-row"><label for="splitPos" data-i18n="position"></label><div class="slider-wrapper"><input type="range" id="splitPos" min="3" max="97" value="50"></div><span></span></div>
            <p class="sp-small" data-i18n="cmpHint"></p>
          </div>
          <div class="pop" id="pop" hidden>
            <div class="mx-head desk"><span data-i18n="photoWidth"></span></div>
            <div class="pill-group desk" id="fSeg">
              <button class="pill-btn" data-f="0.5" aria-pressed="false">1/2</button>
              <button class="pill-btn" data-f="0.667" aria-pressed="false">2/3</button>
              <button class="pill-btn" data-f="0.75" aria-pressed="false">3/4</button>
              <button class="pill-btn" data-f="0.85" aria-pressed="false" data-i18n="max"></button>
            </div>
            <div class="mx-head desk"><span data-i18n="sideCol"></span></div>
            <div class="pill-group desk" id="sideSeg">
              <button class="pill-btn" data-side="right" aria-pressed="false" data-i18n="right"></button>
              <button class="pill-btn" data-side="left" aria-pressed="false" data-i18n="left"></button>
            </div>
            <div class="mx-head"><span data-i18n="prevQ"></span></div>
            <div class="pill-group" id="qSeg">
              <button class="pill-btn" data-q="auto" aria-pressed="false">Auto</button>
              <button class="pill-btn" data-q="2048" aria-pressed="false" data-i18n="qHigh"></button>
              <button class="pill-btn" data-q="1280" aria-pressed="false" data-i18n="qMed"></button>
              <button class="pill-btn" data-q="800" aria-pressed="false" data-i18n="qLow"></button>
            </div>
            <p class="sp-small" id="qInfo"></p>
            <p class="sp-small" data-i18n="layoutHint"></p>
            <div><button class="mx-btn" id="bLayoutReset" data-i18n="resetLayout"></button></div>
          </div>
        </div>
      </div>
    </section>
    <div class="split v" id="splitV"><button class="split-tog" id="togSide" type="button"></button></div>
    <nav class="bar" id="bar" aria-label="Panels"></nav>
    <div class="dock side" id="dockSide">
      <section class="card" data-id="hist"><div class="card-body"><canvas id="hist"></canvas></div></section>
      <section class="card" data-id="basic"><div class="card-body" id="pBasic"></div></section>
      <section class="card mask" data-id="masks"><div class="card-body">
        <div class="mx-head"><span data-i18n="newMask"></span></div>
        <div class="rowx" id="maskAdd">
          <button class="mx-btn" data-add="linear">+ <span data-i18n="t_linear"></span></button>
          <button class="mx-btn" data-add="radial">+ <span data-i18n="t_radial"></span></button>
          <button class="mx-btn" data-add="brush">+ <span data-i18n="t_brush"></span></button>
          <button class="mx-btn" data-add="lum">+ <span data-i18n="t_lum"></span></button>
          <button class="mx-btn" data-add="color">+ <span data-i18n="t_color"></span></button>
          <button class="mx-btn" data-add="all">+ <span data-i18n="t_all"></span></button>
        </div>
        <div class="plist" id="maskList"></div>
        <div class="stack" id="maskEd"></div>
      </div></section>
      <section class="card" data-id="curve"><div class="card-body">
        <div class="stack" id="curveBox">
        <div class="rowx sp">
          <div class="pill-group" id="chSeg">
            <button class="pill-btn active" data-ch="rgb" aria-pressed="true">RGB</button>
            <button class="pill-btn" data-ch="r" aria-pressed="false">R</button>
            <button class="pill-btn" data-ch="g" aria-pressed="false">G</button>
            <button class="pill-btn" data-ch="b" aria-pressed="false">B</button>
          </div>
          <span class="rowx"><button class="mx-btn" id="bCurveOv"></button><button class="mx-btn" id="bCurveReset" data-i18n="resetCh"></button></span>
        </div>
        <canvas id="curve" tabindex="0" aria-label="Tone curve"></canvas>
        <div class="node">
          <div class="vals">
            <div class="big-num"><sup data-i18n="in"></sup><input type="number" id="nIn" min="0" max="255" step="1" disabled aria-label="In"></div>
            <div class="big-num"><sup data-i18n="out"></sup><input type="number" id="nOut" min="0" max="255" step="1" disabled aria-label="Out"></div>
          </div>
          <button class="mx-btn warn" id="bNodeDel" disabled data-i18n="removePt"></button>
        </div>
        </div>
        <p class="sp-small" data-i18n="curveHint"></p>
      </div></section>
      <section class="card color" data-id="mix"><div class="card-body">
        <div><div class="pill-group" id="mixSeg">
          <button class="pill-btn active" data-m="hue" aria-pressed="true" data-i18n="hue"></button>
          <button class="pill-btn" data-m="sat" aria-pressed="false" data-i18n="saturation"></button>
          <button class="pill-btn" data-m="lum" aria-pressed="false" data-i18n="luminance"></button>
        </div> <button class="mx-btn" id="bTat" aria-pressed="false" data-i18n="pick" data-i18n-title="pickTip"></button></div>
        <div class="stack" id="pMix"></div>
      </div></section>
      <section class="card color" data-id="chmix"><div class="card-body">
        <div class="rowx sp"><span class="mx-head" style="margin:0"><span data-i18n="output"></span></span>
          <div class="pill-group" id="cmSeg">
            <button class="pill-btn active" data-o="r" aria-pressed="true" data-i18n="red"></button>
            <button class="pill-btn" data-o="g" aria-pressed="false" data-i18n="green"></button>
            <button class="pill-btn" data-o="b" aria-pressed="false" data-i18n="blue"></button>
          </div></div>
        <div class="stack" id="pCm"></div>
        <p class="sp-small" data-i18n="cmHint"></p>
      </div></section>
      <section class="card color" data-id="grade"><div class="card-body" id="pGrade"></div></section>
      <section class="card color" data-id="gmap"><div class="card-body">
        <div class="gwrap" id="gmWrap"><div class="gbar" id="gmBar"></div><div class="gstops" id="gmStops"></div></div>
        <div class="rowx">

          <button class="mx-btn" id="gmRev" data-i18n="reverse"></button>

        <div class="rowx" id="gmQuick"></div>
        <div class="stack" id="pGmap"></div>
        <p class="sp-small" data-i18n="gmHint"></p>
      </div></section>
      <section class="card color" data-id="calib"><div class="card-body" id="pCal"></div></section>
      <section class="card" data-id="fx"><div class="card-body" id="pFx"></div></section>
      <section class="card" data-id="crop"><div class="card-body">
        <div class="rowx sp"><button class="mx-btn" id="bCrop"></button><button class="mx-btn" id="bCropReset" data-i18n="cropReset"></button></div>
        <div class="mx-head"><span data-i18n="aspect"></span></div>
        <div><div class="pill-group" id="arSeg">
          <button class="pill-btn" data-ar="" aria-pressed="false" data-i18n="free"></button>
          <button class="pill-btn" data-ar="o" aria-pressed="false" data-i18n="original"></button>
          <button class="pill-btn" data-ar="1" aria-pressed="false">1:1</button>
          <button class="pill-btn" data-ar="1.3333" aria-pressed="false">4:3</button>
          <button class="pill-btn" data-ar="1.5" aria-pressed="false">3:2</button>
          <button class="pill-btn" data-ar="1.7778" aria-pressed="false">16:9</button>
          <button class="pill-btn" data-ar="0.8" aria-pressed="false">4:5</button>
          <button class="pill-btn" data-ar="0.5625" aria-pressed="false">9:16</button>
        </div></div>
        <div class="mx-head"><span data-i18n="exportEdge"></span></div>

        <p class="sp-small" data-i18n="cropHint"></p>
      </div></section>
      <section class="card" data-id="nodes"><div class="card-body">
        <div class="chain" id="nodeChain"></div>
        <p class="sp-small" data-i18n="nodesHint"></p>
      </div></section>
      <section class="card pre" data-id="save"><div class="card-body">
        <form class="save" id="saveForm">
          <input type="text" id="pName" maxlength="40" autocomplete="off" data-i18n-ph="presetName">
          <button class="pill-btn active" type="submit" data-i18n="save"></button>
        </form>
        <input type="text" id="pGroup" class="pillin" list="groupList" maxlength="30" autocomplete="off" data-i18n-ph="groupPh"><datalist id="groupList"></datalist>
        <p class="sp-small" data-i18n="saveHint"></p>
        <div class="rowx">
          <button class="mx-btn" id="bExpJson" data-i18n="expJson"></button>
          <label class="mx-btn" for="fJson" id="bImpJson" tabindex="0" role="button" data-i18n="impJson"></label>
          <button class="mx-btn" id="bXmp" data-i18n="toXmp" data-i18n-title="xmpTip"></button>
        </div>
      </div></section>
      <section class="card pre wide" data-id="mine"><div class="card-body"><p class="sp-small" id="mineEmpty" data-i18n="mineEmpty"></p><div class="rowx" id="tagBar"></div><div class="stack" id="mine"></div></div></section>
      <section class="card pre wide" data-id="factory"><div class="card-body"><div class="plist" id="factory"></div></div></section>
    </div>
  </div>
  <div class="split h" id="splitH"><button class="split-tog" id="togBottom" type="button"></button></div>
  <div class="dock bottom" id="dockBottom"></div>
  <div class="floats" id="floats"></div>
  <div class="flyout" id="flyout"></div>
  <div id="stash" hidden></div>
</main>
<div class="menu" id="menu" hidden role="menu"></div>
<div id="toast" hidden role="status"></div>

const num=(v,d)=>Number.isFinite(+v)?+v:d;
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function normalize(o){
  const d=DEF(); if(!o||typeof o!=='object') return d;
  for(const k of NUMS) d[k]=num(o[k],d[k]);
  d.exposure=clamp(d.exposure,-5,5);
  for(const k of NUMS) if(k!=='exposure') d[k]=clamp(d[k],-100,100);
  d.bw=!!o.bw;
  for(const c of CH){
    const src=o.curves&&o.curves[c];
    if(Array.isArray(src)){
      const pts=src.filter(p=>Array.isArray(p)&&Number.isFinite(+p[0])&&Number.isFinite(+p[1])).map(p=>[clamp(+p[0]),clamp(+p[1])]).sort((a,b)=>a[0]-b[0]);
      const out=[]; for(const p of pts) if(!out.length||p[0]-out[out.length-1][0]>0.004) out.push(p);
      if(out.length>=2) d.curves[c]=out.slice(0,16);
    }
  }
  for(const k of ['hue','sat','lum']){
    const src=o.hsl&&o.hsl[k]; if(src&&typeof src==='object') for(let i=0;i<8;i++) d.hsl[k][i]=clamp(num(src[i],0),-100,100);
  }
  const g=o.grade||{};
  for(const k of ['sh','mid','hi']) if(Array.isArray(g[k])) d.grade[k]=[clamp(num(g[k][0],40),0,360),clamp(num(g[k][1],0),0,100)];
  d.grade.balance=clamp(num(g.balance,0),-100,100);
  d.glow=clamp(d.glow,0,100); d.glowR=clamp(d.glowR,0,100); d.glowT=clamp(d.glowT,0,95);
  if(o.gmap&&typeof o.gmap==='object'){
    d.gmap.amt=clamp(num(o.gmap.amt,0),0,100);
    let st=Array.isArray(o.gmap.stops)?o.gmap.stops:Array.isArray(o.gmap.c)?o.gmap.c.map((h,i,a)=>[i*100/Math.max(1,a.length-1),h]):null;
    if(st){st=st.filter(x=>Array.isArray(x)&&Number.isFinite(+x[0])&&/^#[0-9a-f]{6}$/i.test(x[1])).map(x=>[clamp(+x[0],0,100),x[1].toLowerCase()]).sort((a,b)=>a[0]-b[0]).slice(0,12); if(st.length>=2) d.gmap.stops=st;}
  }
  if(o.cal&&typeof o.cal==='object'){d.cal.sh=clamp(num(o.cal.sh,0),-100,100);for(const k of ['r','g','b']){const src=o.cal[k];if(Array.isArray(src))d.cal[k]=[clamp(num(src[0],0),-100,100),clamp(num(src[1],0),-100,100)];}}
  for(const k of ['r','g','b']){const src=o.cm&&o.cm[k]; if(Array.isArray(src)) for(let i=0;i<4;i++) d.cm[k][i]=clamp(num(src[i],d.cm[k][i]),i<3?-200:-100,i<3?200:100);}
  return d;
}

const pt=(v,d)=>Array.isArray(v)?[clamp(num(v[0],d[0]),-1,2),clamp(num(v[1],d[1]),-1,2)]:d;
function normMasks(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(m=>m&&MTYPES.includes(m.type)).slice(0,16).map(m=>{
    const o={id:String(m.id||uid()),name:String(m.name||m.type).slice(0,30),group:String(m.group||'').trim().slice(0,24),type:m.type,on:m.on!==false,invert:!!m.invert,amt:clamp(num(m.amt,100),0,100),adj:MADJ()};
    for(const k in o.adj) o.adj[k]=k==='exposure'?clamp(num(m.adj&&m.adj[k],0),-4,4):clamp(num(m.adj&&m.adj[k],0),k==='blur'||k==='glow'?0:-100,100);
    o.bt=BTYPES.includes(m.bt)?m.bt:'soft'; o.ba=clamp(num(m.ba,0),0,180); o.bx=clamp(num(m.bx,50),0,100); o.by=clamp(num(m.by,50),0,100); o.bb=clamp(num(m.bb,40),0,100);
    if(m.type==='linear'){o.a=pt(m.a,[.5,.2]);o.b=pt(m.b,[.5,.55]);}
    if(m.type==='radial'){o.c=pt(m.c,[.5,.5]);o.rx=clamp(num(m.rx,.25),.005,3);o.ry=clamp(num(m.ry,.25),.005,3);o.feather=clamp(num(m.feather,50),0,100);}
    if(m.type==='brush'){o.size=clamp(num(m.size,12),1,60);o.hard=clamp(num(m.hard,30),0,95);o.flow=clamp(num(m.flow,60),1,100);
      o.strokes=(Array.isArray(m.strokes)?m.strokes:[]).filter(st=>st&&Array.isArray(st.p)&&st.p.length>=2).map(st=>({s:clamp(num(st.s,12),1,60),h:clamp(num(st.h,30),0,95),o:clamp(num(st.o,60),1,100),e:!!st.e,p:st.p.map(v=>num(v,0))}));}
    if(m.type==='lum'){o.lo=clamp(num(m.lo,60),0,100);o.hi=clamp(num(m.hi,100),0,100);o.soft=clamp(num(m.soft,15),0,100);}
    if(m.type==='color'){o.col=Array.isArray(m.col)?m.col.slice(0,3).map(v=>clamp(num(v,.5))):[.3,.5,.9];while(o.col.length<3)o.col.push(.5);o.tol=clamp(num(m.tol,30),1,100);}

function normLocal(o){ o=o||{}; return {masks:normMasks(o.masks),crop:normCrop(o.crop),off:Object.fromEntries(NODES.filter(k=>o.off&&o.off[k]).map(k=>[k,true])),edge:clamp(Math.round(num(o.edge,0)),0,16384)}; }
function eff(s){   // settings with bypassed nodes replaced by their neutral values
  const o=s.off; if(!o||!Object.keys(o).length) return s; const d=DEF(), e=Object.assign({},s);

function gradAt(st,p){   // color of the ramp at position p (0..100), as [r,g,b] 0..1
  if(p<=st[0][0]) return hex3(st[0][1]);
  for(let i=1;i<st.length;i++) if(p<=st[i][0]){const a=hex3(st[i-1][1]),b=hex3(st[i][1]),u=(p-st[i-1][0])/Math.max(1e-6,st[i][0]-st[i-1][0]);return a.map((v,k)=>v+(b[k]-v)*u);}
  return hex3(st[st.length-1][1]);
}
function gradLUT(st){const px=new Uint8Array(1024);for(let i=0;i<256;i++){const c=gradAt(st,i/255*100);px[i*4]=Math.round(c[0]*255);px[i*4+1]=Math.round(c[1]*255);px[i*4+2]=Math.round(c[2]*255);px[i*4+3]=255;}return px;}

  m[0]=d[0]; m[n-1]=d[n-2];

  for(let i=0;i<n-1;i++){

    const a=m[i]/d[i], b=m[i+1]/d[i], s=a*a+b*b;
    if(s>9){const q=3/Math.sqrt(s); m[i]=q*a*d[i]; m[i+1]=q*b*d[i];}

    if(x<=xs[0]){out[j]=ys[0];continue;}
    if(x>=xs[n-1]){out[j]=ys[n-1];continue;}
    while(k<n-2&&x>xs[k+1]) k++;

    out[j]=clamp((2*u3-3*u2+1)*ys[k]+(u3-2*u2+u)*h*m[k]+(-2*u3+3*u2)*ys[k+1]+(u3-u2)*h*m[k+1]);

}

function lutToPts(xs,ys){   // a sampled curve reduced to at most 16 points
  const n=xs.length; if(n<=16) return xs.map((x,i)=>[x,ys[i]]);
  const out=[]; for(let k=0;k<16;k++){const i=Math.round(k*(n-1)/15);out.push([xs[i],ys[i]]);} return out;
}
$('#fCurve').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const txt=(await f.text()).trim(); let cur=null;
    if(txt.includes('ToneCurvePV2012')){   // Lightroom / Camera Raw preset: take only its tone curves
      cur={};
      for(const [c,tag] of [['rgb','ToneCurvePV2012'],['r','ToneCurvePV2012Red'],['g','ToneCurvePV2012Green'],['b','ToneCurvePV2012Blue']]){
        const m=txt.match(new RegExp('<crs:'+tag+'>([\\s\\S]*?)</crs:'+tag+'>')); if(!m) continue;
        const pts=[...m[1].matchAll(/<rdf:li>\s*([\d.]+)\s*,\s*([\d.]+)\s*<\/rdf:li>/g)].map(a=>[a[1]/255,a[2]/255]); if(pts.length>=2) cur[c]=lutToPts(pts.map(q=>q[0]),pts.map(q=>q[1]));
      }
    }
    else if(txt[0]==='{'||txt[0]==='['){const d=JSON.parse(txt); cur=d.curves||(Array.isArray(d)?{[ch]:d}:d);}
    else{
      const rows=txt.split(/\r?\n/).map(r=>r.split(/[,;\t]/).map(Number)).filter(r=>r.length>=2&&r.every(Number.isFinite)); if(rows.length<2) throw 0;
      const sc=rows.some(r=>r.some(v=>v>1.5))?255:1, xs=rows.map(r=>r[0]/sc), col=i=>lutToPts(xs,rows.map(r=>r[i]/sc)), nc=rows[0].length;
      cur=nc>=5?{rgb:col(1),r:col(2),g:col(3),b:col(4)}:nc===4?{r:col(1),g:col(2),b:col(3)}:{[ch]:col(1)};
    }
    if(!cur||!CH.some(c=>Array.isArray(cur[c]))) throw 0;
    S.curves=normalize({curves:Object.assign({},S.curves,cur)}).curves; sel=-1; requestRender(); commit(); toast(t('curveOk'));

function fillThumbs(){
  const job=++thumbJob; if(!gl||!img.prev) return; const items=[...thumbMap]; let i=0;
  const step=()=>{
    if(job!==thumbJob) return; const end=performance.now()+7;
    while(i<items.length&&performance.now()<end){
      const [c,p]=items[i++], {px,w,h}=drawSmall(Object.assign({},p.s,{masks:S.masks}),96,pools.thumb); c.width=w; c.height=h;
      const id=new ImageData(w,h); for(let y=0;y<h;y++) id.data.set(px.subarray((h-1-y)*w*4,(h-y)*w*4),y*w*4);
      c.getContext('2d').putImageData(id,0,0);
    }
    if(i<items.length) setTimeout(step,0); else requestRender();
  };
  setTimeout(step,40);

/* ---------- open photo ----------
   The picker opens through a native <label for>, with no scripted input.click(): some previews and
   mobile webviews block the scripted click. Decoding tries three paths. */
async function sniff(file){   // JPEG size and EXIF orientation read from the header, without decoding the image
  try{
    const b=new DataView(await file.slice(0,1<<20).arrayBuffer()); if(b.byteLength<4||b.getUint16(0)!==0xFFD8) return null;
    let o=2, ori=1;
    while(o+4<=b.byteLength){
      if(b.getUint8(o)!==0xFF) return null; const mk=b.getUint8(o+1), len=b.getUint16(o+2);
      if(mk===0xE1&&o+18<=b.byteLength&&b.getUint32(o+4)===0x45786966){
        const t0=o+10, le=b.getUint16(t0)===0x4949, ifd=t0+b.getUint32(t0+4,le);
        if(ifd+2<=b.byteLength){const n=b.getUint16(ifd,le);for(let i=0;i<n;i++){const e=ifd+2+i*12;if(e+12>b.byteLength)break;if(b.getUint16(e,le)===0x0112){ori=b.getUint16(e+8,le);break;}}}
      }
      if(mk>=0xC0&&mk<=0xCF&&mk!==0xC4&&mk!==0xC8&&mk!==0xCC){ if(o+9>b.byteLength) return null; let h=b.getUint16(o+5), w=b.getUint16(o+7); if(ori>=5&&ori<=8)[w,h]=[h,w]; return w&&h?{w,h}:null; }
      o+=2+len;
    }
  }catch(e){} return null;
}
const withTimeout=(pr,ms,msg)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);
function viaImage(file){

  const url=URL.createObjectURL(file);
  return load(url).catch(()=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file);}).then(load)).finally(()=>setTimeout(()=>URL.revokeObjectURL(url),1000));
}
/* Preview decode. Large JPEGs are decoded straight to preview size, so the full bitmap never has to
   stay in memory; the original file is decoded at full size only when exporting. */
async function decodePreview(file){
  const dim=await sniff(file), PM=PREV_MAX();
  if(window.createImageBitmap){
    if(dim&&Math.max(dim.w,dim.h)>PM){
      const k=PM/Math.max(dim.w,dim.h);
      try{ return {src:await createImageBitmap(file,{imageOrientation:'from-image',resizeWidth:Math.round(dim.w*k),resizeHeight:Math.round(dim.h*k),resizeQuality:'medium'}),ow:dim.w,oh:dim.h}; }catch(e){}
    }
    try{ const b=await createImageBitmap(file,{imageOrientation:'from-image'}); return {src:b,ow:b.width,oh:b.height,full:b}; }catch(e){}
    try{ const b=await createImageBitmap(file); return {src:b,ow:b.width,oh:b.height,full:b}; }catch(e){}
  }
  const im=await viaImage(file); return {src:im,ow:im.naturalWidth,oh:im.naturalHeight,full:im};
}
async function fullSource(){   // full-size pixels for export

  try{ return {src:await withTimeout(viaImage(img.file),40000,t('timeout')),temp:false}; }catch(e){}
  return null;
}

for(const ev of ['pointerup','pointerleave','pointercancel','blur']) bc.addEventListener(ev,()=>{if(cmpMode==='hold')setCmp(false);});
bc.addEventListener('click',()=>{if(cmpMode!=='hold')setCmp(!cmpOn);});
bc.addEventListener('keydown',e=>{if(cmpMode==='hold'&&(e.key===' '||e.key==='Enter'))setCmp(true);}); bc.addEventListener('keyup',()=>{if(cmpMode==='hold')setCmp(false);});
function syncCmp(){press('#cmpSeg',$(`#cmpSeg [data-c="${cmpMode}"]`));press('#dirSeg',$(`#dirSeg [data-d="${splitDir}"]`));}
$('#bCmpOpt').onclick=()=>{const p=$('#popCmp');p.hidden=!p.hidden;$('#bCmpOpt').setAttribute('aria-expanded',String(!p.hidden));};
$('#cmpSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cmpMode=b.dataset.c;setCmp(cmpMode==='split');syncCmp();});
$('#dirSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;splitDir=b.dataset.d;if(cmpMode!=='split'){cmpMode='split';}setCmp(true);syncCmp();});
$('#splitPos').addEventListener('input',e=>{splitPos=e.target.value/100;requestRender();});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeMenu();$('#pop').hidden=true;$('#popCmp').hidden=true; if(selMask&&!mdrag){selMask=null;renderMasks();requestRender();}}
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)&&e.target.type!=='range';
  if(typing) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();jump(e.shiftKey?1:-1);}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();jump(1);}
  else if(e.key==='\\'&&!e.repeat){ if(cmpMode==='hold') setCmp(true); else setCmp(!cmpOn); }
  else if((e.key==='Delete'||e.key==='Backspace')&&removable(sel)){e.preventDefault();removeNode(sel);}
});
addEventListener('keyup',e=>{if(e.key==='\\'&&cmpMode==='hold')setCmp(false);});
var tt=0; function toast(m,ms){const x=$('#toast');x.textContent=m;x.hidden=false;clearTimeout(tt);tt=setTimeout(()=>x.hidden=true,ms||3200);}

/* ---------- panels: docks, floating windows, icon bar ----------
   Every panel always lives in exactly one place: side dock, bottom dock, floating, or the icon bar
   (closed in a stash, or open as a flyout). The bar has a button for each panel, so none can get lost. */
const PANELS=[
  {id:'hist',icon:'M4 20V13M9 20V5M14 20v-9M19 20V9'},
  {id:'basic',icon:'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',reset:1},
  {id:'masks',icon:'M12 4a8 8 0 1 0 0 16a8 8 0 0 0 0-16M12 4v16M12 8l5-3M12 13l7-4M12 18l6-4',reset:1},
  {id:'curve',icon:'M4 20h16M4 20V4M5 19C12 19 12 5 19 5',reset:1},
  {id:'mix',icon:'M12 4a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M7.5 11a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9M16.5 11a4.5 4.5 0 1 0 0 9a4.5 4.5 0 0 0 0-9',reset:1},
  {id:'chmix',icon:'M5 6h14M5 12h14M5 18h14M8 4v4M15 10v4M11 16v4',reset:1},
  {id:'calib',icon:'M12 4l8 14H4zM12 4v14M8 11l8 0',reset:1},
  {id:'grade',icon:'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18M12 3v18M12 7l6 3M12 12l8 2M12 17l5 1',reset:1},
  {id:'gmap',icon:'M4 6h16v12H4zM9 6v12M14 6v12',reset:1},
  {id:'fx',icon:'M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3',reset:1},
  {id:'crop',icon:'M7 3v14h14M3 7h14v14',reset:1},
  {id:'nodes',icon:'M3 9h5v6H3zM16 4h5v6h-5zM16 14h5v6h-5zM8 12h4M12 7v10M12 7h4M12 17h4',reset:1},
  {id:'save',icon:'M12 5v14M5 12h14'},
  {id:'mine',icon:'M7 4h10v16l-5-4l-5 4z'},
  {id:'factory',icon:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'}
];
const IDS=PANELS.map(p=>p.id), ZONES=['side','bottom','float','bar'];
const app=$('#app'), work=$('#work'), dockS=$('#dockSide'), dockB=$('#dockBottom'), floats=$('#floats'), flyout=$('#flyout'), stash=$('#stash'), bar=$('#bar');
const cardOf=id=>document.querySelector(`.card[data-id="${id}"]`);
const LDEF=()=>({f:.667,side:'right',bh:260,cs:false,cb:false,q:'auto',order:IDS.slice(),
  p:Object.fromEntries(IDS.map((id,i)=>[id,{z:['save','mine','factory'].includes(id)?'bottom':'side',c:['chmix','calib','grade','gmap','fx','crop','nodes'].includes(id),x:90+i*26,y:110+i*18}]))});
var L=LDEF(), flyOpen=null;
try{
  const o=JSON.parse(localStorage.getItem(LS_L));
  if(o&&typeof o==='object'){
    L.f=num(o.f,L.f); L.bh=num(o.bh,L.bh); if(o.side==='left') L.side='left'; L.cs=!!o.cs; L.cb=!!o.cb; if(['2048','1280','800'].includes(String(o.q))) L.q=String(o.q);
    if(Array.isArray(o.order)){const ord=o.order.filter(id=>IDS.includes(id));L.order=[...new Set([...ord,...IDS])];}
    for(const id of IDS){const s=o.p&&o.p[id]; if(s&&typeof s==='object'){ if(ZONES.includes(s.z)) L.p[id].z=s.z; L.p[id].c=!!s.c; L.p[id].x=num(s.x,L.p[id].x); L.p[id].y=num(s.y,L.p[id].y); }}
  }
}catch(e){}
for(const p of PANELS){   // card header: tab (fold, drag) + action menu
  const c=cardOf(p.id), head=document.createElement('header'); head.className='card-head';
  head.innerHTML=`<div class="card-tab" role="button" tabindex="0"><span class="dot"></span><div><h2 data-i18n="p_${p.id}"></h2><small${TX['p_'+p.id+'_s']?` data-i18n="p_${p.id}_s"`:''}></small></div></div><button class="card-menu" type="button" aria-haspopup="menu"><i></i><i></i><i></i></button>`;
  c.prepend(head);
}
function setSub(id,txt){const s=cardOf(id).querySelector('.card-tab small');s.removeAttribute('data-i18n');s.textContent=txt;}
function setVars(){
  L.f=clamp(num(L.f,.667),.35,.85); L.bh=clamp(num(L.bh,260),120,Math.max(170,innerHeight*.7));
  app.style.setProperty('--f',L.f); app.style.setProperty('--bh',Math.round(L.bh)+'px');
}
function clampFloat(st){const r=app.getBoundingClientRect();st.x=clamp(st.x,0,Math.max(0,r.width-140));st.y=clamp(st.y,0,Math.max(0,r.height-70));}
function saveLayout(){try{localStorage.setItem(LS_L,JSON.stringify(L));}catch(e){}}
function applyLayout(){
  setVars(); app.dataset.side=L.side;
  if(flyOpen&&L.p[flyOpen].z!=='bar') flyOpen=null;
  let ns=0,nb=0; const last=new Map(), af=document.activeElement;
  for(const id of L.order){
    const st=L.p[id], c=cardOf(id), z=st.z, folded=z!=='bar'&&st.c;
    const host=z==='side'?dockS:z==='bottom'?dockB:z==='float'?floats:flyOpen===id?flyout:stash;
    /* move a card only when it is not already in place: re-inserting it would blur the field being typed in and close the touch keyboard */
    const prev=last.get(host), pe=c.previousElementSibling;
    if(!(c.parentNode===host&&(prev?pe===prev:!(pe&&pe.classList.contains('card'))))){
      if(prev) prev.after(c); else {const first=host.querySelector(':scope>.card'); if(first) host.insertBefore(c,first); else host.appendChild(c);}
    }
    last.set(host,c);
    if(z==='side')ns++; if(z==='bottom')nb++;
    if(z==='float'){clampFloat(st);c.style.left=st.x+'px';c.style.top=st.y+'px';} else {c.style.left='';c.style.top='';}
    c.classList.toggle('collapsed',folded);
    const tab=c.querySelector('.card-tab'), menu=c.querySelector('.card-menu'), name=t('p_'+id);
    tab.setAttribute('aria-expanded',String(!folded)); tab.title=t('fold'); menu.title=t('panelActions',name); menu.setAttribute('aria-label',menu.title);
  }
  app.classList.toggle('noside',!ns); app.classList.toggle('nobottom',!nb);
  app.classList.toggle('cside',!!L.cs); app.classList.toggle('cbottom',!!L.cb);
  { const ts=$('#togSide'), tb=$('#togBottom'), open=L.side==='left'?'‹':'›', shut=L.side==='left'?'›':'‹';
    ts.textContent=L.cs?shut:open; ts.title=t(L.cs?'showSide':'hideSide'); ts.setAttribute('aria-label',ts.title); ts.setAttribute('aria-expanded',String(!L.cs));
    tb.textContent=L.cb?'▴':'▾'; tb.title=t(L.cb?'showBottom':'hideBottom'); tb.setAttribute('aria-label',tb.title); tb.setAttribute('aria-expanded',String(!L.cb)); }
  bar.textContent='';
  for(const p of PANELS){
    const st=L.p[p.id], b=document.createElement('button'), cls=cardOf(p.id).className.match(/\b(color|pre|mask)\b/);
    b.type='button'; b.className='round-btn'+(cls?' '+cls[1]:'')+(st.z==='bar'?' inbar':'')+(flyOpen===p.id?' open':''); b.dataset.bar=p.id; b.title=t('p_'+p.id); b.setAttribute('aria-label',b.title);
    b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${p.icon}"/></svg>`; bar.appendChild(b);
  }
  press('#fSeg',$$('#fSeg button').find(x=>Math.abs(+x.dataset.f-L.f)<.005)||null);
  press('#sideSeg',$(`#sideSeg [data-side="${L.side}"]`)); press('#qSeg',$(`#qSeg [data-q="${L.q}"]`));
  saveLayout(); placeFlyout();
  if(af&&af!==document.activeElement&&af!==document.body&&af.isConnected&&af.offsetParent){try{af.focus({preventScroll:true});}catch(e){}}
  requestAnimationFrame(()=>{drawHist();drawCurve();drawOverlay();});
}
function placeFlyout(){
  if(!flyOpen||isMobile()){flyout.style.left=flyout.style.top='';return;}
  const a=app.getBoundingClientRect(), br=bar.getBoundingClientRect(), bt=bar.querySelector(`[data-bar="${flyOpen}"]`).getBoundingClientRect();
  const left=L.side==='left'?br.right-a.left+10:br.left-a.left-350;
  flyout.style.left=clamp(left,8,Math.max(8,a.width-348))+'px';
  flyout.style.top=clamp(bt.top-a.top-24,8,Math.max(8,a.height-flyout.offsetHeight-8))+'px';
}
function reveal(id){
  const st=L.p[id]; st.c=false; if(st.z==='side') L.cs=false; if(st.z==='bottom') L.cb=false;
  if(st.z==='float'){L.order=L.order.filter(x=>x!==id).concat(id);}
  applyLayout(); const c=cardOf(id);
  c.scrollIntoView({block:isMobile()?'start':'nearest',inline:'nearest',behavior:'smooth'}); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
}
function toggleFold(id){
  const st=L.p[id];
  if(st.z==='bar'){flyOpen=flyOpen===id?null:id;} else st.c=!st.c;
  applyLayout();
}
function moveTo(id,z){
  const st=L.p[id]; st.z=z; st.c=false;
  if(z==='float'){const r=app.getBoundingClientRect(),n=IDS.filter(x=>L.p[x].z==='float').length;st.x=Math.max(20,r.width*.5-170)+n*24;st.y=140+n*24;L.order=L.order.filter(x=>x!==id).concat(id);}
  if(z==='bar'){ if(flyOpen===id) flyOpen=null; applyLayout(); }
  else reveal(id);
}
bar.addEventListener('click',e=>{
  const b=e.target.closest('[data-bar]'); if(!b) return; const id=b.dataset.bar;
  if(L.p[id].z==='bar'){flyOpen=flyOpen===id?null:id;applyLayout();if(flyOpen&&isMobile())cardOf(id).scrollIntoView({block:'start',behavior:'smooth'});}
  else { reveal(id); if(id==='curve'&&isMobile()&&img.prev&&!curveOv) curveOver(true); }
});
/* tab: tap folds, drag floats the panel or drops it into a dock or the bar */
function zoneAt(e){
  const inside=el=>{const r=el.getBoundingClientRect();return r.width>0&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;};
  return inside(bar)?'bar':inside(dockS)?'side':inside(dockB)?'bottom':null;
}
document.addEventListener('pointerdown',e=>{
  const tab=e.target.closest('.card-tab'); if(!tab||e.button||tab.closest('.photo')) return;
  const c=tab.closest('.card'), id=c.dataset.id, st=L.p[id], sx=e.clientX, sy=e.clientY; let dragging=false, off=null;
  const mv=ev=>{
    if(!dragging){
      if(isMobile()||Math.hypot(ev.clientX-sx,ev.clientY-sy)<7) return;
      const r=c.getBoundingClientRect(); off=[Math.min(sx-r.left,300),sy-r.top];
      dragging=true; if(flyOpen===id) flyOpen=null; st.z='float'; st.c=false;
      L.order=L.order.filter(x=>x!==id).concat(id); applyLayout(); app.classList.add('dragging'); c.classList.add('drag');
    }
    const a=app.getBoundingClientRect(); st.x=ev.clientX-a.left-off[0]; st.y=ev.clientY-a.top-off[1]; c.style.left=st.x+'px'; c.style.top=st.y+'px';
    const z=zoneAt(ev); if(z) app.dataset.drop=z; else delete app.dataset.drop;
  };
  const up=ev=>{
    removeEventListener('pointermove',mv); removeEventListener('pointerup',up); removeEventListener('pointercancel',up);
    if(!dragging){ if(ev.type==='pointerup') toggleFold(id); return; }
    const z=zoneAt(ev); app.classList.remove('dragging'); delete app.dataset.drop; c.classList.remove('drag');
    if(z==='bar'){st.z='bar';}
    else if(z){
      const dock=z==='side'?dockS:dockB, kids=[...dock.children];
      const before=kids.find(k=>{const r=k.getBoundingClientRect();return z==='side'?ev.clientY<r.top+r.height/2:ev.clientX<r.left+r.width/2;});
      st.z=z; L.order=L.order.filter(x=>x!==id);
      if(before) L.order.splice(L.order.indexOf(before.dataset.id),0,id);
      else{const last=kids[kids.length-1]; if(last) L.order.splice(L.order.indexOf(last.dataset.id)+1,0,id); else L.order.push(id);}
    }
    applyLayout();
  };
  addEventListener('pointermove',mv); addEventListener('pointerup',up); addEventListener('pointercancel',up);
});
document.addEventListener('keydown',e=>{const tab=e.target.closest&&e.target.closest('.card-tab[role=button]');if(tab&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleFold(tab.closest('.card').dataset.id);}});
/* three dots: the panel's actions */
const menu=$('#menu');
const PANEL_ACTS={curve:[['expJson',()=>curveJson()],['expCsv',()=>curveCsv()],['expXmp',()=>curveXmp()],['impCurve','fCurve']]};
function closeMenu(){menu.hidden=true;menu.textContent='';}
function openMenu(btn){
  const id=btn.closest('.card').dataset.id, st=L.p[id], pn=PANELS.find(p=>p.id===id); menu.textContent='';
  const item=(key,fn)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');b.textContent=t(key);b.onclick=()=>{closeMenu();fn();};menu.appendChild(b);};
  if(pn.reset){item('mReset',()=>{RESET[id]();syncUI();requestRender();commit();});menu.appendChild(document.createElement('hr'));}
  if(PANEL_ACTS[id]){
    for(const [key,act] of PANEL_ACTS[id]){
      if(typeof act==='function'){item(key,act);continue;}
      const l=document.createElement('label');l.htmlFor=act;l.tabIndex=0;l.setAttribute('role','menuitem');l.textContent=t(key);   // native file picker, no scripted click
      l.onclick=()=>setTimeout(closeMenu,0); l.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();document.getElementById(act).click();closeMenu();}}; menu.appendChild(l);
    }
    menu.appendChild(document.createElement('hr'));
  }
  if(st.z!=='side') item('mSide',()=>moveTo(id,'side'));
  if(st.z!=='bottom') item('mBottom',()=>moveTo(id,'bottom'));
  if(st.z!=='float') item('mFloat',()=>moveTo(id,'float'));
  if(st.z!=='bar') item('mBar',()=>moveTo(id,'bar'));
  menu.hidden=false; const r=btn.getBoundingClientRect(), mw=menu.offsetWidth, mh=menu.offsetHeight;
  menu.style.left=clamp(r.right-mw,8,innerWidth-mw-8)+'px'; menu.style.top=clamp(r.bottom-4,8,innerHeight-mh-8)+'px';
}
document.addEventListener('click',e=>{
  const mb=e.target.closest('.card-menu');
  if(mb){ if(!menu.hidden){closeMenu();} else openMenu(mb); return; }
  if(!e.target.closest('#menu')) closeMenu();
  if(!e.target.closest('#pop')&&!e.target.closest('#bLayout')){$('#pop').hidden=true;$('#bLayout').setAttribute('aria-expanded','false');}
  if(!e.target.closest('#popCmp')&&!e.target.closest('#bCmpOpt')){$('#popCmp').hidden=true;$('#bCmpOpt').setAttribute('aria-expanded','false');}
});
$('#bLayout').onclick=()=>{const p=$('#pop');p.hidden=!p.hidden;$('#bLayout').setAttribute('aria-expanded',String(!p.hidden));};
$('#fSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){L.f=+b.dataset.f;applyLayout();}});
$('#sideSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){L.side=b.dataset.side;applyLayout();}});
$('#qSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;L.q=b.dataset.q;applyLayout();if(img.file)openFile(img.file,S.crop.slice());});
$('#bLayoutReset').onclick=()=>{L=LDEF();flyOpen=null;applyLayout();};
function dragSplit(el,fn){
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.split-tog')) return;
    if(el.id==='splitV'?L.cs:L.cb) return;   // collapsed: the divider only carries the button
    e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(err){}
    const mv=ev=>{fn(ev);setVars();placeFlyout();}, up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);applyLayout();};
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  });
}
$('#togSide').onclick=()=>{L.cs=!L.cs;applyLayout();}; $('#togBottom').onclick=()=>{L.cb=!L.cb;applyLayout();};
$('#splitV').ondblclick=()=>{L.cs=!L.cs;applyLayout();}; $('#splitH').ondblclick=()=>{L.cb=!L.cb;applyLayout();};
dragSplit($('#splitV'),e=>{const r=work.getBoundingClientRect();let f=(e.clientX-r.left)/r.width;if(L.side==='left')f=1-f;L.f=f;});
dragSplit($('#splitH'),e=>{L.bh=app.getBoundingClientRect().bottom-14-e.clientY-11;});
var rz=0; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(applyLayout,120);});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $$('[data-i18n]').forEach(n=>{n.textContent=t(n.dataset.i18n);});
  $$('[data-i18n-title]').forEach(n=>{n.title=t(n.dataset.i18nTitle);});
  $$('[data-i18n-ph]').forEach(n=>{n.placeholder=t(n.dataset.i18nPh);n.setAttribute('aria-label',n.placeholder);});
  view.dataset.drop=t('dropHere'); press('#langSeg',$(`#langSeg [data-lang="${lang}"]`));
  photoSub(); renderPresets(); renderMasks(); renderNodes(); syncCrop(); curveBtn(); syncCmp(); applyLayout();
}
$('#langSeg').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem(LS_LANG,lang);}catch(err){}applyLang();});

/* The graphics driver may postpone the real shader compilation to the first draw. Do that draw on a
   2 px dummy shortly after load, so the cost is not paid when the first photo opens. */
function warmUp(){
  if(img.prev||opening) return;
  try{
    const c=document.createElement('canvas'); c.width=c.height=2; gl.activeTexture(gl.TEXTURE0); upload(texImg,c,true); upload(texBlur,c,true);
    img.ow=img.oh=img.pw=img.ph=2;
    const base=Object.assign({},S,{off:{},masks:[]});
    const run=n=>{pipeline(base,pools.thumb,n,n,false,{crop:[0,0,1,1]});gl.bindFramebuffer(gl.FRAMEBUFFER,pools.thumb.fbo[0]);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4));gl.bindFramebuffer(gl.FRAMEBUFFER,null);};
    const time=n=>{let best=1e9;for(let i=0;i<2;i++){const t0=performance.now();run(n);best=Math.min(best,performance.now()-t0);}return best;};
    pipeline(Object.assign({},base,{masks:normMasks([{type:'lum'}])}),pools.thumb,2,2,false,{crop:[0,0,1,1]}); run(64);   // first draws, where drivers finish compiling
    // speed in ms per megapixel, from two sizes so fixed costs cancel; the preview is sized to render in about 45 ms
    const a=time(128), b=a>200?a*16:time(512), slope=(b-a)/((512*512-128*128)/1e6);
    if(slope>0) perfEdge=clamp(Math.round(Math.sqrt(45/slope*1e6*1.5)),640,2048);
  }catch(e){ console.warn(e); }
  img.ow=img.oh=img.pw=img.ph=0; glowKey='';
}

/* ---------- boot ---------- */
const glFail=err=>{ console.error(err);
  $('#view').innerHTML='<div class="fit" style="display:grid;place-items:center"><p style="max-width:40ch;text-align:center;color:var(--ink-2)">'+t('noWebgl')+'<br><br><span class="sp-small">'+String(err&&err.message||'').slice(0,300)+'</span></p></div>'; };
const glReady=initGL().then(()=>{ glOK=true; if(gfxMsg){gfxMsg=false;toast(t('gfxReady'));} });
var gfxMsg=false; setTimeout(()=>{ if(!glOK&&gl){gfxMsg=true;toast(t('gfxPrep'),120000);} },600);
glReady.then(()=>setTimeout(warmUp,150),glFail);
try{
  syncers.forEach(f=>f()); applyLang(); afterChange();
  const ro=new ResizeObserver(()=>{drawHist();drawCurve();drawOverlay();}); ro.observe($('#curve')); ro.observe($('#hist')); ro.observe(ovc);
  new ResizeObserver(()=>app.style.setProperty('--ph',$('.card.photo').offsetHeight+'px')).observe($('.card.photo'));
}catch(err){ console.error(err); toast(t('errGeneric',err.message),9000); }
</script>
