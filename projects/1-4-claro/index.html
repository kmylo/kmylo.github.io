<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuarto Claro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Theme inherited from color-picker-wheel: black folder-tab cards on neutral mid grey, pills,
   accents as information: green = light and tone, yellow = color, blue = masks, pink = presets, orange = warning.
   Layout: photo + icon bar + side dock on top, bottom dock below, floating panels above everything. */
:root{
  color-scheme:dark;
  --bg:#77777b; --card:#0a0a0b; --card-2:#141416; --card-3:#1c1c20; --line:#232328;
  --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#6b6b75;
  --green:#3dff6e; --yellow:#e4ff3a; --pink:#ff2e63; --orange:#ff5a1f; --blue:#4cc9ff;
  --r:28px; --display:'Barlow Condensed','Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:12px/1.4 'Inter',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent,var(--green));outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* layout */
.app{position:relative;height:100%;display:flex;flex-direction:column;--f:.667;--bh:260px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.work{flex:1;min-height:0;display:flex}
.app[data-side=left] .work{flex-direction:row-reverse}
.dock{scrollbar-width:thin;scrollbar-color:#2a2a2e transparent;border-radius:18px}
.dock.side{flex:calc(1 - var(--f)) 1 0;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:0 4px 20px 0}
.dock.bottom{flex:none;max-height:var(--bh);display:flex;gap:22px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.dock.bottom .card{width:340px}
.dock.bottom .card.wide{flex:1 1 380px;min-width:300px;width:auto}
.dock.bottom .card-body{max-height:calc(var(--bh) - 84px);overflow-y:auto;scrollbar-width:thin}
.dock.bottom .plist{flex-direction:row;flex-wrap:wrap}
.dock.bottom .prow{width:204px}
.split{flex:none;position:relative;touch-action:none}
.split::after{content:'';position:absolute;border-radius:4px;background:#111;opacity:.3;transition:opacity .15s}
.split:hover::after,.split:active::after{opacity:.95}
.split.v{width:18px;cursor:col-resize}
.split.v::after{left:7px;top:calc(50% - 22px);width:4px;height:44px}
.split.h{height:22px;cursor:row-resize}
.split.h::after{top:9px;left:calc(50% - 22px);height:4px;width:44px}
.app.noside .dock.side,.app.noside .split.v,.app.nobottom .dock.bottom,.app.nobottom .split.h{display:none}
/* drop targets while a panel is being dragged */
.app.dragging .dock,.app.dragging .bar{outline:2px dashed rgba(10,10,11,.45);outline-offset:-2px}
.app.dragging.noside .dock.side{display:flex;flex:0 0 150px}
.app.dragging.nobottom .dock.bottom{display:flex;min-height:84px}
.app[data-drop=side] .dock.side,.app[data-drop=bottom] .dock.bottom,.app[data-drop=bar] .bar{outline-color:var(--green);background:rgba(61,255,110,.1)}

/* icon bar: every panel has a button; panels sent to the bar open as a flyout */
.bar{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 10px;margin-right:12px;border-radius:18px;overflow-y:auto;scrollbar-width:none}
.app[data-side=left] .bar{margin:0 0 0 12px}
.round-btn{--accent:var(--green);width:36px;height:36px;border-radius:50%;border:none;background:var(--card);color:var(--ink-2);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.round-btn.color{--accent:var(--yellow)}.round-btn.pre{--accent:var(--pink)}.round-btn.mask{--accent:var(--blue)}
.round-btn:hover{color:var(--accent)}
.round-btn.inbar::after{content:'';position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.round-btn.open{background:var(--accent);color:#0a0a0b}
.round-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.floats{position:absolute;inset:0;pointer-events:none;z-index:15}
.floats .card{position:absolute;width:340px;pointer-events:none}
.floats .card-tab,.floats .card-menu,.floats .card-body{pointer-events:auto}
.flyout{position:absolute;z-index:20;width:340px}
.floats .card-body,.flyout .card-body{max-height:min(66vh,580px);overflow-y:auto;scrollbar-width:thin;box-shadow:0 22px 44px rgba(0,0,0,.5)}
.floats .card-menu,.flyout .card-menu{background:var(--card);border-radius:999px;padding:9px 10px;margin:0 0 8px 6px}
.floats .card-menu i,.flyout .card-menu i{background:var(--ink-2)}
.card.drag{opacity:.9}
.card.flash .card-tab .dot{animation:fl .9s ease}
@keyframes fl{50%{transform:scale(2.2)}}

.card{position:relative;--accent:var(--green);min-width:0;flex:none}
.card.color{--accent:var(--yellow)}
.card.pre{--accent:var(--pink)}
.card.mask{--accent:var(--blue)}
.card-head{display:flex;align-items:flex-end;justify-content:space-between}
.card-tab{position:relative;display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:14px 22px 6px 18px;min-width:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.photo .card-tab{cursor:default}
.card-tab::after{content:'';position:absolute;right:-28px;bottom:0;width:28px;height:28px;background:radial-gradient(circle at 100% 0,transparent 27.5px,var(--card) 28px);pointer-events:none}
.card-tab .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex:none}
.card-tab h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.1;white-space:nowrap}
.card-tab small{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phSub{max-width:min(46vw,420px)}
.card-menu{display:flex;gap:4px;padding:8px 10px 14px 6px;background:none;border:none;cursor:pointer}
.card-menu i{width:5px;height:5px;border-radius:50%;background:#111;display:block;transition:background .15s}
.card-menu:hover i{background:var(--accent)}
.card-body{background:var(--card);border-radius:0 var(--r) var(--r) var(--r);padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px}
.card.collapsed .card-body{display:none}
.card.collapsed .card-tab{border-radius:var(--r);padding-bottom:14px}
.card.collapsed .card-tab::after{display:none}
.menu{position:fixed;z-index:60;min-width:190px;background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 16px 34px rgba(0,0,0,.55)}
.menu button{text-align:left;background:none;border:0;color:var(--ink-2);padding:8px 11px;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--card-3);color:var(--ink)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* photo: the toolbar lives inside the canvas area, above the image */
.card.photo{flex:var(--f) 1 0;display:flex;flex-direction:column;min-height:0}
.app.noside .card.photo{flex:1 1 0}
.card.photo .card-body{flex:1;min-height:0;padding:10px}
.view{position:relative;flex:1;min-height:200px;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#18181b 0%,#0d0d0f 70%)}
.toolbar{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .pill-group{flex:none;flex-wrap:nowrap;background:rgba(28,28,32,.9)}
.fit{position:absolute;inset:58px 10px 10px}
#gl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#ovc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ovc.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.empty{position:absolute;inset:58px 10px 10px;display:grid;place-content:center;justify-items:center;text-align:center;gap:8px;padding:16px;cursor:pointer;border:1.5px dashed #34343c;border-radius:14px;color:var(--ink-3)}
.empty:hover{border-color:var(--green);color:var(--ink-2)}
.empty b{font-family:var(--display);font-weight:300;font-size:40px;line-height:1;color:var(--ink)}
.view.over::after{content:attr(data-drop);position:absolute;inset:10px;border:2px dashed var(--green);border-radius:16px;display:grid;place-items:center;background:rgba(10,10,11,.86);font-size:14px;z-index:4}
.view.busy::before{content:'';position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;border:3px solid #2a2a30;border-top-color:var(--green);animation:sp .7s linear infinite;z-index:5}
@keyframes sp{to{transform:rotate(360deg)}}
#badge{position:absolute;top:66px;left:18px;z-index:2}
.pop{position:absolute;top:56px;right:10px;z-index:8;width:min(310px,calc(100% - 20px));background:var(--card-2);border:1px solid var(--line);border-radius:18px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 30px rgba(0,0,0,.5)}

/* pills */
.pill-group{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--card-2);border-radius:999px;padding:3px}
.pop .pill-group{background:var(--card-3);align-self:flex-start}
.pill-btn{border:none;background:none;color:var(--ink-2);font-size:11px;font-weight:600;cursor:pointer;border-radius:999px;padding:5px 12px;white-space:nowrap;display:inline-block}
.pill-btn:hover{color:var(--ink)}
.pill-btn:disabled{opacity:.35;cursor:default}
.pill-btn.active{background:var(--accent);color:#0a0a0b}
.mx-btn{border-radius:999px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-block}
.mx-btn:hover{color:var(--accent)}
.mx-btn:disabled{opacity:.35;cursor:default;color:var(--ink-2)}
.mx-btn.warn:not(:disabled):hover{color:var(--orange)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600}
.pill.warn{background:var(--orange);color:#2a0d00}
.mx-head{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.mx-head:first-child{margin-top:0}
.sp-small{font-size:10.5px;color:var(--ink-3);margin:0;line-height:1.45}
.rowx{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rowx.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.stack:empty{display:none}

/* sliders */
.slider-row{display:grid;grid-template-columns:84px minmax(0,1fr) 46px;align-items:center;gap:8px}
.slider-row label{color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider-wrapper{position:relative;height:12px;border-radius:999px;background:var(--track,var(--card-3));box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.slider-wrapper.bi:not(.tr){background:linear-gradient(90deg,var(--card-3) calc(50% - 1px),var(--ink-3) 0,var(--ink-3) calc(50% + 1px),var(--card-3) 0)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:100%;background:transparent;position:absolute;top:0;left:0;margin:0;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:transparent}
input[type=range]::-moz-range-track{height:12px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:18px;width:18px;border-radius:50%;border:2.5px solid #fff;background:rgba(10,10,11,.45);margin-top:-3px;box-shadow:0 1px 4px rgba(0,0,0,.7)}
input[type=range]::-moz-range-thumb{height:14px;width:14px;border-radius:50%;border:2.5px solid #fff;background:rgba(10,10,11,.45)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number],.num{-moz-appearance:textfield;appearance:textfield;background:var(--card-2);border:1px solid var(--line);border-radius:8px;font-family:var(--display);font-size:15px;color:var(--ink);width:100%;text-align:right;padding:1px 6px}
input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}

/* histogram and curve */
#hist{width:100%;height:92px;display:block;background:var(--card-2);border-radius:18px}
#curve{width:100%;aspect-ratio:1/1;display:block;background:var(--card-2);border-radius:18px;touch-action:none;cursor:crosshair}
.big-num{font-family:var(--display);font-weight:300;font-size:34px;line-height:.95}
.big-num sup{font-size:.38em;vertical-align:top;margin-right:4px;color:var(--ink-2);font-weight:400;letter-spacing:.06em}
.node{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;background:var(--card-2);border-radius:18px;padding:10px 12px 8px}
.node .vals{display:flex;gap:14px}
.sw{width:26px;height:26px;border-radius:9px;border:1px solid var(--line);flex:none}

/* presets and mask rows */
.save{display:flex;gap:6px}
.save input{flex:1;min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px}
.plist{display:flex;flex-direction:column;gap:4px}
.plist:empty{display:none}
.prow{display:flex;align-items:center;gap:2px;border-radius:16px}
.prow.act{background:var(--card-2)}
.prow .go{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px;cursor:pointer;text-align:left;border-radius:16px;color:var(--ink-2);font-weight:500}
.prow .go:hover,.prow.act .go{color:var(--ink)}
.prow .go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .go small{color:var(--ink-3);font-weight:400;margin-left:auto;padding-right:4px;flex:none}
.prow.act .go::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none;margin-left:auto;margin-right:4px}
.prow.act .go small~*,.prow.act .go small+*{margin-left:0}
.prow.act .go:has(small)::after{margin-left:0}
.prow canvas{width:48px;height:34px;object-fit:cover;border-radius:10px;flex:none;background:var(--card-3)}
.prow .ic{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:4px 5px;border-radius:999px;font-size:12px;flex:none}
.prow .ic:hover{color:var(--accent)}
.prow .ic.warn{color:var(--orange);font-weight:600;font-size:11px}
.prow input{flex:1;min-width:0;background:var(--card-2);border:1px solid var(--accent);border-radius:999px;padding:5px 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);border-radius:999px;background:var(--card);border:1px solid var(--line);padding:8px 14px;font-size:12px;z-index:70;max-width:90vw}
#toast::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:1px}

/* narrow screens: one column; photo and icon bar stay pinned, the photo box takes the image's proportion */
@media (max-width:920px){
  html,body{height:auto}
  .app{height:auto;display:block;padding-top:0;padding-bottom:28px;--ph:0px}
  .work{display:contents}
  .split{display:none}
  .card.photo{position:sticky;top:0;z-index:12;background:var(--bg);padding-top:max(10px,env(safe-area-inset-top,0px))}
  .view{flex:none;min-height:0;height:min(52vh,calc((100vw - 72px) / var(--ar,1.6) + 68px))}
  .bar{position:sticky;top:var(--ph);z-index:11;width:auto;flex-direction:row;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;margin:0;padding:8px 2px;background:var(--bg);border-radius:0}
  .app[data-side] .bar{margin:0}
  .dock.side,.dock.bottom,.floats,.flyout{position:static;width:auto;display:flex;flex-direction:column;align-items:stretch;gap:20px;overflow:visible;max-height:none;padding:0;margin-top:20px;pointer-events:auto}
  .dock.side{margin-top:6px}
  .floats:empty,.flyout:empty{display:none}
  .card{scroll-margin-top:calc(var(--ph) + 64px)}
  .floats .card{position:static;width:auto;pointer-events:auto}
  .dock.bottom .card,.dock.bottom .card.wide{width:auto;min-width:0;flex:none}
  .card-body,.dock.bottom .card-body,.floats .card-body,.flyout .card-body{max-height:none;overflow:visible;box-shadow:none}
  .dock.bottom .plist{flex-direction:column}
  .dock.bottom .prow{width:auto}
  .floats .card-menu,.flyout .card-menu{background:none;padding:8px 10px 14px 6px;margin:0}
  .floats .card-menu i,.flyout .card-menu i{background:#111}
  .pop .desk{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<input type="file" id="fImg" class="vh" accept="image/*" tabindex="-1">
<input type="file" id="fJson" class="vh" accept=".json,application/json" tabindex="-1">
<main class="app" id="app">
  <div class="work" id="work">
    <section class="card photo">
      <header class="card-head"><div class="card-tab"><span class="dot"></span><div><h2>Cuarto Claro</h2><small id="phSub"></small></div></div></header>
      <div class="card-body">
        <div class="view" id="view">
          <div class="toolbar">
            <div class="pill-group"><label class="pill-btn active" for="fImg" id="bOpen" tabindex="0" role="button" data-i18n="open"></label></div>
            <div class="pill-group">
              <button class="pill-btn" id="bCmp" data-i18n="before" data-i18n-title="beforeTip"></button>
              <button class="pill-btn" id="bUndo" data-i18n="undo" title="Ctrl+Z"></button>
              <button class="pill-btn" id="bRedo" data-i18n="redo" title="Ctrl+Shift+Z"></button>
              <button class="pill-btn" id="bReset" data-i18n="reset" data-i18n-title="resetTip"></button>
            </div>
            <div class="pill-group" id="fmtSeg">
              <button class="pill-btn active" data-fmt="image/jpeg" aria-pressed="true">JPG</button>
              <button class="pill-btn" data-fmt="image/png" aria-pressed="false">PNG</button>
              <button class="pill-btn" id="bExport" style="color:var(--ink)" data-i18n="export"></button>
            </div>
            <div class="pill-group" style="margin-left:auto" id="langSeg">
              <button class="pill-btn" data-lang="en" aria-pressed="false" title="English">EN</button>
              <button class="pill-btn" data-lang="es" aria-pressed="false" title="Español">ES</button>
            </div>
            <div class="pill-group"><button class="pill-btn" id="bLayout" aria-expanded="false" data-i18n="layout"></button></div>
          </div>
          <div class="fit"><canvas id="gl" hidden></canvas><canvas id="ovc"></canvas></div>
          <label class="empty" id="empty" for="fImg"><b data-i18n="emptyTitle"></b><span data-i18n="emptySub"></span></label>
          <span class="pill warn" id="badge" hidden>ORIGINAL</span>
          <div class="pop" id="pop" hidden>
            <div class="mx-head desk"><span data-i18n="photoWidth"></span></div>
            <div class="pill-group desk" id="fSeg">
              <button class="pill-btn" data-f="0.5" aria-pressed="false">1/2</button>
              <button class="pill-btn" data-f="0.667" aria-pressed="false">2/3</button>
              <button class="pill-btn" data-f="0.75" aria-pressed="false">3/4</button>
              <button class="pill-btn" data-f="0.85" aria-pressed="false" data-i18n="max"></button>
            </div>
            <div class="mx-head desk"><span data-i18n="sideCol"></span></div>
            <div class="pill-group desk" id="sideSeg">
              <button class="pill-btn" data-side="right" aria-pressed="false" data-i18n="right"></button>
              <button class="pill-btn" data-side="left" aria-pressed="false" data-i18n="left"></button>
            </div>
            <p class="sp-small" data-i18n="layoutHint"></p>
            <div><button class="mx-btn" id="bLayoutReset" data-i18n="resetLayout"></button></div>
          </div>
        </div>
      </div>
    </section>
    <div class="split v" id="splitV"></div>
    <nav class="bar" id="bar" aria-label="Panels"></nav>
    <div class="dock side" id="dockSide">
      <section class="card" data-id="hist"><div class="card-body"><canvas id="hist"></canvas></div></section>
      <section class="card" data-id="basic"><div class="card-body" id="pBasic"></div></section>
      <section class="card mask" data-id="masks"><div class="card-body">
        <div class="mx-head"><span data-i18n="newMask"></span></div>
        <div class="rowx" id="maskAdd">

  grade:{sh:[40,0],hi:[40,0],balance:0},vignette:0,grain:0,

function normalize(o){
  const d=DEF(); if(!o||typeof o!=='object') return d;
  for(const k of NUMS) d[k]=num(o[k],d[k]);
  d.exposure=clamp(d.exposure,-5,5);
  for(const k of NUMS) if(k!=='exposure') d[k]=clamp(d[k],-100,100);
  d.bw=!!o.bw;
  for(const c of CH){
    const src=o.curves&&o.curves[c];
    if(Array.isArray(src)){
      const pts=src.filter(p=>Array.isArray(p)&&Number.isFinite(+p[0])&&Number.isFinite(+p[1])).map(p=>[clamp(+p[0]),clamp(+p[1])]).sort((a,b)=>a[0]-b[0]);
      const out=[]; for(const p of pts) if(!out.length||p[0]-out[out.length-1][0]>0.004) out.push(p);
      if(out.length>=2) d.curves[c]=out.slice(0,16);
    }
  }
  for(const k of ['hue','sat','lum']){
    const src=o.hsl&&o.hsl[k]; if(src&&typeof src==='object') for(let i=0;i<8;i++) d.hsl[k][i]=clamp(num(src[i],0),-100,100);
  }
  const g=o.grade||{};
  for(const k of ['sh','hi']) if(Array.isArray(g[k])) d.grade[k]=[clamp(num(g[k][0],40),0,360),clamp(num(g[k][1],0),0,100)];
  d.grade.balance=clamp(num(g.balance,0),-100,100);
  for(const k of ['r','g','b']){const src=o.cm&&o.cm[k]; if(Array.isArray(src)) for(let i=0;i<4;i++) d.cm[k][i]=clamp(num(src[i],d.cm[k][i]),i<3?-200:-100,i<3?200:100);}
  return d;
}

function normMasks(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(m=>m&&MTYPES.includes(m.type)).slice(0,12).map(m=>{
    const o={id:String(m.id||uid()),name:String(m.name||m.type).slice(0,30),type:m.type,on:m.on!==false,invert:!!m.invert,amt:clamp(num(m.amt,100),0,100),adj:MADJ()};

    if(m.type==='linear'){o.a=pt(m.a,[.5,.2]);o.b=pt(m.b,[.5,.55]);}
    if(m.type==='radial'){o.c=pt(m.c,[.5,.5]);o.rx=clamp(num(m.rx,.25),.005,3);o.ry=clamp(num(m.ry,.25),.005,3);o.feather=clamp(num(m.feather,50),0,100);}
    if(m.type==='brush'){o.size=clamp(num(m.size,12),1,60);o.hard=clamp(num(m.hard,30),0,95);o.flow=clamp(num(m.flow,60),1,100);

    return o;
  });
}

/* ---------- curves: monotone cubic spline ---------- */
function curveLUT(pts){
  const n=pts.length, xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), out=new Float32Array(256);
  const d=[], m=new Array(n);

  for(let i=0;i<n-1;i++){
    if(d[i]===0){m[i]=0;m[i+1]=0;continue;}
    const a=m[i]/d[i], b=m[i+1]/d[i], s=a*a+b*b;

  }
  let k=0;
  for(let j=0;j<256;j++){
    const x=j/255;
    if(x<=xs[0]){out[j]=ys[0];continue;}
    if(x>=xs[n-1]){out[j]=ys[n-1];continue;}

    const st=L.p[p.id], b=document.createElement('button'), cls=cardOf(p.id).className.match(/\b(color|pre|mask)\b/);
    b.type='button'; b.className='round-btn'+(cls?' '+cls[1]:'')+(st.z==='bar'?' inbar':'')+(flyOpen===p.id?' open':''); b.dataset.bar=p.id; b.title=t('p_'+p.id); b.setAttribute('aria-label',b.title);
    b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${p.icon}"/></svg>`; bar.appendChild(b);
  }
  press('#fSeg',$$('#fSeg button').find(x=>Math.abs(+x.dataset.f-L.f)<.005)||null);
  press('#sideSeg',$(`#sideSeg [data-side="${L.side}"]`));
  saveLayout(); placeFlyout();
  requestAnimationFrame(()=>{drawHist();drawCurve();drawOverlay();});
}
function placeFlyout(){
  if(!flyOpen||isMobile()){flyout.style.left=flyout.style.top='';return;}
  const a=app.getBoundingClientRect(), br=bar.getBoundingClientRect(), bt=bar.querySelector(`[data-bar="${flyOpen}"]`).getBoundingClientRect();
  const left=L.side==='left'?br.right-a.left+10:br.left-a.left-350;
  flyout.style.left=clamp(left,8,Math.max(8,a.width-348))+'px';
  flyout.style.top=clamp(bt.top-a.top-24,8,Math.max(8,a.height-flyout.offsetHeight-8))+'px';
}
function reveal(id){
  const st=L.p[id]; st.c=false;
  if(st.z==='float'){L.order=L.order.filter(x=>x!==id).concat(id);}
  applyLayout(); const c=cardOf(id);
  c.scrollIntoView({block:isMobile()?'start':'nearest',inline:'nearest',behavior:'smooth'}); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
}
function toggleFold(id){
  const st=L.p[id];
  if(st.z==='bar'){flyOpen=flyOpen===id?null:id;} else st.c=!st.c;
  applyLayout();
}
function moveTo(id,z){
  const st=L.p[id]; st.z=z; st.c=false;
  if(z==='float'){const r=app.getBoundingClientRect(),n=IDS.filter(x=>L.p[x].z==='float').length;st.x=Math.max(20,r.width*.5-170)+n*24;st.y=140+n*24;L.order=L.order.filter(x=>x!==id).concat(id);}
  if(z==='bar'){ if(flyOpen===id) flyOpen=null; applyLayout(); }
  else reveal(id);
}
bar.addEventListener('click',e=>{
  const b=e.target.closest('[data-bar]'); if(!b) return; const id=b.dataset.bar;
  if(L.p[id].z==='bar'){flyOpen=flyOpen===id?null:id;applyLayout();if(flyOpen&&isMobile())cardOf(id).scrollIntoView({block:'start',behavior:'smooth'});}
  else reveal(id);
});
/* tab: tap folds, drag floats the panel or drops it into a dock or the bar */
function zoneAt(e){
  const inside=el=>{const r=el.getBoundingClientRect();return r.width>0&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;};
  return inside(bar)?'bar':inside(dockS)?'side':inside(dockB)?'bottom':null;
}
document.addEventListener('pointerdown',e=>{
  const tab=e.target.closest('.card-tab'); if(!tab||e.button||tab.closest('.photo')) return;
  const c=tab.closest('.card'), id=c.dataset.id, st=L.p[id], sx=e.clientX, sy=e.clientY; let dragging=false, off=null;
  const mv=ev=>{
    if(!dragging){
      if(isMobile()||Math.hypot(ev.clientX-sx,ev.clientY-sy)<7) return;
      const r=c.getBoundingClientRect(); off=[Math.min(sx-r.left,300),sy-r.top];
      dragging=true; if(flyOpen===id) flyOpen=null; st.z='float'; st.c=false;
      L.order=L.order.filter(x=>x!==id).concat(id); applyLayout(); app.classList.add('dragging'); c.classList.add('drag');
    }
    const a=app.getBoundingClientRect(); st.x=ev.clientX-a.left-off[0]; st.y=ev.clientY-a.top-off[1]; c.style.left=st.x+'px'; c.style.top=st.y+'px';
    const z=zoneAt(ev); if(z) app.dataset.drop=z; else delete app.dataset.drop;
  };
  const up=ev=>{
    removeEventListener('pointermove',mv); removeEventListener('pointerup',up); removeEventListener('pointercancel',up);
    if(!dragging){ if(ev.type==='pointerup') toggleFold(id); return; }
    const z=zoneAt(ev); app.classList.remove('dragging'); delete app.dataset.drop; c.classList.remove('drag');
    if(z==='bar'){st.z='bar';}
    else if(z){
      const dock=z==='side'?dockS:dockB, kids=[...dock.children];
      const before=kids.find(k=>{const r=k.getBoundingClientRect();return z==='side'?ev.clientY<r.top+r.height/2:ev.clientX<r.left+r.width/2;});
      st.z=z; L.order=L.order.filter(x=>x!==id);
      if(before) L.order.splice(L.order.indexOf(before.dataset.id),0,id);
      else{const last=kids[kids.length-1]; if(last) L.order.splice(L.order.indexOf(last.dataset.id)+1,0,id); else L.order.push(id);}
    }
    applyLayout();
  };
  addEventListener('pointermove',mv); addEventListener('pointerup',up); addEventListener('pointercancel',up);
});
document.addEventListener('keydown',e=>{const tab=e.target.closest&&e.target.closest('.card-tab[role=button]');if(tab&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleFold(tab.closest('.card').dataset.id);}});
/* three dots: the panel's actions */
const menu=$('#menu');
function closeMenu(){menu.hidden=true;menu.textContent='';}
function openMenu(btn){
  const id=btn.closest('.card').dataset.id, st=L.p[id], pn=PANELS.find(p=>p.id===id); menu.textContent='';
  const item=(key,fn)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');b.textContent=t(key);b.onclick=()=>{closeMenu();fn();};menu.appendChild(b);};
  if(pn.reset){item('mReset',()=>{RESET[id]();syncUI();requestRender();commit();});menu.appendChild(document.createElement('hr'));}
  if(st.z!=='side') item('mSide',()=>moveTo(id,'side'));
  if(st.z!=='bottom') item('mBottom',()=>moveTo(id,'bottom'));
  if(st.z!=='float') item('mFloat',()=>moveTo(id,'float'));
  if(st.z!=='bar') item('mBar',()=>moveTo(id,'bar'));
  menu.hidden=false; const r=btn.getBoundingClientRect(), mw=menu.offsetWidth, mh=menu.offsetHeight;
  menu.style.left=clamp(r.right-mw,8,innerWidth-mw-8)+'px'; menu.style.top=clamp(r.bottom-4,8,innerHeight-mh-8)+'px';
}
document.addEventListener('click',e=>{
  const mb=e.target.closest('.card-menu');
  if(mb){ if(!menu.hidden){closeMenu();} else openMenu(mb); return; }
  if(!e.target.closest('#menu')) closeMenu();
  if(!e.target.closest('#pop')&&!e.target.closest('#bLayout')){$('#pop').hidden=true;$('#bLayout').setAttribute('aria-expanded','false');}
});
$('#bLayout').onclick=()=>{const p=$('#pop');p.hidden=!p.hidden;$('#bLayout').setAttribute('aria-expanded',String(!p.hidden));};
$('#fSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){L.f=+b.dataset.f;applyLayout();}});
$('#sideSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){L.side=b.dataset.side;applyLayout();}});
$('#bLayoutReset').onclick=()=>{L=LDEF();flyOpen=null;applyLayout();};
function dragSplit(el,fn){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(err){}
    const mv=ev=>{fn(ev);setVars();placeFlyout();}, up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);applyLayout();};
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  });
}
dragSplit($('#splitV'),e=>{const r=work.getBoundingClientRect();let f=(e.clientX-r.left)/r.width;if(L.side==='left')f=1-f;L.f=f;});
dragSplit($('#splitH'),e=>{L.bh=app.getBoundingClientRect().bottom-14-e.clientY-11;});
var rz=0; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(applyLayout,120);});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  $$('[data-i18n]').forEach(n=>{n.textContent=t(n.dataset.i18n);});
  $$('[data-i18n-title]').forEach(n=>{n.title=t(n.dataset.i18nTitle);});
  $$('[data-i18n-ph]').forEach(n=>{n.placeholder=t(n.dataset.i18nPh);n.setAttribute('aria-label',n.placeholder);});
  view.dataset.drop=t('dropHere'); press('#langSeg',$(`#langSeg [data-lang="${lang}"]`));
  photoSub(); renderPresets(); renderMasks(); applyLayout();
}
$('#langSeg').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem(LS_LANG,lang);}catch(err){}applyLang();});

/* ---------- boot ---------- */
try{
  if(!initGL()) throw new Error('no WebGL2');
  syncers.forEach(f=>f()); applyLang(); afterChange();
  const ro=new ResizeObserver(()=>{drawHist();drawCurve();drawOverlay();}); ro.observe($('#curve')); ro.observe($('#hist')); ro.observe(ovc);
  new ResizeObserver(()=>app.style.setProperty('--ph',$('.card.photo').offsetHeight+'px')).observe($('.card.photo'));
}catch(err){
  console.error(err);
  $('#view').innerHTML='<div class="fit" style="display:grid;place-items:center"><p style="max-width:34ch;text-align:center;color:var(--ink-2)">'+t('noWebgl')+'</p></div>';
}
</script>
</body>
